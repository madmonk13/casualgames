<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pac-Man</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#000;
  font-family:'Segoe UI',Arial,sans-serif;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  overflow:hidden;
  width:100dvw;
  height:100dvh;
}
canvas{
  display:block;
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:#000;
}
#hud{
  position:fixed;
  top:0;left:0;right:0;
  z-index:5;
  display:flex;
  justify-content:center;
  gap:4vw;
  padding:4px 0 2px;
  color:#fff;
  font-size:clamp(.7rem,2vw,1rem);
  pointer-events:none;
  background:rgba(0,0,0,.55);
}
#hud span{opacity:.8}
#hud b{color:#ff0}
#overlay{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.75);
  color:#ff0;
  text-align:center;
  gap:12px;
  pointer-events:none;
  opacity:0;
  transition:opacity .3s;
  z-index:10;
}
#overlay.show{opacity:1;pointer-events:auto}
#overlay h2{font-size:clamp(1.1rem,4vw,1.8rem);letter-spacing:3px;text-shadow:0 0 12px #fa0}
#overlay p{color:#aaa;font-size:clamp(.75rem,2vw,.95rem)}
#overlay button{
  margin-top:8px;
  padding:8px 24px;
  background:#ff0;
  color:#000;
  border:none;border-radius:6px;
  font-size:clamp(.85rem,2.5vw,1.1rem);font-weight:700;
  cursor:pointer;
  pointer-events:auto;
}
#overlay button:hover{background:#fa0}
#tip{
  position:fixed;
  bottom:4px;left:0;right:0;
  text-align:center;
  color:#444;
  font-size:clamp(.6rem,1.5vw,.75rem);
  pointer-events:none;
  z-index:5;
}
</style>
</head>
<body>
<div id="hud">
  <span>SCORE <b id="sc">0</b></span>
  <span>LEVEL <b id="lv">1</b></span>
  <span>LIVES <b id="li">❤️❤️❤️</b></span>
</div>
<canvas id="gc"></canvas>
<div id="tip">Arrow keys / WASD · Swipe on mobile</div>
<div id="overlay">
  <h2 id="ot">PAC-MAN</h2>
  <p id="op">Use arrow keys or WASD.<br>Swipe on mobile.</p>
  <button id="ob" onclick="onBtn()">START</button>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════════
const COLS = 21, ROWS = 23;

// Tile types
const W=0, D=1, P=2, E=3, O=4; // Wall, Dot, Power, Empty, dOor

// Directions: 0=Up 1=Right 2=Down 3=Left
const DX=[0,1,0,-1], DY=[-1,0,1,0];
const OPP=[2,3,0,1]; // opposite direction

// Ghost house (outer wall rows/cols, door)
const GH={r1:9,r2:13,c1:8,c2:12,dr:9,dc:10};

// Base speeds (tiles per second) — scaled up with level in startLevel()
const BASE_SPD={pac:5.5,pacFright:4,ghost:4.5,ghostFright:3,eaten:11};
let SPD={...BASE_SPD};

// Mode cycle (ms): alternating scatter / chase
const MODE_DUR=[7000,20000,7000,20000,5000,20000,5000,1e9];
const SCARED_MS=8000;

// Scoring
const SC_DOT=10, SC_PWR=50;
const SC_GHOST=[200,400,800,1600];

// Ghost colors
const GCOLS=['#e33','#f9f','#0ef','#fa0'];
const GHOST_SCATTER=[{r:1,c:COLS-2},{r:1,c:1},{r:ROWS-2,c:COLS-2},{r:ROWS-2,c:1}];
const RELEASE_DOTS=[0,0,30,60];

// Canvas / rendering
let TILE;
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');

// ═══════════════════════════════════════════════════════════════
//  PRNG
// ═══════════════════════════════════════════════════════════════
function makeRng(seed){
  let s=(seed^0x4b7c3f1d)>>>0;
  return ()=>{
    s^=s<<13; s^=s>>>17; s^=s<<5;
    return (s>>>0)/0x100000000;
  };
}
function shuffle(a,rng){
  for(let i=a.length-1;i>0;i--){
    const j=(rng()*(i+1))|0;
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ═══════════════════════════════════════════════════════════════
//  MAZE GENERATION  (DFS on left half → mirror → ghost house)
// ═══════════════════════════════════════════════════════════════
function generateMaze(level){
  const rng=makeRng(level*9371+54321);
  const g=Array.from({length:ROWS},()=>new Array(COLS).fill(W));

  function inGH(r,c){return r>=GH.r1&&r<=GH.r2&&c>=GH.c1&&c<=GH.c2;}

  // DFS: rooms at odd-row, odd-col positions on left half (c≤10)
  function carve(r,c){
    g[r][c]=E;
    const dirs=shuffle([0,1,2,3],rng);
    for(const d of dirs){
      const nr=r+DY[d]*2, nc=c+DX[d]*2;
      if(nr>0&&nr<ROWS-1&&nc>0&&nc<=10&&!inGH(nr,nc)&&g[nr][nc]===W){
        g[r+DY[d]][c+DX[d]]=E;
        carve(nr,nc);
      }
    }
  }
  carve(1,1);

  // Guard: would setting g[wr][wc]=E create a 2×2 open block?
  function creates2x2(wr,wc){
    for(let dr=-1;dr<=0;dr++){
      for(let dc=-1;dc<=0;dc++){
        let open=0, valid=true;
        for(let rr=wr+dr;rr<=wr+dr+1&&valid;rr++){
          for(let cc=wc+dc;cc<=wc+dc+1&&valid;cc++){
            if(rr<0||rr>=ROWS||cc<0||cc>=COLS){valid=false;break;}
            if(rr===wr&&cc===wc) open++;       // the cell being carved
            else if(g[rr][cc]!==W) open++;
          }
        }
        if(valid&&open===4) return true;
      }
    }
    return false;
  }

  // Add extra loops — only remove walls that don't open a 2×2 area
  for(let r=2;r<ROWS-2;r++){
    for(let c=2;c<=8;c++){
      if(g[r][c]===W&&!inGH(r,c)){
        const v=g[r-1][c]===E&&g[r+1][c]===E;
        const h=g[r][c-1]===E&&g[r][c+1]===E;
        if((v||h)&&rng()<0.30&&!creates2x2(r,c)) g[r][c]=E;
      }
    }
  }

  // Guarantee tunnel row has a corridor on left side
  if(g[11][1]===W){g[11][1]=E; if(g[11][2]===W)g[11][2]=E;}

  // Dead-end elimination on left half (repeat until stable).
  // Prefer carves that don't create a 2×2; fall back only if unavoidable.
  for(let pass=0;pass<8;pass++){
    let fixed=0;
    for(let r=1;r<ROWS-1;r++){
      for(let c=1;c<=10;c++){
        if(g[r][c]===W||inGH(r,c)) continue;
        let exits=0;
        const walls=[];
        for(let d=0;d<4;d++){
          const nr=r+DY[d],nc=c+DX[d];
          if(nc<0||nc>10||nr<0||nr>=ROWS||inGH(nr,nc)) continue;
          if(g[nr][nc]!==W) exits++;
          else if(nr>0&&nr<ROWS-1&&nc>0) walls.push([nr,nc,d]);
        }
        if(exits<=1&&walls.length){
          let carved=false;
          // Prefer: connect to an already-open cell without creating a 2×2
          for(const [wr,wc,d] of walls){
            const tr=r+DY[d]*2,tc=c+DX[d]*2;
            if(tr>0&&tr<ROWS-1&&tc>0&&tc<=10&&!inGH(tr,tc)&&g[tr][tc]!==W&&!creates2x2(wr,wc)){
              g[wr][wc]=E; carved=true; fixed++; break;
            }
          }
          // Fallback: extend into new space, still no 2×2
          if(!carved){
            for(const [wr,wc,d] of walls){
              const tr=r+DY[d]*2,tc=c+DX[d]*2;
              if(tr>0&&tr<ROWS-1&&tc>0&&tc<=10&&!inGH(tr,tc)&&!creates2x2(wr,wc)){
                g[wr][wc]=E; if(g[tr][tc]===W) g[tr][tc]=E; fixed++; break;
              }
            }
          }
          // If no 2×2-safe carve exists, leave the dead end — better a rare
          // dead end than a wide-open area.
        }
      }
    }
    if(!fixed) break;
  }

  // Mirror left half to right half
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<=10;c++)
      g[r][20-c]=g[r][c];

  // Stamp ghost house (overrides mirror)
  for(let r=GH.r1;r<=GH.r2;r++)
    for(let c=GH.c1;c<=GH.c2;c++) g[r][c]=W;
  // Interior
  for(let r=GH.r1+1;r<=GH.r2-1;r++)
    for(let c=GH.c1+1;c<=GH.c2-1;c++) g[r][c]=E;
  // Door (top center of house)
  g[GH.dr][GH.dc]=O;

  // Tunnel exits (wrap-around sides)
  g[11][0]=E; g[11][COLS-1]=E;

  // Ensure corridors adjacent to door exist above ghost house
  if(g[GH.dr-1][GH.dc]===W) g[GH.dr-1][GH.dc]=E;
  if(g[GH.dr-2][GH.dc]===W) g[GH.dr-2][GH.dc]=E;

  // Pac-Man start position
  g[ROWS-4][10]=E;
  if(g[ROWS-4][9]===W) g[ROWS-4][9]=E;
  if(g[ROWS-4][11]===W) g[ROWS-4][11]=E;

  // Fill all E cells with dots, then re-stamp exceptions
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      if(g[r][c]===E) g[r][c]=D;

  // Restore ghost house interior, door, tunnels
  for(let r=GH.r1+1;r<=GH.r2-1;r++)
    for(let c=GH.c1+1;c<=GH.c2-1;c++) g[r][c]=E;
  g[GH.dr][GH.dc]=O;
  g[11][0]=E; g[11][COLS-1]=E;

  // Pac-Man start clear
  g[ROWS-4][10]=E;

  // Power pellets near each corner (find nearest dot cell)
  const corners=[[1,1],[1,COLS-2],[ROWS-2,1],[ROWS-2,COLS-2]];
  for(const [cr,cc] of corners){
    let placed=false;
    for(let d=0;d<=3&&!placed;d++){
      for(let dr=-d;dr<=d&&!placed;dr++){
        for(let dc=-d;dc<=d&&!placed;dc++){
          if(Math.abs(dr)+Math.abs(dc)!==d) continue;
          const nr=cr+dr,nc=cc+dc;
          if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&g[nr][nc]===D){
            g[nr][nc]=P; placed=true;
          }
        }
      }
    }
  }

  // Count dots
  let dots=0;
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      if(g[r][c]===D||g[r][c]===P) dots++;

  return {grid:g,totalDots:dots};
}

// ═══════════════════════════════════════════════════════════════
//  PATHFINDING  (BFS backward from target → greedy forward)
// ═══════════════════════════════════════════════════════════════
function bfsDir(grid,fromR,fromC,toR,toC,excludeDir,allowDoor){
  if(fromR===toR&&fromC===toC) return -1;
  const INF=ROWS*COLS+1;
  const dist=Array.from({length:ROWS},()=>new Array(COLS).fill(INF));
  dist[toR][toC]=0;
  const q=[{r:toR,c:toC}]; let qi=0;
  while(qi<q.length){
    const {r,c}=q[qi++];
    const nd=dist[r][c]+1;
    for(let d=0;d<4;d++){
      const nr=r+DY[d]; let nc=c+DX[d];
      // tunnel
      if(nc<0) nc=COLS-1; else if(nc>=COLS) nc=0;
      if(dist[nr]?.[nc]<=nd) continue;
      const t=grid[nr]?.[nc];
      if(t===undefined||t===W) continue;
      if(t===O&&!allowDoor) continue;
      dist[nr][nc]=nd;
      q.push({r:nr,c:nc});
    }
  }
  let bestDir=-1,bestD=INF;
  for(let d=0;d<4;d++){
    if(d===excludeDir) continue;
    let nr=fromR+DY[d],nc=fromC+DX[d];
    if(nc<0) nc=COLS-1; else if(nc>=COLS) nc=0;
    const t=grid[nr]?.[nc];
    if(t===undefined||t===W) continue;
    if(t===O&&!allowDoor) continue;
    const v=dist[nr]?.[nc]??INF;
    if(v<bestD){bestD=v;bestDir=d;}
  }
  return bestDir;
}

// ═══════════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════════
let grid,totalDots,dotsEaten;
let pac,ghosts;
let score,lives,level;
let scaredTimer,ghostCombo;
let modeIdx,modeTime;
let phase,phaseTimer; // 'ready'|'playing'|'dying'|'won'|'gameover'
let inputDir=-1;
let lastTime=0;
let animId=null;

function globalMode(){return modeIdx%2===0?'scatter':'chase';}

function initGame(){
  score=0; lives=3; level=1;
  startLevel();
}

function startLevel(){
  document.getElementById('lv').textContent=level;
  // Scale speed with level (caps out)
  const boost=Math.min((level-1)*0.25,2);
  SPD={
    pac:BASE_SPD.pac+boost*0.8,
    pacFright:BASE_SPD.pacFright+boost*0.5,
    ghost:BASE_SPD.ghost+boost,
    ghostFright:BASE_SPD.ghostFright+boost*0.4,
    eaten:BASE_SPD.eaten,
  };
  const gen=generateMaze(level);
  grid=gen.grid; totalDots=gen.totalDots;
  dotsEaten=0; scaredTimer=0; ghostCombo=0;

  // Pac-Man start
  const pr=ROWS-4, pc=10;
  pac={
    r:pr, c:pc,
    fromR:pr, fromC:pc, toR:pr, toC:pc, progress:0,
    x:pc*TILE+TILE/2, y:pr*TILE+TILE/2,
    dir:3, nextDir:3,
    moving:false,
    mouth:0.15,   // fraction of PI (0=closed, 0.25=wide open)
    mouthDir:1,
    speed:SPD.pac,
  };
  tryMovePac(pac.nextDir);

  // Ghosts
  const starts=[
    {r:GH.dr-1, c:GH.dc, inHouse:false},
    {r:GH.r1+2, c:GH.dc,   inHouse:true},
    {r:GH.r1+2, c:GH.dc-1, inHouse:true},
    {r:GH.r1+2, c:GH.dc+1, inHouse:true},
  ];
  ghosts=GCOLS.map((col,i)=>{
    const s=starts[i];
    return{
      idx:i, color:col,
      r:s.r, c:s.c,
      fromR:s.r, fromC:s.c, toR:s.r, toC:s.c, progress:0,
      x:s.c*TILE+TILE/2, y:s.r*TILE+TILE/2,
      dir:i%2===0?2:0, // alternate down/up in house
      inHouse:s.inHouse,
      leaving:false,
      scared:false,
      eaten:false,
      releaseAt:RELEASE_DOTS[i],
      scaredBlink:false,
      moving:false,
    };
  });

  modeIdx=0; modeTime=MODE_DUR[0];

  phase='ready'; phaseTimer=2200;
  showOverlay('READY!','','');
  updateHUD();
}

// ═══════════════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════════════
function updateHUD(){
  document.getElementById('sc').textContent=score;
  document.getElementById('li').textContent='❤️'.repeat(Math.max(0,lives));
}

// ═══════════════════════════════════════════════════════════════
//  MOVEMENT HELPERS
// ═══════════════════════════════════════════════════════════════
function canWalkPac(r,c){
  if(r<0||r>=ROWS) return false;
  let cc=c; if(cc<0) cc=COLS-1; else if(cc>=COLS) cc=0;
  const t=grid[r][cc];
  return t===D||t===P||t===E;
}
function canWalkGhost(r,c,allowDoor){
  if(r<0||r>=ROWS) return false;
  let cc=c; if(cc<0) cc=COLS-1; else if(cc>=COLS) cc=0;
  const t=grid[r][cc];
  if(t===W||t===undefined) return false;
  if(t===O) return allowDoor;
  return true;
}

function tryMovePac(dir){
  const nr=pac.r+DY[dir];
  let nc=pac.c+DX[dir];
  if(nc<0) nc=COLS-1; else if(nc>=COLS) nc=0;
  if(!canWalkPac(nr,nc)) return false;
  pac.toR=nr; pac.toC=nc; pac.dir=dir; pac.moving=true; pac.progress=0;
  return true;
}

function tryMoveGhost(g,dir){
  const allowDoor=g.leaving||g.eaten; // can pass door when leaving house or returning
  const nr=g.r+DY[dir];
  let nc=g.c+DX[dir];
  if(nc<0) nc=COLS-1; else if(nc>=COLS) nc=0;
  if(!canWalkGhost(nr,nc,allowDoor)) return false;
  g.toR=nr; g.toC=nc; g.dir=dir; g.moving=true; g.progress=0;
  return true;
}

function interpolateX(from,to,t){
  if(Math.abs(to-from)>5){
    return t<0.5 ? from*TILE+TILE/2 : to*TILE+TILE/2;
  }
  return (from+(to-from)*t)*TILE+TILE/2;
}

function advancePac(dt){
  if(!pac.moving) return false;
  pac.progress+=pac.speed*dt/1000;
  pac.x=interpolateX(pac.fromC,pac.toC,pac.progress);
  pac.y=(pac.fromR+(pac.toR-pac.fromR)*pac.progress)*TILE+TILE/2;
  if(pac.progress>=1){
    pac.r=pac.toR; pac.c=pac.toC;
    pac.fromR=pac.r; pac.fromC=pac.c;
    pac.x=pac.c*TILE+TILE/2; pac.y=pac.r*TILE+TILE/2;
    pac.moving=false; pac.progress=0;
    return true; // arrived
  }
  return false;
}

function advanceGhost(g,spd,dt){
  if(!g.moving) return false;
  g.progress+=spd*dt/1000;
  g.x=interpolateX(g.fromC,g.toC,g.progress);
  g.y=(g.fromR+(g.toR-g.fromR)*g.progress)*TILE+TILE/2;
  if(g.progress>=1){
    g.r=g.toR; g.c=g.toC;
    g.fromR=g.r; g.fromC=g.c;
    g.x=g.c*TILE+TILE/2; g.y=g.r*TILE+TILE/2;
    g.moving=false; g.progress=0;
    return true;
  }
  return false;
}

// ═══════════════════════════════════════════════════════════════
//  GHOST LOGIC
// ═══════════════════════════════════════════════════════════════
function ghostTarget(g){
  if(g.eaten) return{r:GH.dr,c:GH.dc};
  if(globalMode()==='scatter') return GHOST_SCATTER[g.idx];
  switch(g.idx){
    case 0: // Blinky ("Shadow"): directly targets Pac-Man
      return{r:pac.r,c:pac.c};

    case 1:{ // Pinky ("Speedy"): 4 tiles ahead of Pac-Man
      // Replicates the classic overflow bug: when Pac faces Up, target shifts 4 left too
      let tr=pac.r+DY[pac.dir]*4;
      let tc=pac.c+DX[pac.dir]*4;
      if(pac.dir===0) tc-=4; // overflow: up direction → also -4 left
      return{r:Math.max(0,Math.min(ROWS-1,tr)),c:Math.max(0,Math.min(COLS-1,tc))};
    }

    case 2:{ // Inky ("Bashful"): vector from Blinky reflected through 2-ahead of Pac
      const pivR=pac.r+DY[pac.dir]*2;
      const pivC=pac.c+DX[pac.dir]*2;
      const bl=ghosts[0]; // Blinky
      return{
        r:Math.max(0,Math.min(ROWS-1,pivR*2-bl.r)),
        c:Math.max(0,Math.min(COLS-1,pivC*2-bl.c))
      };
    }

    case 3:{ // Clyde ("Pokey"): chases Pac if distance > 8, else retreats to corner
      const d=Math.abs(g.r-pac.r)+Math.abs(g.c-pac.c);
      return d>8?{r:pac.r,c:pac.c}:GHOST_SCATTER[3];
    }
  }
}

function decideGhostDir(g){
  const opp=OPP[g.dir];

  // Frightened: pseudo-random, non-reverse (classic Pac-Man behavior)
  if(g.scared){
    const dirs=[0,1,2,3].filter(d=>d!==opp);
    shuffle(dirs, makeRng((g.r*53+g.c*17+((Date.now()/100)|0))&0xfffffff));
    for(const d of dirs) if(tryMoveGhost(g,d)) return;
    tryMoveGhost(g,opp);   // dead-end: must reverse
    for(let d=0;d<4;d++) if(tryMoveGhost(g,d)) return; // absolute fallback
    return;
  }

  // Eaten: BFS to ghost house door — needs reliable pathfinding
  if(g.eaten){
    const d=bfsDir(grid,g.r,g.c,GH.dr,GH.dc,-1,true);
    if(d>=0){tryMoveGhost(g,d); return;}
    // Fallback
    tryMoveGhost(g,opp);
    for(let d=0;d<4;d++) if(tryMoveGhost(g,d)) return;
    return;
  }

  // Normal (scatter/chase): greedy Euclidean distance — the original algorithm.
  // At each tile center, pick the non-reverse neighbour closest (by Euclidean
  // distance) to the target. Tie-break priority: Up > Left > Down > Right.
  const tgt=ghostTarget(g);
  const PRIO=[0,3,2,1]; // U L D R
  let bestDir=-1, bestDist=Infinity;

  for(const d of PRIO){
    if(d===opp) continue;                    // no reversals
    let nr=g.r+DY[d], nc=g.c+DX[d];
    if(nc<0) nc=COLS-1; else if(nc>=COLS) nc=0;
    if(!canWalkGhost(nr,nc,g.leaving)) continue;
    const dist2=(nr-tgt.r)**2+(nc-tgt.c)**2; // squared Euclidean (monotone)
    if(dist2<bestDist){bestDist=dist2; bestDir=d;}
  }

  if(bestDir>=0){tryMoveGhost(g,bestDir); return;}

  // Dead-end: the only valid move is to reverse (happens in blind corridors)
  if(tryMoveGhost(g,opp)) return;

  // Absolute fallback — should never be needed in a well-formed maze
  for(let d=0;d<4;d++) if(tryMoveGhost(g,d)) return;
}

function updateGhosts(dt){
  for(const g of ghosts){
    if(g.inHouse){
      // Bounce vertically in house
      const spd=SPD.ghost*dt/1000;
      if(!g.moving){
        // Try bounce direction, flip if can't
        if(!tryMoveGhost(g,g.dir)){
          g.dir=OPP[g.dir];
          tryMoveGhost(g,g.dir);
        }
      }
      advanceGhost(g,SPD.ghost,dt);
      // Check if should leave
      if(dotsEaten>=g.releaseAt){
        g.inHouse=false; g.leaving=true; g.moving=false;
        // Move to door
      }
      continue;
    }

    if(g.leaving){
      // Move toward door exit (one tile above door)
      const exitR=GH.dr-1, exitC=GH.dc;
      if(!g.moving){
        const d=bfsDir(grid,g.r,g.c,exitR,exitC,-1,true);
        if(d>=0) tryMoveGhost(g,d);
        else{g.leaving=false; decideGhostDir(g);}
      }
      const arrived=advanceGhost(g,SPD.ghost,dt);
      if(arrived&&g.r===exitR&&g.c===exitC){
        g.leaving=false;
        decideGhostDir(g);
      }
      continue;
    }

    if(g.eaten){
      if(!g.moving) decideGhostDir(g);
      const arrived=advanceGhost(g,SPD.eaten,dt);
      if(arrived){
        if(g.r===GH.dr&&g.c===GH.dc){
          // Re-enter house
          g.eaten=false; g.scared=false; g.inHouse=true;
          g.r=GH.r1+2; g.c=GH.dc;
          g.fromR=g.r; g.fromC=g.c; g.toR=g.r; g.toC=g.c;
          g.x=g.c*TILE+TILE/2; g.y=g.r*TILE+TILE/2;
          g.moving=false; g.progress=0;
          g.releaseAt=dotsEaten+12; // brief pause before re-release
        } else {
          decideGhostDir(g);
        }
      }
      continue;
    }

    // Normal movement
    const spd=g.scared?SPD.ghostFright:SPD.ghost;
    if(!g.moving) decideGhostDir(g);
    advanceGhost(g,spd,dt);
  }
}

// ═══════════════════════════════════════════════════════════════
//  PAC-MAN LOGIC
// ═══════════════════════════════════════════════════════════════
function updatePac(dt){
  // Animate mouth
  pac.mouth+=dt*0.006*pac.mouthDir;
  if(pac.mouth>0.22){pac.mouth=0.22;pac.mouthDir=-1;}
  if(pac.mouth<0.01){pac.mouth=0.01;pac.mouthDir=1;}

  const arrived=advancePac(dt);
  if(arrived){
    eatCell();
    // Try queued direction first, then continue
    if(inputDir>=0&&inputDir!==pac.dir){
      if(tryMovePac(inputDir)){pac.dir=inputDir;}
      else tryMovePac(pac.dir);
    } else {
      tryMovePac(pac.dir);
    }
  } else if(!pac.moving&&inputDir>=0){
    // Stopped at wall, try new direction
    if(tryMovePac(inputDir)) pac.dir=inputDir;
  }
}

function eatCell(){
  const r=pac.r, c=pac.c;
  const t=grid[r][c];
  if(t===D){
    grid[r][c]=E; score+=SC_DOT; dotsEaten++;
    updateHUD();
    checkWin();
  } else if(t===P){
    grid[r][c]=E; score+=SC_PWR; dotsEaten++;
    updateHUD();
    scaredTimer=SCARED_MS;
    ghostCombo=0;
    for(const g of ghosts){
      if(!g.eaten&&!g.inHouse&&!g.leaving){
        // Classic Pac-Man: ghosts reverse direction when frightened starts
        if(!g.scared){g.dir=OPP[g.dir]; g.moving=false;}
        g.scared=true;
      }
    }
    checkWin();
  }
}

function checkWin(){
  if(dotsEaten>=totalDots){
    phase='won'; phaseTimer=1800;
  }
}

function checkGhostCollision(){
  for(const g of ghosts){
    if(g.inHouse||g.leaving) continue;
    const dx=pac.x-g.x, dy=pac.y-g.y;
    if(Math.sqrt(dx*dx+dy*dy)<TILE*0.65){
      if(g.eaten) continue;
      if(g.scared){
        // Eat the ghost
        g.eaten=true; g.scared=false; g.moving=false;
        score+=SC_GHOST[Math.min(ghostCombo,3)];
        ghostCombo++;
        updateHUD();
      } else {
        // Pac-Man dies
        phase='dying'; phaseTimer=1500;
        return;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════════════════════
function drawMaze(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const t=grid[r][c];
      const x=c*TILE, y=r*TILE;

      if(t===W){
        // Wall: check neighbors for rounded look
        ctx.fillStyle='#00c';
        ctx.fillRect(x,y,TILE,TILE);
        // Bright inner edge
        ctx.fillStyle='#44f';
        ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
        ctx.fillStyle='#00c';
        ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
        continue;
      }
      if(t===O){
        // Ghost house door
        ctx.fillStyle='#faa';
        ctx.fillRect(x,y+TILE*0.4,TILE,TILE*0.2);
        continue;
      }
      if(t===D){
        // Small dot
        ctx.fillStyle='#ffd';
        ctx.beginPath();
        ctx.arc(x+TILE/2,y+TILE/2,TILE*0.1,0,Math.PI*2);
        ctx.fill();
        continue;
      }
      if(t===P){
        // Power pellet (pulsing done via time-based alpha elsewhere)
        const pulse=0.7+0.3*Math.sin(Date.now()*0.006);
        ctx.fillStyle=`rgba(255,220,120,${pulse})`;
        ctx.beginPath();
        ctx.arc(x+TILE/2,y+TILE/2,TILE*0.28,0,Math.PI*2);
        ctx.fill();
      }
    }
  }
}

function drawPac(){
  const x=pac.x, y=pac.y, r=TILE*0.42;
  const angle=pac.mouth*Math.PI;

  // Rotation per direction
  const rot=[Math.PI,0,-Math.PI/2,Math.PI/2][pac.dir]??0; // actually:
  // dir 0=Up→mouth points up (rot=-PI/2), 1=Right→0, 2=Down→PI/2, 3=Left→PI
  const rotMap=[-Math.PI/2,0,Math.PI/2,Math.PI];
  const rot2=rotMap[pac.dir]??0;

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot2);
  ctx.fillStyle='#ff0';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,r,angle,-angle,false);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawGhost(g){
  if(g.inHouse&&!g.scared&&!g.eaten) {
    // Draw ghost normally inside house
  }
  const x=g.x, y=g.y, r=TILE*0.42;

  if(g.eaten){
    // Just eyes
    drawGhostEyes(x,y,g.dir,true);
    return;
  }

  let bodyColor;
  if(g.scared){
    const blink=scaredTimer<2000&&Math.floor(scaredTimer/250)%2===0;
    bodyColor=blink?'#fff':'#00f';
  } else {
    bodyColor=g.color;
  }

  ctx.fillStyle=bodyColor;
  // Body: half circle top + rectangular base with wavy bottom
  ctx.beginPath();
  ctx.arc(x,y,r,Math.PI,0,false);
  ctx.lineTo(x+r,y+r*0.8);
  // Wavy bottom
  const segs=3;
  const sw=r*2/segs;
  for(let i=segs;i>=0;i--){
    const bx=x-r+sw*(i+0.5);
    const by=y+r*0.8+(i%2===0?r*0.25:-r*0.25);
    ctx.lineTo(bx,by);
  }
  ctx.lineTo(x-r,y+r*0.8);
  ctx.closePath();
  ctx.fill();

  if(!g.scared){
    drawGhostEyes(x,y,g.dir,false);
  } else {
    // Scared face
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.1,r*0.12,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+r*0.3,y-r*0.1,r*0.12,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(x-r*0.35,y+r*0.3);
    ctx.lineTo(x-r*0.15,y+r*0.2);
    ctx.lineTo(x+r*0.05,y+r*0.3);
    ctx.lineTo(x+r*0.25,y+r*0.2);
    ctx.lineTo(x+r*0.4,y+r*0.3);
    ctx.stroke();
  }
}

function drawGhostEyes(x,y,dir,eatOnly){
  const r=TILE*0.42;
  // Eye whites
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(x-r*0.28,y-r*0.15,r*0.2,r*0.25,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+r*0.28,y-r*0.15,r*0.2,r*0.25,0,0,Math.PI*2); ctx.fill();
  // Pupils (look in movement direction)
  const pd=[{dx:0,dy:-1},{dx:1,dy:0},{dx:0,dy:1},{dx:-1,dy:0}][dir]??{dx:1,dy:0};
  ctx.fillStyle='#00f';
  ctx.beginPath(); ctx.arc(x-r*0.28+pd.dx*r*0.1,y-r*0.15+pd.dy*r*0.1,r*0.1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.28+pd.dx*r*0.1,y-r*0.15+pd.dy*r*0.1,r*0.1,0,Math.PI*2); ctx.fill();
}

function drawAll(){
  drawMaze();
  for(const g of ghosts) drawGhost(g);
  if(phase!=='dying') drawPac();
}

// ═══════════════════════════════════════════════════════════════
//  OVERLAY
// ═══════════════════════════════════════════════════════════════
const overlay=document.getElementById('overlay');
const oTitle=document.getElementById('ot');
const oText=document.getElementById('op');
const oBtn=document.getElementById('ob');

function showOverlay(title,text,btnText){
  oTitle.textContent=title;
  oText.innerHTML=text;
  oBtn.textContent=btnText;
  oBtn.style.display=btnText?'':'none';
  overlay.classList.add('show');
}
function hideOverlay(){overlay.classList.remove('show');}

let gameRunning=false;
function onBtn(){
  hideOverlay();
  if(!gameRunning){
    gameRunning=true;
    initGame();
    lastTime=performance.now();
    loop(lastTime);
  } else if(phase==='gameover'){
    initGame();
  } else if(phase==='levelend'){
    level++;
    startLevel();
  } else {
    phase='playing';
  }
}

// ═══════════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════════
function loop(ts){
  animId=requestAnimationFrame(loop);
  const dt=Math.min(ts-lastTime,50);
  lastTime=ts;

  if(phase==='ready'){
    phaseTimer-=dt;
    if(phaseTimer<=0){phase='playing'; hideOverlay();}
    drawAll();
    return;
  }

  if(phase==='dying'){
    phaseTimer-=dt;
    // Draw pac shrinking
    drawMaze();
    for(const g of ghosts) drawGhost(g);
    // Dying pac: spin and shrink
    const prog=1-Math.max(0,phaseTimer/1500);
    const cx=pac.x, cy=pac.y, r=TILE*0.42*(1-prog*0.9);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(prog*Math.PI*3);
    ctx.fillStyle=`rgba(255,220,0,${1-prog})`;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,0.3,-0.3,false);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    if(phaseTimer<=0){
      lives--;
      updateHUD();
      if(lives<=0){
        phase='gameover';
        showOverlay('GAME OVER',`Final score: ${score}`,'PLAY AGAIN');
      } else {
        // Respawn
        const pr=ROWS-4,pc2=10;
        pac.r=pr; pac.c=pc2; pac.fromR=pr; pac.fromC=pc2;
        pac.toR=pr; pac.toC=pc2;
        pac.x=pc2*TILE+TILE/2; pac.y=pr*TILE+TILE/2;
        pac.dir=3; pac.nextDir=3; pac.moving=false;
        // Reset ghosts
        ghosts.forEach((g,i)=>{
          const sr=[{r:GH.dr-1,c:GH.dc},{r:GH.r1+2,c:GH.dc},{r:GH.r1+2,c:GH.dc-1},{r:GH.r1+2,c:GH.dc+1}][i];
          g.r=sr.r; g.c=sr.c; g.fromR=sr.r; g.fromC=sr.c;
          g.toR=sr.r; g.toC=sr.c;
          g.x=sr.c*TILE+TILE/2; g.y=sr.r*TILE+TILE/2;
          g.dir=2; g.moving=false; g.scared=false; g.eaten=false;
          g.inHouse=i>0; g.leaving=false;
          g.releaseAt=RELEASE_DOTS[i];
        });
        scaredTimer=0;
        phase='ready'; phaseTimer=1800;
        showOverlay('READY!','','');
      }
    }
    return;
  }

  if(phase==='won'){
    phaseTimer-=dt;
    drawAll();
    if(phaseTimer<=0){
      showOverlay(`LEVEL ${level} CLEAR!`,`Score: ${score}`,'NEXT LEVEL');
      phase='levelend';
    }
    return;
  }

  if(phase==='gameover'||phase==='levelend') return;

  // === PLAYING ===

  // Mode timer (scatter/chase)
  if(scaredTimer<=0){
    modeTime-=dt;
    if(modeTime<=0){
      modeIdx++;
      modeTime=MODE_DUR[Math.min(modeIdx,MODE_DUR.length-1)];
      // Reverse all active ghosts on mode switch
      for(const g of ghosts){
        if(!g.inHouse&&!g.leaving&&!g.scared&&!g.eaten){
          g.dir=OPP[g.dir]; g.moving=false;
        }
      }
    }
  }

  // Scared timer
  if(scaredTimer>0){
    scaredTimer-=dt;
    if(scaredTimer<=0){
      scaredTimer=0;
      for(const g of ghosts) g.scared=false;
    }
  }

  updatePac(dt);
  updateGhosts(dt);
  if(phase==='playing') checkGhostCollision();
  drawAll();
}

// ═══════════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════════
const KEYMAP={
  ArrowUp:0,   w:0, W:0,
  ArrowRight:1,d:1, D:1,
  ArrowDown:2, s:2, S:2,
  ArrowLeft:3, a:3, A:3,
};
document.addEventListener('keydown',e=>{
  const d=KEYMAP[e.key];
  if(d!==undefined){e.preventDefault(); inputDir=d;}
});

// Touch swipe
let tx0=0,ty0=0;
canvas.addEventListener('touchstart',e=>{
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;
},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0;
  const dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
  if(Math.abs(dx)>Math.abs(dy)) inputDir=dx>0?1:3;
  else inputDir=dy>0?2:0;
},{passive:true});

// ═══════════════════════════════════════════════════════════════
//  RESIZE & INIT
// ═══════════════════════════════════════════════════════════════
function resize(){
  TILE=Math.floor(Math.min(window.innerWidth/COLS, window.innerHeight/ROWS));
  canvas.width=COLS*TILE;
  canvas.height=ROWS*TILE;
}

resize();
window.addEventListener('resize',()=>{resize(); if(grid) drawAll();});

// Show start overlay
showOverlay('PAC-MAN','Arrow keys / WASD<br>Swipe on mobile','START');

// Prevent space/arrow scroll
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
</script>
