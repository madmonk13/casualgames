<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100dvw;height:100dvh;background:#08060e;font-family:'Segoe UI',Arial,sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;}
#hud{width:100%;flex-shrink:0;background:rgba(0,0,0,.6);padding:4px 6px;overflow-x:auto;z-index:6;}
#board{display:flex;gap:2px;min-width:min-content;justify-content:center;}
.fr{border:1px solid #3a2d50;border-radius:3px;min-width:62px;background:#151022;}
.fr .fh{font-size:.72rem;text-align:center;color:#a08cc0;border-bottom:1px solid #3a2d50;padding:1px 0;}
.fr .tot{text-align:center;font-size:1.3rem;font-weight:800;line-height:30px;color:#ffd54a;font-variant-numeric:tabular-nums;}
.fr.warn .tot{color:#ff5a4a;} .fr.hot{border-color:#ff7ad9;} .fr.hot .tot{color:#ff7ad9;}
.fr.ftot{min-width:64px;} .fr.ftot .tot{color:#fff;}
.fr.fbest{min-width:56px;} .fr.fbest .tot{color:#8fe3ff;}
.fr.cur{border-color:#ffd54a;box-shadow:0 0 8px rgba(255,213,74,.4);}
@media (orientation:portrait){
  #hud{padding-left:0;padding-right:0;}
  #board{width:100vw;gap:1px;}
  .fr{flex:1 1 0;min-width:0;} .fr.ftot{flex:1.6 1 0;} .fr.fbest{flex:1.4 1 0;}
}
@media (max-width:420px){
  .fr .fh{font-size:.56rem;} .fr .tot{font-size:1rem;line-height:24px;}
}
#msg{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:clamp(1.4rem,5.5vw,2.4rem);font-weight:800;color:#ffd54a;
  text-shadow:0 2px 14px #000;pointer-events:none;letter-spacing:1px;z-index:5;}
#celebrate{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:15;pointer-events:none;opacity:0;
  font-weight:900;letter-spacing:5px;font-size:clamp(2.6rem,13vw,6.5rem);}
#celebrate.show{animation:celebpop 1.8s cubic-bezier(.2,.8,.3,1) forwards;}
#celebrate.gold{color:#ffd54a;text-shadow:0 0 34px rgba(255,170,0,.85),0 5px 0 #9a5600;}
#celebrate.pink{color:#ff7ad9;text-shadow:0 0 34px rgba(255,60,200,.85),0 5px 0 #7a0650;}
@keyframes celebpop{
  0%{opacity:0;transform:scale(.3) rotate(-9deg);}
  14%{opacity:1;transform:scale(1.18) rotate(3deg);}
  28%{transform:scale(1) rotate(0);}
  72%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(1.12);}
}
#stage{flex:1;width:100%;position:relative;cursor:grab;min-height:0;overflow:hidden;}
#stage.throwing{cursor:grabbing;}
#stage canvas{display:block;width:100%;height:100%;}
#loader{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(ellipse at center,#1d2a3a 0%,#06040c 100%);transition:opacity .45s;}
#loader.done{opacity:0;pointer-events:none;}
#fps{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:20;display:none;font:600 11px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#eafff0;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:6px;pointer-events:none;white-space:pre;text-align:center;}
#gfxNote{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:35;max-width:86vw;font:600 .85rem 'Segoe UI',Arial,sans-serif;color:#fff;background:rgba(20,14,34,.88);border:1px solid #3d3058;padding:9px 14px;border-radius:9px;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;}
#gfxNote.show{opacity:1;}
#busy{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(6,4,12,.72);opacity:0;pointer-events:none;transition:opacity .2s;}
#busy.show{opacity:1;pointer-events:auto;}
#busy .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd54a;animation:ldspin .8s linear infinite;}
#busy small{color:#e6dcf5;font:600 .8rem 'Segoe UI',Arial,sans-serif;letter-spacing:2px;}
#loader h1{margin:0;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:3px;color:#ffd54a;text-shadow:0 0 24px rgba(255,170,0,.5);font-family:'Segoe UI',Arial,sans-serif;}
#loader .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd54a;animation:ldspin .8s linear infinite;}
#loader small{color:#a99bc6;font:600 .8rem 'Segoe UI',Arial,sans-serif;letter-spacing:2px;}
@keyframes ldspin{to{transform:rotate(360deg)}}
#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, rgba(6,4,12,.3) 0%, rgba(6,4,12,.7) 100%);gap:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;padding:20px;}
#ov.show{opacity:1;pointer-events:auto;}
#ov h2{font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:2px;color:#ffd54a;text-shadow:0 0 20px rgba(255,170,0,.5);}
#ov p{color:#ddd3ee;font-size:clamp(.82rem,2.4vw,1rem);line-height:1.6;max-width:400px;text-shadow:0 1px 6px #000;}
#startbtn{margin-top:6px;padding:11px 34px;background:#ffd54a;color:#181000;border:none;border-radius:8px;
  font-size:clamp(.95rem,2.6vw,1.15rem);font-weight:800;cursor:pointer;letter-spacing:1px;}
#startbtn:hover{background:#ffe27a;}
#cog{position:fixed;left:12px;top:6vh;z-index:25;border:none;background:none;color:#ddd3ee;
  display:flex;align-items:center;justify-content:center;height:1em;font-size:4em;line-height:1;padding:0;
  opacity:0.9;cursor:pointer;transition:transform .15s,opacity .15s;}
#cog:hover{opacity:1;transform:rotate(45deg);}
#mute{position:fixed;right:12px;top:6vh;z-index:25;border:none;background:none;color:#ddd3ee;
  display:flex;align-items:center;justify-content:center;height:1em;font-size:4em;line-height:1;padding:0;
  opacity:0.9;cursor:pointer;transition:opacity .15s;}
#mute:hover{opacity:1;}
#mute svg,#cog svg{width:0.8em;height:0.8em;display:block;overflow:visible;
  /* dark outline + soft halo so the light icons read on any theme (bright beach sky, white cabinets…) */
  filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000) drop-shadow(0 0 3px rgba(0,0,0,.55));}
#settings{position:fixed;inset:0;z-index:26;display:none;align-items:center;justify-content:center;background:rgba(2,2,8,.62);}
#settings.open{display:flex;}
.modal-card{width:min(94vw,480px);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:16px;
  background:rgba(18,14,28,.98);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);}
@media (max-width:520px){ .modal-card{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:none;} }
.app-title{text-align:center;color:#ffd54a;font-size:1.6rem;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px rgba(255,170,0,.45);margin-bottom:-4px;}
.app-title .emoji{text-shadow:none;}
.modal-head{display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{color:#ffd54a;font-size:1.2rem;letter-spacing:1px;}
#settingsClose{background:none;border:none;color:#b7a6d6;font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer;}
#settingsClose:hover{color:#fff;}
.sec-label{color:#b7a6d6;font-size:.8rem;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
.grid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
.picker{display:flex;align-items:center;gap:6px;}
.picker .grid{flex:1 1 auto;min-width:0;}
.grid.scroll{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scroll-snap-type:x mandatory;touch-action:pan-x;}
.grid.scroll .tile{scroll-snap-align:center;}
.navbtn{flex:0 0 auto;width:30px;align-self:stretch;min-height:46px;border:1px solid #3d3058;border-radius:8px;
  background:#1d1630;color:#ddd3ee;font-size:1.4rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s;}
.navbtn:hover{border-color:#6a5a90;color:#fff;}
.navbtn:active{background:#2a2040;}
.tile{flex:0 0 62px;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:6px 4px;text-align:center;
  background:rgba(255,255,255,.05);transition:background .12s,border-color .12s;}
.tile:hover{background:rgba(255,255,255,.11);}
.tile.selected{border-color:#ffd54a;background:rgba(255,213,74,.14);}
.tile .thumb{width:100%;aspect-ratio:1;border-radius:50%;display:block;position:relative;background-size:200% 100%;background-position:center;overflow:hidden;}
.tile img.ball3d{width:100%;aspect-ratio:1;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));}
.tile .thumb::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 33% 27%, rgba(255,255,255,.6), rgba(255,255,255,0) 42%);
  box-shadow:inset -7px -9px 16px rgba(0,0,0,.6), inset 5px 5px 10px rgba(255,255,255,.12);}
.tile .label{font-size:.68rem;color:#ddd3ee;margin-top:5px;}
.tile.mtile{flex:0 0 116px;}
.tile.mtile .thumb{aspect-ratio:2/1;border-radius:6px;background-size:cover;}
.tile.mtile .thumb::after{display:none;}
.toggle{width:100%;padding:11px;border:1px solid #3d3058;border-radius:9px;background:#1d1630;color:#ddd3ee;
  font-size:.9rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .12s;}
.toggle:hover{border-color:#6a5a90;}
.toggle.on{background:#ffd54a;color:#181000;border-color:#ffd54a;}
.seg{display:flex;border:1px solid #3d3058;border-radius:9px;overflow:hidden;}
.seg label{flex:1;cursor:pointer;}
.seg input{position:absolute;opacity:0;pointer-events:none;}
.seg span{display:block;padding:9px 4px;text-align:center;background:#1d1630;color:#ddd3ee;font-size:.88rem;font-weight:700;border-left:1px solid #3d3058;transition:all .12s;}
.seg label:first-child span{border-left:none;}
.seg span small{display:block;font-size:.68rem;font-weight:600;opacity:.75;}
.seg input:checked+span{background:#ffd54a;color:#181000;}
.seg input:focus-visible+span{outline:2px solid #fff;outline-offset:-3px;}
.stats{display:flex;justify-content:space-around;color:#ddd3ee;font-size:.85rem;}
.stats b{display:block;font-size:1.25rem;color:#ffd54a;text-align:center;}
</style>
</head>

<!-- "Having trouble?" hint: shown after 3 scoreless throws in a row (once per visit; can be switched off) -->
<style>
#hintModal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(2,2,8,.55);}
#hintModal.open{display:flex;}
#hintModal .hint-card{width:min(88vw,360px);background:rgba(18,14,28,.98);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px 20px 16px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);text-align:center;color:#ece6f8;font-family:'Segoe UI',Arial,sans-serif;animation:hintpop .25s ease-out;}
@keyframes hintpop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#hintModal h3{color:#ffd54a;font-size:1.25rem;letter-spacing:.5px;margin:0 0 8px;}
#hintModal p{font-size:.95rem;line-height:1.5;margin:0 0 16px;color:#ddd3ee;}
#hintModal .hint-btns{display:flex;gap:10px;justify-content:center;}
#hintModal button{padding:10px 16px;border-radius:9px;font-weight:800;font-size:.9rem;cursor:pointer;border:1px solid #3d3058;background:#1d1630;color:#ddd3ee;}
#hintModal button.primary{background:#ffd54a;border-color:#ffd54a;color:#181000;}
#hintModal label{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;font-size:.78rem;color:#a99bc6;cursor:pointer;}
#hintModal input{accent-color:#ffd54a;}
</style>
<div id="hintModal" role="dialog" aria-modal="true" aria-labelledby="hintTitle">
  <div class="hint-card">
    <h3 id="hintTitle">Having trouble?</h3>
    <p id="hintText"></p>
    <div class="hint-btns"><button class="primary" id="hintSettings">Open Settings</button><button id="hintOk">Got it</button></div>
    <label><input type="checkbox" id="hintNever"> Don't show this again</label>
  </div>
</div>
<script>
// missHint.note(scored): call once per throw. Three scoreless throws in a row shows the hint (once per visit).
window.missHint=(function(){
  let key='hint', text='', misses=0, shown=false;
  const el=()=>document.getElementById('hintModal');
  function close(){ const m=el(); if(!m) return; if(document.getElementById('hintNever').checked){ try{ localStorage.setItem(key+'_hint_off','1'); }catch(e){} } m.classList.remove('open'); }
  function show(){ const m=el(); if(!m) return; document.getElementById('hintText').innerHTML=text; document.getElementById('hintNever').checked=false; m.classList.add('open'); shown=true; }
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('hintOk').addEventListener('click',close);
    document.getElementById('hintSettings').addEventListener('click',()=>{ close(); const c=document.getElementById('cog'); if(c) c.click(); });
    el().addEventListener('click',e=>{ if(e.target===el()) close(); });
  });
  return {
    setup(k,t){ key=k; text=t; },
    note(scored){ if(scored){ misses=0; return; } misses++;
      let off=false; try{ off=localStorage.getItem(key+'_hint_off')==='1'; }catch(e){}
      if(misses>=3&&!shown&&!off) setTimeout(show,900); },
    reset(){ misses=0; },
    isOpen(){ const m=el(); return !!m&&m.classList.contains('open'); },
  };
})();
</script>
<script>missHint.setup('justhoop','Your last few shots have missed.<br><b>Swipe sensitivity</b> can be adjusted in <b>Settings</b> — if shots come up short, try a higher setting; if they fly long, try a lower one.');</script>
<script src="lib/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  Arcade hoop shooter. All dimensions in inches, scaled to a
//  classic ball-return basketball cage with 7" mini balls.
// ═══════════════════════════════════════════════════════
let _fatalShown=false;
function showFatal(err){
  try{ console.error(err); }catch(e){}
  if(_fatalShown) return; _fatalShown=true;
  try{ const ov=document.getElementById('ov'); if(ov){ ov.classList.add('show');
    const p=ov.querySelector('p'); if(p) p.textContent='⚠ '+((err&&(err.message||err))+'').slice(0,200); } }catch(e){}
}
window.addEventListener('error',e=>showFatal(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showFatal(e.reason));

const DEG=Math.PI/180, G=386.1;                 // gravity, in/s²
const BALL_R=3.5;                               // 7" mini basketball, the size arcade hoop machines use
const NBALLS=6;                                 // balls in the machine
// round timing: 40 s, baskets worth 3 in the last 10 s, hit the target for a 20 s moving-hoop bonus round
const ROUND_T=40, HOT_T=10, BONUS_T=20, BONUS_TARGET=40, GRACE_T=1.8;
// cage: 46" between the side nets, ball-return ramp rising 9° away from the player
const CAGE_W=46, HW=CAGE_W/2, CAB_W=50, MACH_PITCH=62, WALL_X=HW-1;
const RAMP_Z0=14, RAMP_Y0=36, RAMP_ANG=9*DEG, SIN_R=Math.sin(RAMP_ANG), COS_R=Math.cos(RAMP_ANG), TAN_R=Math.tan(RAMP_ANG);
const TOWER_Z=120, CAGE_TOP=128, SIDE_Z0=-1.5, SIDE_Z1=TOWER_Z+8;
// backboard 38"×24"; rim 16½" across (to the tube centre), 6" above the board's bottom edge
const BB_Z=113, BB_T=1.25, BB_W=38, BB_Y0=78, BB_Y1=102;
const RIM_R=8.25, RIM_T=0.32, RIM_Y=84, RIM_Z=BB_Z-2.4-RIM_R;
const NET_L=15, NET_R1=5.2, NET_K=6, NET_M=12;
const LANE_W=CAGE_W, LANE_LEN=TOWER_Z-RAMP_Z0;    // ramp surface (called the "lane" so the theme textures size themselves)
const TRAY_Y=RAMP_Y0-2, TRAY_Z=7;
const HAND_Y=47, HAND_Z=-4, HAND_LIM=13;
const LAUNCH_ANG=60*DEG;
const MARQ_Y0=122, MARQ_Y1=146, MARQ_Z=TOWER_Z-2.5;
const DEF_S=6/(TOWER_Z-BB_Z), DEF_L=Math.hypot(1,DEF_S);   // backboard-top deflector slope
const E_RIM=0.5, E_BOARD=0.55, E_RAMP=0.5, E_WALL=0.4, E_BALL=0.6;

// derived frames
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const rampN=V3(0,COS_R,-SIN_R), rampD=V3(0,SIN_R,COS_R), RAMP_O=V3(0,RAMP_Y0,RAMP_Z0), UP=V3(0,1,0);

// walnut-stained oak veneer for the cabinet sides: long flat-sawn leaves, fine streaky grain, soft cathedral figure
function oakTex(){
  const W=PERF?512:1024, H=PERF?256:512, LEAF=10.4;   // spans the whole 152"×104" side panel
  const leafTone=[]; for(let i=0;i<12;i++) leafTone.push(0.9+NZ.rnd()*0.18);
  return shade(W,H,(x,y,o)=>{
    const wz=x/W*152, wy=y/H*104, leaf=Math.floor(wy/LEAF), ly=wy-leaf*LEAF, lz=(leaf&1)?152-wz:wz;
    // streaky long grain: high frequency across the leaf, very low along it
    const streak=NZ.fbm(lz*0.018+leaf*11,ly*1.7,4);
    const fine=NZ.n2(lz*0.09+leaf*3,ly*6.5);
    // soft cathedral arches (growth rings cut at a shallow angle)
    const c=ly*0.55+4.5*NZ.fbm(lz*0.01+leaf*5,ly*0.12,3)-0.0016*(lz-70-leaf*13)*(lz-70-leaf*13);
    const f=c*0.9-Math.floor(c*0.9), arch=sstep(0.55,0.9,f)*(1-sstep(0.9,1,f));
    let t=clamp(0.25+streak*0.5+fine*0.18+arch*0.22,0,1);
    const k=leafTone[leaf%12];
    let r=mix(132,74,t)*k, g=mix(86,46,t)*k, b=mix(50,24,t)*k;
    const pore=NZ.n2(lz*0.6+leaf*9,ly*14); if(pore>0.84){ r*=0.85; g*=0.83; b*=0.82; }
    if(ly<0.1||ly>LEAF-0.1){ r*=0.82; g*=0.82; b*=0.82; }        // veneer seam
    o[0]=r; o[1]=g; o[2]=b; o[3]=140-t*60-(pore>0.84?25:0);
  },true);
}

    const i=Math.floor(x/C), j=Math.floor(y/C), cx=(i+0.5)*C, cy=(j+0.5)*C, dir=((i+j)&1)?1:-1, a=Math.SQRT1_2;
    const dx=x-cx, dy=y-cy, lu=dx*a+dy*a*dir, lv=-dx*a*dir+dy*a;
    const e=(lu*lu)/169+(lv*lv)/10.24, lug=e<1?Math.sqrt(1-e):0;

    const scratch=NZ.n2(x/S*2,y/S*64,2,64)>0.8?12:0;
    const v=112+n+scratch+lug*44-(e>=1&&e<1.45?10:0)+(lug>0?(lu*dir>0?6:-6):0);
    o[0]=v*1.02; o[1]=v; o[2]=v*0.93; o[3]=60+lug*195;

// stencil lettering: heavy block type with the classic bridge gaps cut through each glyph, plus spray-paint edge grit
const STENCIL_FONT='"Arial Black","Arial Bold",Impact,sans-serif';
function stencilText(ctx,t,size,col,x,y,align){
  const f=`900 ${size}px ${STENCIL_FONT}`, mc=mkCanvas(2,2).getContext('2d'); mc.font=f;
  const tw=mc.measureText(t).width, pad=Math.ceil(size*0.3), w=Math.ceil(tw)+pad*2, h=Math.ceil(size*1.5);
  const c=mkCanvas(w,h), g=c.getContext('2d'); g.font=f; g.textBaseline='middle'; g.fillStyle=col; g.fillText(t,pad,h/2);
  g.globalCompositeOperation='destination-out';
  let acc=pad; const gw=Math.max(1.5,size*0.08);
  for(const ch of t){ const cw=g.measureText(ch).width;
    if(!/[1IJLT7MNWVXYK \-·_:!.,]/.test(ch)) g.fillRect(acc+cw*0.5-gw/2,0,gw,h);       // vertical bridge through the bowl
    if(/[8B]/.test(ch)) g.fillRect(acc,h/2-gw/2,cw,gw);                                  // 8/B get a waist bridge too
    acc+=cw; }
  for(let i=0;i<w*h/90;i++){ g.globalAlpha=0.35+Math.random()*0.5; g.beginPath(); g.arc(Math.random()*w,Math.random()*h,Math.random()*size*0.018+0.4,0,7); g.fill(); }
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  const ox=align==='left'?x-pad:x-w/2; ctx.drawImage(c,ox,y-h/2);
}
// deep-space nebula with stars (cached per size/seed)
const nebCache={};
function nebulaCanvas(W,H,k){
  const key=W+'x'+H+':'+(k||0); if(nebCache[key]) return nebCache[key];

  const c=shade(W,H,(x,y,o)=>{ const u=x/W*3+o1, v=y/H*3*asp+o1*0.5;
    const a=NZ.fbm(u*1.2,v*1.2,5), b=NZ.fbm(u*1.6+5.2,v*1.6+1.3,5), d=NZ.fbm(u*2.4+9.1,v*2.4+4.4,4);
    const n1=sstep(0.45,0.78,a), n2=sstep(0.5,0.8,b), n3=sstep(0.56,0.86,d);
    o[0]=Math.min(255,4+n1*95+n2*15+n3*160); o[1]=Math.min(255,5+n1*28+n2*105+n3*36); o[2]=Math.min(255,20+n1*150+n2*165+n3*120);
  },false).color;

    g.fillStyle=`rgba(${220+NZ.rnd()*35|0},${225+NZ.rnd()*30|0},255,${0.35+NZ.rnd()*0.65})`; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }

function sprayBlob(g,x,y,rx,ry,col,col2){
  const pts=[]; for(let i=0;i<14;i++){ const a=i/14*6.283, r=1+(NZ.rnd()-0.5)*0.35; pts.push([x+Math.cos(a)*rx*r,y+Math.sin(a)*ry*r]); }
  const path=(dx,dy)=>{ g.beginPath(); for(let i=0;i<=pts.length;i++){ const p=pts[i%pts.length], q=pts[(i+1)%pts.length], mx=(p[0]+q[0])/2+dx, my=(p[1]+q[1])/2+dy; i?g.quadraticCurveTo(p[0]+dx,p[1]+dy,mx,my):g.moveTo(mx,my); } g.closePath(); };
  g.lineJoin='round'; path(rx*0.08,ry*0.12); g.fillStyle='#111'; g.fill();
  path(0,0); g.lineWidth=Math.min(rx,ry)*0.22; g.strokeStyle='#fff'; g.stroke();
  const gr=g.createLinearGradient(0,y-ry,0,y+ry); gr.addColorStop(0,col); gr.addColorStop(1,col2); g.fillStyle=gr; g.fill();
  g.lineWidth=Math.min(rx,ry)*0.05; g.strokeStyle='#111'; g.stroke();

  g.fillStyle=col2; for(let i=0;i<3;i++){ const dx=x+(NZ.rnd()-0.5)*rx, L=ry*(0.4+NZ.rnd()*0.6), w=rx*0.06; g.fillRect(dx-w/2,y+ry*0.75,w,L); g.beginPath(); g.arc(dx,y+ry*0.75+L,w*0.9,0,7); g.fill(); }
}
function sprayArrow(g,x0,y0,x1,y1,bx,by,col,w){ const cx=(x0+x1)/2+bx, cy=(y0+y1)/2+by; g.lineCap='round';
  for(const [c,lw] of [['#111',w*1.7],['#fff',w*1.3],[col,w]]){ g.strokeStyle=c; g.lineWidth=lw; g.beginPath(); g.moveTo(x0,y0); g.quadraticCurveTo(cx,cy,x1,y1); g.stroke();
    const a=Math.atan2(y1-cy,x1-cx), h=lw*1.6; g.fillStyle=c; g.beginPath(); g.moveTo(x1+Math.cos(a)*h,y1+Math.sin(a)*h); g.lineTo(x1+Math.cos(a+2.3)*h,y1+Math.sin(a+2.3)*h); g.lineTo(x1+Math.cos(a-2.3)*h,y1+Math.sin(a-2.3)*h); g.closePath(); g.fill(); } }
function sprayBall(g,x,y,r){
  g.strokeStyle='#fff'; g.lineWidth=r*0.3; g.beginPath(); g.arc(x,y,r,0,7); g.stroke();
  const rg=g.createRadialGradient(x-r*0.35,y-r*0.35,r*0.1,x,y,r); rg.addColorStop(0,'#ffb060'); rg.addColorStop(1,'#c4500e'); g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  g.strokeStyle='#111'; g.lineWidth=r*0.08; g.beginPath(); g.arc(x,y,r,0,7); g.moveTo(x-r,y); g.lineTo(x+r,y); g.moveTo(x,y-r); g.lineTo(x,y+r); g.stroke();
  g.beginPath(); g.arc(x-r*1.25,y,r*0.95,-0.85,0.85); g.stroke(); g.beginPath(); g.arc(x+r*1.25,y,r*0.95,Math.PI-0.85,Math.PI+0.85); g.stroke();
  g.strokeStyle='#fff'; g.lineWidth=r*0.1; for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(x-r*1.5-i*r*0.2,y-r*0.5+i*r*0.5); g.lineTo(x-r*2.3-i*r*0.2,y-r*0.5+i*r*0.5); g.stroke(); }   // speed lines

    for(let y=0;y<=H;y+=1.5*s){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); } }

  if(B.tags){ sprayTag(g,'KING',5.5*s,H-4.5*s,2.4*s,SPRAY[0],{rot:-0.15,drips:2}); sprayTag(g,'ace',BB_W*s-6*s,H-4.5*s,2.6*s,'#111111',{thin:true,rot:0.1});
    splatter(g,W-4*s,4*s,2.5*s,SPRAY[1]); }

    else hoopX+=(0-hoopX)*(1-Math.exp(-dt*3));
    const hv=dt>0?(hoopX-prevHX)/dt:0, ha=dt>0?(hv-prevHV)/dt:0; prevHX=hoopX; prevHV=hv;
    if(hoopGroup) hoopGroup.position.x=hoopX;
    if(!hand) feedHand();
    const n=Math.max(1,Math.ceil(dt*1000)); for(let k=0;k<n;k++) physStep(dt/n);
    stepNet(dt,ha);
    stepAnims(dt);
    if(msgT>0){ msgT-=dt; if(msgT<=0) document.getElementById('msg').textContent=''; }
    marqT+=dt; if(marqFlash>0) marqFlash-=dt;
    if(curTheme().board.ledEdge) M.bbFrame.emissiveIntensity=marqFlash>0?((marqPhase&1)?2.6:0.4):(phase==='buzzer'?2.6:0.35);   // LED edge flashes on baskets & the buzzer
    if(curTheme().decor) animateDecor(t/1000);
    if(curTheme().back==='rain'){ rainT+=dt; if(rainT>0.07){ rainT=0; stepRain(); } }
    if(marqT>(marqFlash>0?0.09:(PERF?0.3:0.16))){ marqT=0; marqPhase++; drawMarquee(); }
    if(renderer){ syncBalls(dt); syncAim(); updateCamera();
      if(NET.sim){ _eye.copy(camera.position); _eye.x-=hoopX; writeNet(NET.geo,NET.P,NET.segs,_eye); }
      renderer.render(scene,camera); }
  }catch(err){ showFatal(err); }
  perfSample(raw,performance.now()-c0);
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  INPUT — drag sideways to line up, flick up to shoot
// ═══════════════════════════════════════════════════════
const handPlane=new THREE.Plane(new THREE.Vector3(0,0,1),-HAND_Z);
const _hit=new THREE.Vector3();
let dragging=false, samples=[], handX=0, handLift=0, dragY0=0, dragX0=null, handX0=0;
const MIN_HPS=0.35;
function canShoot(){ return phase==='play'&&!!hand&&hand.mode==='hand'; }
function ptrX(e){
  const r=renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera({x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1},camera);
  return raycaster.ray.intersectPlane(handPlane,_hit)?_hit.x:null;
}
function samp(e){ return {px:e.clientX,py:e.clientY,t:performance.now(),x:ptrX(e)}; }
function flick(c){
  let ref=samples[0]; for(let i=samples.length-1;i>=0;i--){ if(c.t-samples[i].t>=70){ ref=samples[i]; break; } }
  const dt=Math.max(0.025,(c.t-ref.t)/1000), H=stage.clientHeight||600, dy=ref.py-c.py;
  return {hps:dy/dt/H, dir:-(c.px-ref.px)/Math.max(12,dy)};   // screen-right is world -x
}
function release(f){
  dragging=false; stage.classList.remove('throwing'); handLift=0;
  if(!canShoot()) return;
  shoot(clamp((170+26*f.hps)*settings.power,130,460),f.dir);
}
function pdown(e){
  if(!canShoot()) return; e.preventDefault(); getAC(); initSfx();
  dragging=true; stage.classList.add('throwing'); try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(_){}
  const s=samp(e); samples=[s]; dragY0=s.py; dragX0=s.x; handX0=handX;
}
function pmove(e){
  if(!dragging) return; e.preventDefault();
  const s=samp(e); samples.push(s); if(samples.length>120) samples.shift();
  if(s.x!=null&&dragX0!=null) handX=clamp(handX0+(s.x-dragX0),-HAND_LIM,HAND_LIM);
  const H=stage.clientHeight||600; handLift=clamp((dragY0-s.py)/H*24,0,4);
  if(dragY0-s.py>H*0.12){ const f=flick(s); if(f.hps>=MIN_HPS) release(f); }   // flick carried far enough: let go
}
function pup(e){
  if(!dragging) return; e.preventDefault(); dragging=false; stage.classList.remove('throwing');
  const s=samp(e); samples.push(s); const f=flick(s);
  if(f.hps>=MIN_HPS&&dragY0-s.py>8) release(f); else { handLift=0; if(f.hps>0.12) flash('Flick up faster to shoot'); }
}
function bindInput(){
  const el=renderer.domElement;
  el.addEventListener('pointerdown',pdown); el.addEventListener('pointermove',pmove);
  el.addEventListener('pointerup',pup); el.addEventListener('pointercancel',pup);
}

// ═══════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════
function saveSettings(){ try{ localStorage.setItem('justhoop',JSON.stringify(settings)); }catch(e){} }
function loadSettings(){ try{ const raw=JSON.parse(localStorage.getItem('justhoop')||'{}'); Object.assign(settings,raw); if(raw.gfx==null&&raw.optimized) settings.gfx='low'; }catch(e){} if(!BALL_TYPES.some(b=>b.id===settings.ball)) settings.ball='classic'; if(!THEMES.some(t=>t.id===settings.theme)) settings.theme='classic'; }
function saveStats(){ try{ localStorage.setItem('justhoop_stats',JSON.stringify(stats)); }catch(e){} }
function loadStats(){ try{ Object.assign(stats,JSON.parse(localStorage.getItem('justhoop_stats')||'{}')); }catch(e){} }
function refreshStats(){ document.getElementById('stBest').textContent=stats.best; document.getElementById('stGames').textContent=stats.games; document.getElementById('stTix').textContent=stats.tickets; }
function setupSettings(){
  loadSettings(); loadStats();
  const tg=document.getElementById('themeGrid');
  for(const th of THEMES){ const t=document.createElement('div'); t.className='tile mtile'; t.dataset.key=th.id;
    const pv=marqueeBase(th,mkCanvas(1024,512)), sm=mkCanvas(256,128); sm.getContext('2d').drawImage(pv,0,0,256,128);
    t.innerHTML=`<div class="thumb" style="background-image:url('${sm.toDataURL('image/jpeg',0.85)}')"></div><div class="label">${th.label}</div>`;
    t.addEventListener('click',()=>{ if(settings.theme===th.id) return; busyThen(()=>{ applyTheme(th.id); highlightTheme(); }); }); tg.appendChild(t); }
  const highlightTheme=()=>document.querySelectorAll('#themeGrid .tile').forEach(t=>t.classList.toggle('selected',t.dataset.key===settings.theme));
  highlightTheme();
  const scrollToSel=(grid,smooth)=>{ const sel=grid.querySelector('.tile.selected'); if(!sel) return;   // centre the selected tile in its strip
    const cr=grid.getBoundingClientRect(), sr=sel.getBoundingClientRect(); grid.scrollTo({left:grid.scrollLeft+(sr.left-cr.left)-(grid.clientWidth-sel.offsetWidth)/2,behavior:smooth?'smooth':'auto'}); };
  const scrollToTheme=(smooth)=>{ scrollToSel(tg,smooth); scrollToSel(document.getElementById('ballGrid'),smooth); };
  document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{
    const tiles=[...document.getElementById(b.dataset.grid).querySelectorAll('.tile')]; let i=tiles.findIndex(t=>t.classList.contains('selected'));
    const ni=clamp((i<0?0:i)+(+b.dataset.dir),0,tiles.length-1); if(ni!==i){ tiles[ni].click(); requestAnimationFrame(()=>scrollToSel(document.getElementById(b.dataset.grid),true)); } }));
  const bg=document.getElementById('ballGrid');
  for(const b of BALL_TYPES){ const t=document.createElement('div'); t.className='tile'; t.dataset.key=b.id;
    t.innerHTML=`<img class="ball3d" alt="" src="${ballThumb(b.id)}"><div class="label">${b.label}</div>`;
    t.addEventListener('click',()=>{ applyBall(b.id); highlightBall(); }); bg.appendChild(t); }
  const highlightBall=()=>document.querySelectorAll('#ballGrid .tile').forEach(t=>t.classList.toggle('selected',t.dataset.key===settings.ball));
  highlightBall();
  _muted=!!settings.muted; const muteBtn=document.getElementById('mute'); muteBtn.innerHTML=muteIcon(_muted); muteBtn.title=_muted?'Unmute':'Mute';
  muteBtn.addEventListener('click',()=>{ getAC(); applyMute(!_muted); });
  const placeCtrls=()=>{ const hud=document.getElementById('hud'); const top=((hud?hud.offsetHeight:0)+10)+'px'; document.getElementById('cog').style.top=top; muteBtn.style.top=top; };
  placeCtrls(); requestAnimationFrame(placeCtrls); window.addEventListener('resize',placeCtrls); window.addEventListener('orientationchange',()=>setTimeout(placeCtrls,120));
  const modal=document.getElementById('settings');
  document.getElementById('cog').addEventListener('click',()=>{ refreshStats(); modal.classList.add('open'); highlightTheme(); requestAnimationFrame(()=>scrollToTheme(false)); });
  document.getElementById('settingsClose').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('open'); });
  const bonusBtn=document.getElementById('setBonus'), guideBtn=document.getElementById('setGuide'), optBtn=document.getElementById('setFps');
  const refresh=()=>{
    bonusBtn.classList.toggle('on',settings.bonus); bonusBtn.textContent='Bonus round (moving hoop): '+(settings.bonus?'On':'Off');
    guideBtn.classList.toggle('on',settings.guide); guideBtn.textContent='Aim guide: '+(settings.guide?'On':'Off');
    optBtn.classList.toggle('on',!!settings.fps); optBtn.textContent='Frame rate readout: '+(settings.fps?'On':'Off'); document.getElementById('fps').style.display=settings.fps?'block':'none'; };
  refresh();
  bonusBtn.addEventListener('click',()=>{ settings.bonus=!settings.bonus; saveSettings(); refresh(); buildHUD(); });
  guideBtn.addEventListener('click',()=>{ settings.guide=!settings.guide; saveSettings(); refresh(); });
  optBtn.addEventListener('click',()=>{ settings.fps=!settings.fps; saveSettings(); refresh(); }); gfxRadios();
  // sensitivity presets (flick → shot speed multiplier); older saved slider values snap to the nearest preset
  const sens=[...document.querySelectorAll('input[name="sens"]')], SENS=sens.map(r=>+r.value);
  settings.power=SENS.reduce((a,b)=>Math.abs(b-settings.power)<Math.abs(a-settings.power)?b:a,SENS[0]);
  sens.forEach(r=>{ r.checked=(+r.value===settings.power); r.addEventListener('change',()=>{ if(r.checked){ settings.power=+r.value; saveSettings(); } }); });
  document.getElementById('newGameBtn').addEventListener('click',()=>{
    if(gfxSwitch()) return; getAC(); initSfx(); modal.classList.remove('open'); document.getElementById('ov').classList.remove('show'); newGame(true); });
}

document.getElementById('startbtn').addEventListener('click',()=>{
  if(gfxSwitch()) return; document.getElementById('ov').classList.remove('show'); getAC(); initSfx(); resize();
  newGame(true);
});
function boot(){
  setupSettings();
  document.querySelector('#ov p').innerHTML='Drag sideways to line up, then <b>flick up</b> to shoot. The harder the flick, the farther the shot.<br>'
    +ROUND_T+' seconds · 2 points a basket, 3 in the last '+HOT_T+' seconds · score '+BONUS_TARGET+' for a moving-hoop bonus round.';
  initScene(); bindInput();
  newGame(false);
  try{ if(sessionStorage.getItem('lowgfxReload')){ sessionStorage.removeItem('lowgfxReload');
    document.getElementById('ov').classList.remove('show'); document.getElementById('settings').classList.add('open'); newGame(true); } }catch(e){}
  if(gfxSwitched()){ document.getElementById('ov').classList.remove('show'); newGame(true); }
  buildHUD();
  requestAnimationFrame(t=>{ lastT=t; loop(t); });
}
// show the title + spinner first, then build the scene; the start card appears once the first frames have drawn
// (that first render is where the shaders compile, so it's part of the wait)
function bootDone(){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ const L=document.getElementById('loader'); if(!L) return; L.classList.add('done'); setTimeout(()=>L.remove(),500);
  const st=document.getElementById('settings'); if(!(st&&st.classList.contains('open'))&&!gfxResumed) document.getElementById('ov').classList.add('show'); })); }
function bootFail(err){ const L=document.getElementById('loader'); if(L) L.remove(); showFatal(err); }
requestAnimationFrame(()=>setTimeout(()=>{ try{ boot(); bootDone(); }catch(err){ bootFail(err); } },0));
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
