<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Shuffle Bowl</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#120c0a">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100dvw;height:100dvh;background:#120c0a;font-family:'Segoe UI',Arial,sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;}
#hud{width:100%;flex-shrink:0;background:rgba(0,0,0,.6);padding:4px 6px;overflow-x:auto;z-index:6;}
#board{display:flex;gap:2px;min-width:min-content;justify-content:center;}
.fr{border:1px solid #2b3550;border-radius:3px;min-width:48px;background:#111826;}
.fr .fh{font-size:.72rem;text-align:center;color:#7d8db0;border-bottom:1px solid #2b3550;padding:1px 0;}
.fr .rw{display:flex;height:20px;}
.fr .rb{flex:1;font-size:.9rem;text-align:center;line-height:20px;border-left:1px solid #2b3550;color:#ffd54a;}
.fr .rb:first-child{border-left:none;}
.fr.f10{min-width:66px;}
.fr .tot{text-align:center;font-size:1.02rem;font-weight:700;line-height:22px;color:#fff;}
.fr.cur{border-color:#ffd54a;box-shadow:0 0 8px rgba(255,213,74,.4);}
/* portrait: stretch the board across the full viewport width */
@media (orientation:portrait){
  #hud{padding-left:0;padding-right:0;}
  #board{width:100vw;gap:1px;}
  .fr{flex:1 1 0;min-width:0;} .fr.f10{flex:1.4 1 0;min-width:0;}
}
@media (max-width:420px){    /* very narrow phones: trim fonts so all 10 frames still fit */
  .fr .fh{font-size:.56rem;} .fr .rw{height:16px;} .fr .rb{font-size:.68rem;line-height:16px;} .fr .tot{font-size:.8rem;line-height:18px;}
}
#msg{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:clamp(1.6rem,6vw,2.6rem);font-weight:800;color:#ffd54a;
  text-shadow:0 2px 14px #000;pointer-events:none;letter-spacing:1px;z-index:5;}
#celebrate{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:15;pointer-events:none;opacity:0;
  font-weight:900;letter-spacing:5px;font-size:clamp(2.6rem,13vw,6.5rem);}
#celebrate.show{animation:celebpop 1.8s cubic-bezier(.2,.8,.3,1) forwards;}
#celebrate.strike{color:#ffd54a;text-shadow:0 0 34px rgba(255,170,0,.85),0 5px 0 #9a5600;}
#celebrate.spare{color:#66d9ff;text-shadow:0 0 34px rgba(60,160,255,.85),0 5px 0 #06507a;}
@keyframes celebpop{
  0%{opacity:0;transform:scale(.3) rotate(-9deg);}
  14%{opacity:1;transform:scale(1.18) rotate(3deg);}
  28%{transform:scale(1) rotate(0);}
  72%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(1.12);}
}
#stage{flex:1;width:100%;position:relative;cursor:grab;min-height:0;overflow:hidden;}
#stage.throwing{cursor:grabbing;}
#stage canvas{display:block;width:100%;height:100%;}
#loader{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(ellipse at center,#1d2a3a 0%,#06040c 100%);transition:opacity .45s;}
#loader.done{opacity:0;pointer-events:none;}
#fps{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:20;display:none;font:600 11px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#eafff0;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:6px;pointer-events:none;white-space:pre;text-align:center;}
#gfxNote{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:35;max-width:86vw;font:600 .85rem 'Segoe UI',Arial,sans-serif;color:#fff;background:rgba(20,14,34,.88);border:1px solid #3d3058;padding:9px 14px;border-radius:9px;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;}
#gfxNote.show{opacity:1;}
#busy{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(6,4,12,.72);opacity:0;pointer-events:none;transition:opacity .2s;}
#busy.show{opacity:1;pointer-events:auto;}
#busy .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd54a;animation:ldspin .8s linear infinite;}
#busy small{color:#e6dcf5;font:600 .8rem 'Segoe UI',Arial,sans-serif;letter-spacing:2px;}
.seg{display:flex;border:1px solid #3d3058;border-radius:9px;overflow:hidden;}
.seg label{flex:1;cursor:pointer;display:flex;}
.seg input{position:absolute;opacity:0;pointer-events:none;}
.seg span{flex:1;display:flex;flex-direction:column;justify-content:center;padding:9px 4px;text-align:center;background:#1d1630;color:#ddd3ee;font-size:.88rem;font-weight:700;border-left:1px solid #3d3058;transition:all .12s;}
.seg label:first-child span{border-left:none;}
.seg span small{display:block;font-size:.68rem;font-weight:600;opacity:.75;}
.seg input:checked+span{background:#ffd54a;color:#181000;}
.seg input:focus-visible+span{outline:2px solid #fff;outline-offset:-3px;}
#loader h1{margin:0;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:3px;color:#ffd54a;text-shadow:0 0 24px rgba(255,170,0,.5);font-family:'Segoe UI',Arial,sans-serif;}
#loader .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd54a;animation:ldspin .8s linear infinite;}
#loader small{color:#a99bc6;font:600 .8rem 'Segoe UI',Arial,sans-serif;letter-spacing:2px;}
@keyframes ldspin{to{transform:rotate(360deg)}}
#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, rgba(4,7,14,.25) 0%, rgba(4,7,14,.6) 100%);gap:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;padding:20px;}
#ov.show{opacity:1;pointer-events:auto;}
#ov h2{font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:2px;color:#ffd54a;text-shadow:0 0 20px rgba(255,170,0,.5);}
#ov p{color:#cfd8ea;font-size:clamp(.82rem,2.4vw,1rem);line-height:1.6;max-width:390px;}
#startbtn{margin-top:6px;padding:11px 34px;background:#ffd54a;color:#181000;border:none;border-radius:8px;
  font-size:clamp(.95rem,2.6vw,1.15rem);font-weight:800;cursor:pointer;letter-spacing:1px;}
#startbtn:hover{background:#ffe27a;}
a.back{color:#67769c;font-size:.8rem;text-decoration:none;margin-top:8px;text-align:center;}
a.back:hover{color:#9fb0d8;text-decoration:underline;}
#cog{position:fixed;left:12px;top:6vh;z-index:25;border:none;background:none;color:#cfd8ea;
  display:flex;align-items:center;justify-content:center;height:1em;font-size:4em;line-height:1;padding:0;
  opacity:0.9;cursor:pointer;transition:transform .15s,opacity .15s;}
#cog:hover{opacity:1;transform:rotate(45deg);}
#mute{position:fixed;right:12px;top:6vh;z-index:25;border:none;background:none;color:#cfd8ea;
  display:flex;align-items:center;justify-content:center;height:1em;font-size:4em;line-height:1;padding:0;
  opacity:0.9;cursor:pointer;transition:opacity .15s;}
#mute:hover{opacity:1;}
#mute svg,#cog svg{width:0.8em;height:0.8em;display:block;}
#settings{position:fixed;inset:0;z-index:26;display:none;align-items:center;justify-content:center;
  background:rgba(2,4,8,.62);}
#settings.open{display:flex;}
.modal-card{width:min(94vw,480px);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:16px;
  background:rgba(14,18,28,.98);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);}
@media (max-width:520px){   /* mobile: settings/builder fill the whole screen */
  .modal-card{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:none;}
}
.app-title{text-align:center;color:#ffd54a;font-size:1.6rem;font-weight:900;letter-spacing:2px;
  text-shadow:0 0 18px rgba(255,170,0,.45);margin-bottom:-4px;}
.app-title .emoji{text-shadow:none;}
.modal-top{position:sticky;top:-22px;z-index:3;margin:-22px -22px 0;padding:22px 22px 12px;background:inherit;display:flex;flex-direction:column;gap:16px;border-bottom:1px solid rgba(255,255,255,.08);}
.modal-head{display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{color:#ffd54a;font-size:1.2rem;letter-spacing:1px;}
#settingsClose{background:none;border:none;color:#9fb0d8;font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer;}
#settingsClose:hover{color:#fff;}
.sec-label{color:#9fb0d8;font-size:.8rem;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
/* ball/theme picker: prev button | scrollable strip | next button */
.picker{display:flex;align-items:center;gap:6px;}
.picker .grid{flex:1 1 auto;min-width:0;}
.navbtn{flex:0 0 auto;width:30px;align-self:stretch;min-height:46px;border:1px solid #33405a;border-radius:8px;
  background:#1a2130;color:#cfd8ea;font-size:1.4rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s;}
.navbtn:hover{border-color:#5a6a90;color:#fff;}
.navbtn:active{background:#232c40;}
.grid{display:flex;flex-wrap:nowrap;gap:9px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
  scroll-snap-type:x mandatory;}   /* snap so each scroll settles on one preview */
.grid .tile{scroll-snap-align:center;}
.tile{flex:0 0 62px;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:6px 4px;text-align:center;
  background:rgba(255,255,255,.05);transition:background .12s,border-color .12s;}
.grid.mural .tile{flex:0 0 120px;}
.tile:hover{background:rgba(255,255,255,.11);}
.tile.selected{border-color:#ffd54a;background:rgba(255,213,74,.14);}
.tile .thumb{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;display:block;background:#0c0f16;}
.tile .thumb.sphere{position:relative;background-size:cover;background-position:center;overflow:hidden;}
.tile .thumb.sphere::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 33% 27%, rgba(255,255,255,.6), rgba(255,255,255,0) 42%);
  box-shadow:inset -7px -9px 16px rgba(0,0,0,.6), inset 5px 5px 10px rgba(255,255,255,.12);}
.tile.glowtile .thumb{box-shadow:0 0 10px #1dff5a;}
.tile.mtile .thumb{aspect-ratio:16/6;border-radius:6px;}
.tile .label{font-size:.68rem;color:#cfd8ea;margin-top:5px;}
.toggle{width:100%;padding:11px;border:1px solid #33405a;border-radius:9px;background:#1a2130;color:#cfd8ea;
  font-size:.9rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .12s;}
.toggle:hover{border-color:#5a6a90;}
.toggle.on{background:#ffd54a;color:#181000;border-color:#ffd54a;}
#settings label{color:#cfd8ea;font-size:.82rem;display:flex;flex-direction:column;gap:4px;}
#settings label.chk{flex-direction:row;align-items:center;gap:8px;cursor:pointer;}
#settings select{background:#1a2130;color:#fff;border:1px solid #33405a;border-radius:6px;padding:5px 6px;font-size:.82rem;}
#settings input[type=checkbox]{width:16px;height:16px;accent-color:#ffd54a;cursor:pointer;}
.tile .thumb{border-radius:50%;}
#ov p b{color:#ffd54a;}
</style>
</head>

<!-- "Having trouble?" hint: shown after 3 scoreless throws in a row (once per visit; can be switched off) -->
<style>

#hintModal.open{display:flex;}
#hintModal .hint-card{width:min(88vw,360px);background:rgba(18,14,28,.98);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px 20px 16px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);text-align:center;color:#ece6f8;font-family:'Segoe UI',Arial,sans-serif;animation:hintpop .25s ease-out;}
@keyframes hintpop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#hintModal h3{color:#ffd54a;font-size:1.25rem;letter-spacing:.5px;margin:0 0 8px;}

#hintModal .hint-btns{display:flex;gap:10px;justify-content:center;}

#hintModal button.primary{background:#ffd54a;border-color:#ffd54a;color:#181000;}

<div id="hintModal" role="dialog" aria-modal="true" aria-labelledby="hintTitle">
  <div class="hint-card">
    <h3 id="hintTitle">Having trouble?</h3>
    <p id="hintText"></p>
    <div class="hint-btns"><button class="primary" id="hintSettings">Open Settings</button><button id="hintOk">Got it</button></div>
    <label><input type="checkbox" id="hintNever"> Don't show this again</label>
  </div>
</div>
<script>
// missHint.note(scored): call once per throw. Three scoreless throws in a row shows the hint (once per visit).
window.missHint=(function(){
  let key='hint', text='', misses=0, shown=false;
  const el=()=>document.getElementById('hintModal');
  function close(){ const m=el(); if(!m) return; if(document.getElementById('hintNever').checked){ try{ localStorage.setItem(key+'_hint_off','1'); }catch(e){} } m.classList.remove('open'); }
  function show(){ const m=el(); if(!m) return; document.getElementById('hintText').innerHTML=text; document.getElementById('hintNever').checked=false; m.classList.add('open'); shown=true; }
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('hintOk').addEventListener('click',close);
    document.getElementById('hintSettings').addEventListener('click',()=>{ close(); const c=document.getElementById('cog'); if(c) c.click(); });
    el().addEventListener('click',e=>{ if(e.target===el()) close(); });
  });
  return {
    setup(k,t){ key=k; text=t; },
    note(scored){ if(scored){ misses=0; return; } misses++;
      let off=false; try{ off=localStorage.getItem(key+'_hint_off')==='1'; }catch(e){}
      if(misses>=3&&!shown&&!off) setTimeout(show,900); },
    reset(){ misses=0; },
    isOpen(){ const m=el(); return !!m&&m.classList.contains('open'); },
  };
})();
</script>
<script>missHint.setup('shufflebowl','Three misses in a row?<br>Flick a little faster, or set the <b>Table wax</b> to <b>Slick</b> in <b>Settings</b> so the puck slides further.');</script>

<script>
// ═══════════════════════════════════════════════════════
//  SHUFFLE BOWL — table bowling: a weighted puck slid down a waxed table into ten mini pins.
//  The sim is the Just Bowl one (2D, top-down, inches), with the puck sliding instead of rolling,
//  rails to bank off instead of gutters, and pins about 4" tall
// ═══════════════════════════════════════════════════════
let _fatalShown=false;
function showFatal(err){
  try{ console.error(err); }catch(e){}
  if(_fatalShown) return; _fatalShown=true;
  try{ const ov=document.getElementById('ov'); if(ov){ ov.classList.add('show');
    const p=ov.querySelector('p'); if(p) p.textContent='⚠ '+((err&&(err.message||err))+'').slice(0,200); } }catch(e){}
}
function scrollToSelections(){
  const c=document.getElementById('puckGrid'); if(!c) return; const sel=c.querySelector('.tile.selected'); if(!sel) return;
  const cr=c.getBoundingClientRect(), sr=sel.getBoundingClientRect(); c.scrollLeft+=(sr.left-cr.left)-(c.clientWidth-sel.offsetWidth)/2;
}
window.addEventListener('error',e=>showFatal(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showFatal(e.reason));

// ── table (inches): the release line is z=0, the puck starts behind it; pins near the far end ──
const S=4/15;                                    // mini pins are 4" tall: the pin numbers are the full-size ones × S
const LANE_LEN=138;                              // release line → end of the playfield; past it the puck drops into the pit
const TABLE_BACK=-30;                            // the near end of the table
const PLAY=10.5;                                 // half the playfield width (21" between the rails)
const RAIL_T=1.8, RAIL_H=2.0;
const PUCK_R=1.35, PUCK_T=0.7;
const PIN_R=2.383*S, PIN_H=15*S;
const COLGAP=12*S, ROWGAP=10.392*S, PIN_BASE=112;
const PIT_LEN=9;                                 // pit between the end of the playfield and the padded backstop
const SFX='sfx/';

const PUCKS=[
  {id:'red',label:'Red',col:0xd42a26},{id:'blue',label:'Blue',col:0x2a5fd6},{id:'black',label:'Black',col:0x1d1d20},
  {id:'gold',label:'Gold',col:0xe0aa22},{id:'green',label:'Green',col:0x26a04a},{id:'white',label:'White',col:0xf0f0ec},
  {id:'purple',label:'Purple',col:0x7a3cd0},{id:'orange',label:'Orange',col:0xf07a1e}];
function puckEntry(id){ return PUCKS.find(p=>p.id===id)||PUCKS[0]; }
const hexCss=n=>'#'+(n>>>0&0xffffff).toString(16).padStart(6,'0');

const settings={ puck:'red', wax:'normal', muted:false, optimized:false, gfx:'auto', gfxAuto:null, fps:false };

// TUNING
const SLIDE_MIN=62, SLIDE_MAX=175;               // release speed in/s

}

//  AUDIO
// ═══════════════════════════════════════════════════════
// All SFX go through the Web Audio API (not <audio> elements). On iOS an
// HTMLMediaElement seizes the exclusive "playback" audio session and stops the
// user's background music; Web Audio uses a mixable session, and we explicitly
// request the "ambient" session so background audio (Spotify, podcasts…) keeps playing.
let _ac=null, master=null, _muted=false, _sfxInit=false;
const BUFFERS={};
const SFX_FILES={ hit:'hit.mp3', strike:'strike.mp3', spare:'spare.mp3' };
function newCtx(){
  const AC=window.AudioContext||window.webkitAudioContext;
  _ac=new AC({latencyHint:'interactive'});             // low output latency -> less audible lag on mobile
  master=_ac.createGain(); master.gain.value=_muted?0:1; master.connect(_ac.destination);
  try{ if(navigator.audioSession) navigator.audioSession.type='ambient'; }catch(e){}   // mix with background audio
  if(_ac.addEventListener) _ac.addEventListener('statechange',()=>{ if(_ac && _ac.state!=='running' && _ac.state!=='closed' && _ac.resume) _ac.resume().catch(()=>{}); });
  slideSrc=null; slideGain=null;
  _sfxInit=false; initSfx();                            // (re)decode buffers into this context
}
function getAC(){
  // iOS can leave the context 'interrupted' (screen lock / another app / returning to the tab) where
  // resume() never recovers -- rebuild it. getAC runs from user gestures, so a rebuild can start audio.
  if(!_ac || _ac.state==='closed' || _ac.state==='interrupted'){ try{ if(_ac) _ac.close(); }catch(e){} newCtx(); }
  else if(_ac.state!=='running' && _ac.resume){ _ac.resume().catch(()=>{}); }
  return _ac;
}
// any interaction (or returning to the tab) recovers the context -- resume, or rebuild if interrupted
function resumeAudio(){ if(_ac) getAC(); }
['pointerdown','touchend','visibilitychange','focus','pageshow'].forEach(ev=>window.addEventListener(ev,resumeAudio,{passive:true}));
function initSfx(){
  if(_sfxInit) return; _sfxInit=true;
  const ac=_ac||getAC();
  for(const name in SFX_FILES){
    fetch(SFX+SFX_FILES[name])
      .then(r=>r.ok?r.arrayBuffer():Promise.reject())
      .then(b=>ac.decodeAudioData(b))
      .then(buf=>{ BUFFERS[name]=buf; })
      .catch(()=>{});   // strike/spare are optional — absent files just stay silent
  }
}
function warmUp(){ /* no-op: Web Audio needs no HTMLMediaElement unlock — getAC() resume on the START gesture is enough */ }

function muteIcon(muted){

    : '<path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
     +'<path d="M18 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/>'+waves+'</svg>';
}
function applyMute(on){
  _muted=!!on; settings.muted=_muted;

function playBuf(name,vol,loop,rate){
  if(_muted) return null;
  const ac=getAC(); const buf=BUFFERS[name]; if(!buf) return null;
  const src=ac.createBufferSource(); src.buffer=buf; src.loop=!!loop; if(rate) src.playbackRate.value=rate;
  const g=ac.createGain(); g.gain.value=(vol==null?1:vol);
  src.connect(g); g.connect(master);

  if(raw>250||document.hidden||PF.skip>0){ PF.skip--; return; }
  if(raw>_target*2.5&&!_idle) PF.hitch++;
  if(settings.fps){ PF.n++; PF.sum+=raw; PF.max=Math.max(PF.max,raw); PF.cpu+=cpu; PF.t+=raw;
    if(PF.t>=500){ const el=PF.el||(PF.el=document.getElementById('fps')), a=PF.sum/PF.n, ri=renderer.info.render;
      el.textContent=`${Math.round(1000/a)} fps${_idle?' (idle)':''} · ${a.toFixed(1)} ms · worst ${PF.max.toFixed(0)} · cpu ${(PF.cpu/PF.n).toFixed(1)} · hitches ${PF.hitch}\n${GFX_NAMES[GFX]}${settings.gfx==='auto'?' (auto)':''} · ${renderer.getPixelRatio().toFixed(2)}× · ${Math.round(1000/_refresh)} Hz · ${ri.calls} draws · ${Math.round(ri.triangles/1000)}k tris`;
      el.style.display='block'; PF.t=PF.n=PF.sum=PF.max=PF.cpu=0; } }
  if(settings.gfx!=='auto'||_idle||!gfxPlaying()) return;
  if(AT.hold>0){ AT.hold-=raw; return; }
  AT.sum+=raw; AT.n++; AT.t+=raw; if(AT.t<3000) return;
  const a=AT.sum/AT.n; AT.t=AT.sum=AT.n=0;
  if(a>_target*1.3){ AT.fast=0;                           // running slow: trim the resolution, then (at the next new game) drop a tier
    if(RES_SCALE>0.76){ RES_SCALE=Math.max(0.75,RES_SCALE-0.125); applyQuality(); AT.hold=800; }
    else if(GFX>0&&!gfxPending){ settings.gfxAuto=GFX-1; saveSettings(); gfxPending=true; } }
  else if(a<_target*1.08&&RES_SCALE<1){ if(++AT.fast>=2){ AT.fast=0; RES_SCALE=Math.min(1,RES_SCALE+0.125); applyQuality(); AT.hold=800; } }
  else AT.fast=0;
}
// Auto stepping down a tier: done with a reload at a natural break, picking up where play left off
function gfxSwitch(){ if(!gfxPending) return false; try{ sessionStorage.setItem('gfxAutoReload','1'); }catch(e){} location.reload(); return true; }
let gfxResumed=false;
function gfxSwitched(){ try{ if(!sessionStorage.getItem('gfxAutoReload')) return false; sessionStorage.removeItem('gfxAutoReload'); }catch(e){ return false; }
  gfxResumed=true;
  setTimeout(()=>gfxNote('Graphics set to '+GFX_NAMES[GFX]+' for smoother play. You can change it in Settings.'),600); return true; }
// loading spinner over anything slow (a new hole or theme): it shows, the work runs and the first frame draws, then it fades
function busyThen(fn){ const B=document.getElementById('busy'); B.classList.add('show');
  requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>{ try{ fn(); if(renderer){ if(renderer.shadowMap.enabled) renderer.shadowMap.needsUpdate=true; renderer.render(scene,camera); } gfxSettle(); }finally{ requestAnimationFrame(()=>B.classList.remove('show')); } },0))); }
function loop(t){
  noteRaf(t);
  if(gfxFrameSkip(t)){ requestAnimationFrame(loop); return; }
  const c0=performance.now(), raw=t-lastT; _frameN++; gfxShadows();
  try{ const dt=Math.min(raw/1000,0.033); lastT=t;
    if(renderer&&(lastW<2||lastH<2)) resize();
    if(phase==='rolling'){ const n=8; for(let k=0;k<n;k++) step(dt/n); }
    else if(phase==='returning') stepReturn(dt);
    if(msgT>0){ msgT-=dt; if(msgT<=0) document.getElementById('msg').textContent=''; }
    if(renderer&&ball){ sync(dt); updateCamera(dt); renderer.render(scene,camera); }
  }catch(err){ showFatal(err); }
  perfSample(raw,performance.now()-c0); requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  INPUT — drag the puck to set it, flick it up the table
// ═══════════════════════════════════════════════════════
function ndc(e){ const r=renderer.domElement.getBoundingClientRect(), s=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return { x:((s.clientX-r.left)/r.width)*2-1, y:-((s.clientY-r.top)/r.height)*2+1, px:s.clientX, py:s.clientY }; }
const _hit=new THREE.Vector3();
function groundOf(n){ raycaster.setFromCamera({x:n.x,y:n.y},camera); return raycaster.ray.intersectPlane(groundPlane,_hit)?{x:_hit.x,z:_hit.z}:null; }
function aimAt(gx,gz){ ball.x=Math.max(-(PLAY-PUCK_R),Math.min(PLAY-PUCK_R,gx)); ball.y=Math.max(AIM_Y_MIN,Math.min(AIM_Y_MAX,gz)); }
function samp(e){ const n=ndc(e), g=groundOf(n); return {px:n.px,py:n.py,t:performance.now(),gx:g?g.x:0,gz:g?g.z:AIM_Y_MIN}; }
function down(e){ if(phase!=='aim') return; e.preventDefault(); getAC(); dragging=true; samples=[]; stage.classList.add('throwing'); const s=samp(e); samples.push(s); if(s.gz<0) aimAt(s.gx,s.gz); }
function move(e){ if(!dragging) return; e.preventDefault(); const prev=samples[samples.length-1], s=samp(e); samples.push(s); if(samples.length>200) samples.shift();
  if(s.gz<0){ aimAt(s.gx,s.gz); return; }
  if(prev&&prev.gz<0) release(s); }                                          // crossed the line: it's away
function release(last){
  dragging=false; stage.classList.remove('throwing'); const now=last.t;
  let ref=samples[0]; for(let i=samples.length-1;i>=0;i--){ if(now-samples[i].t>=110){ ref=samples[i]; break; } }
  const dtv=Math.max(0.03,(now-ref.t)/1000), vyPix=(last.py-ref.py)/dtv;
  if(-vyPix<180){ flash('Flick it up the table'); return; }
  const dz=last.gz-ref.gz, dxw=last.gx-ref.gx, slope=dz>0.5?dxw/dz:-(last.px-ref.px)/Math.max(1,ref.py-last.py);
  launch(mapRange(-vyPix,300,2600,SLIDE_MIN,SLIDE_MAX),slope);
}
function up(e){ if(!dragging) return; e.preventDefault(); samples.push(samp(e)); release(samples[samples.length-1]); }
function bindInput(){ const el=renderer.domElement;
  el.addEventListener('mousedown',down); el.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  el.addEventListener('touchstart',down,{passive:false}); el.addEventListener('touchmove',move,{passive:false}); el.addEventListener('touchend',up,{passive:false}); }

// ═══════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════
function applyPuck(id){ settings.puck=id; saveSettings(); if(puckCap){ puckCap.color.setHex(puckEntry(id).col); } document.querySelectorAll('#puckGrid .tile').forEach(t=>t.classList.toggle('selected',t.dataset.key===id)); }
function applyQuality(){ if(!renderer) return; const dpr=window.devicePixelRatio||1; renderer.setPixelRatio(Math.min(GFX===2?1.5:1,dpr)*RES_SCALE); lastW=lastH=0; resize(); }
function saveSettings(){ try{ localStorage.setItem('shufflebowl',JSON.stringify({puck:settings.puck,wax:settings.wax,muted:settings.muted,optimized:settings.optimized,gfx:settings.gfx,gfxAuto:settings.gfxAuto,fps:settings.fps})); }catch(e){} }
function loadSettings(){ try{ Object.assign(settings,JSON.parse(localStorage.getItem('shufflebowl')||'{}')); }catch(e){} if(!WAX[settings.wax]) settings.wax='normal'; }
function setupSettings(){
  loadSettings();
  const pg=document.getElementById('puckGrid');
  for(const p of PUCKS){ const t=document.createElement('div'); t.className='tile'; t.dataset.key=p.id;
    t.innerHTML=`<div class="thumb" style="background:radial-gradient(circle,${hexCss(p.col)} 0 58%,#dfe3e8 61%,#8d939c 100%)"></div><div class="label">${p.label}</div>`;
    t.addEventListener('click',()=>applyPuck(p.id)); pg.appendChild(t); }
  applyPuck(settings.puck);
  document.querySelectorAll('input[name="wax"]').forEach(r=>{ r.checked=r.value===settings.wax; r.addEventListener('change',()=>{ if(r.checked){ settings.wax=r.value; saveSettings(); } }); });
  _muted=!!settings.muted; const muteBtn=document.getElementById('mute'); muteBtn.innerHTML=muteIcon(_muted); muteBtn.title=_muted?'Unmute':'Mute';
  muteBtn.addEventListener('click',()=>{ applyMute(!_muted); if(_muted) stopSlide(); });
  const placeCtrls=()=>{ const hud=document.getElementById('hud'), top=((hud?hud.offsetHeight:0)+10)+'px'; document.getElementById('cog').style.top=top; muteBtn.style.top=top; };
  placeCtrls(); requestAnimationFrame(placeCtrls); window.addEventListener('resize',placeCtrls); window.addEventListener('orientationchange',()=>setTimeout(placeCtrls,120));
  const modal=document.getElementById('settings');
  document.getElementById('cog').addEventListener('click',()=>{ modal.classList.add('open'); requestAnimationFrame(scrollToSelections); });
  document.getElementById('settingsClose').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('open'); });
  const optBtn=document.getElementById('setFps');
  const refresh=()=>{ optBtn.classList.toggle('on',!!settings.fps); optBtn.textContent='Frame rate readout: '+(settings.fps?'On':'Off'); document.getElementById('fps').style.display=settings.fps?'block':'none'; };
  refresh(); optBtn.addEventListener('click',()=>{ settings.fps=!settings.fps; saveSettings(); refresh(); }); gfxRadios();
  document.getElementById('newGameBtn').addEventListener('click',()=>{ clearGame(); if(gfxSwitch()) return; getAC(); initSfx(); stopSlide(); newGame(); phase='aim'; document.getElementById('ov').classList.remove('show'); modal.classList.remove('open'); });
}
document.getElementById('startbtn').addEventListener('click',()=>{
  document.getElementById('ov').classList.remove('show'); getAC(); initSfx(); resize();
  if(phase==='over'){ if(gfxSwitch()) return; newGame(); }
  phase='aim';
});
async function boot(){
  buildBoard(); setupSettings(); initScene(); bindInput();
  const sg=loadGame(); if(sg&&Array.isArray(sg.rolls)&&(sg.frame|0)<10) resumeGame(sg); else newGame();
  phase='menu';
  try{ if(sessionStorage.getItem('lowgfxReload')){ sessionStorage.removeItem('lowgfxReload'); document.getElementById('ov').classList.remove('show'); phase='aim'; const m=document.getElementById('settings'); if(m) m.classList.add('open'); } }catch(e){}
  if(gfxSwitched()){ document.getElementById('ov').classList.remove('show'); clearGame(); newGame(); phase='aim'; }
  requestAnimationFrame(t=>{ lastT=t; loop(t); });
}
function bootDone(){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ const L=document.getElementById('loader'); if(!L) return; L.classList.add('done'); setTimeout(()=>L.remove(),500);
  const st=document.getElementById('settings'); if(!(st&&st.classList.contains('open'))&&!gfxResumed) document.getElementById('ov').classList.add('show'); })); }
function bootFail(err){ const L=document.getElementById('loader'); if(L) L.remove(); showFatal(err); }
requestAnimationFrame(()=>setTimeout(()=>{ boot().then(bootDone).catch(bootFail); },0));
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
