<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Match — Level Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #110820;
  --panel:  #1e1040;
  --border: #3a2060;
  --accent: #c060f0;
  --cell:   52px;
}
body {
  background: var(--bg); color: #e0d0f8;
  font: 13px/1.4 'Segoe UI', Arial, sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}

/* ── TOP BAR ─────────────────────────────────────────────────── */
#topbar {
  background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  padding: 6px 12px; flex-shrink: 0; flex-wrap: wrap;
}
#topbar h1 { font-size: 0.9rem; color: var(--accent); white-space: nowrap; }
.meta-field { display: flex; align-items: center; gap: 4px; }
.meta-field label { font-size: 0.75rem; color: #9070c0; }
.meta-field input {
  background: #1a0830; border: 1px solid var(--border); color: #e0d0f8;
  border-radius: 4px; padding: 3px 7px; font-size: 0.8rem;
}
.meta-field input[type=number] { width: 58px; }
.meta-field input[type=text]   { width: 130px; }
#btn-test { margin-left: auto; }

/* ── MAIN LAYOUT ─────────────────────────────────────────────── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR ─────────────────────────────────────────────────── */
#sidebar {
  width: 160px; background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px 8px; overflow-y: auto; flex-shrink: 0;
}
.tool-section { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.tool-label { font-size: 0.68rem; color: #9070c0; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.6px; }
.tool-grid  { display: flex; flex-wrap: wrap; gap: 4px; }
.tool-btn {
  padding: 5px 8px; border-radius: 5px; border: 1px solid var(--border);
  background: #1a0830; color: #d0c0f0; font-size: 0.78rem; cursor: pointer;
  transition: background 0.1s;
}
.tool-btn:hover { background: #2a1858; }
.tool-btn.active { background: rgba(192,96,240,0.18); border-color: var(--accent); color: var(--accent); }

.prop-row { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
.prop-row label { font-size: 0.72rem; color: #9070c0; }
.prop-row input {
  background: #1a0830; border: 1px solid var(--border); color: #e0d0f8;
  border-radius: 4px; padding: 3px 6px; font-size: 0.78rem; width: 100%;
}

.btn {
  padding: 5px 12px; border-radius: 5px; border: 1px solid var(--border);
  background: #1a0830; color: #d0c0f0; font-size: 0.8rem; cursor: pointer;
  width: 100%; text-align: center; display: block; text-decoration: none;
  margin-bottom: 3px;
}
.btn:hover { background: #2a1858; }
.btn-accent { border-color: var(--accent); color: var(--accent); }

/* ── CANVAS ──────────────────────────────────────────────────── */
#canvas-wrap {
  flex: 1; overflow: auto;
  display: flex; align-items: flex-start; justify-content: flex-start;
  padding: 16px; background: #0a0618;
}
#grid {
  display: grid; position: relative;
  cursor: crosshair; user-select: none;
  gap: 3px; background: #1a0840;
  border: 2px solid var(--border); border-radius: 10px; padding: 6px;
}
.cell {
  width: var(--cell); height: var(--cell);
  border-radius: 7px;
  background: rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.7rem; line-height: 1;
  position: relative;
  transition: background 0.1s;
}
.cell:hover { background: rgba(192,96,240,0.12); }
.cell.block {
  background: #2a1858;
  background-image:
    linear-gradient(135deg, rgba(255,255,255,0.06) 25%, transparent 25%),
    linear-gradient(225deg, rgba(0,0,0,0.2) 25%, transparent 25%);
  background-size: 8px 8px;
  border: 1px solid #3a2078;
}

/* ── RIGHT PANEL ─────────────────────────────────────────────── */
#right-panel {
  width: 210px; background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
  padding: 10px;
}
#right-panel h3 { font-size: 0.72rem; color: #9070c0; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
#json-out {
  flex: 1; background: #0a0618; color: #8dbbff;
  border: 1px solid var(--border); border-radius: 4px;
  font: 10.5px/1.4 monospace; padding: 6px;
  overflow: auto; resize: none; min-height: 0; width: 100%;
  margin-bottom: 6px;
}
.json-btns { display: flex; gap: 5px; flex-wrap: wrap; }
.json-btn {
  flex: 1; padding: 5px 4px; font-size: 0.72rem; border-radius: 4px; min-width: 44px;
  border: 1px solid var(--border); background: #1a0830; color: #d0c0f0; cursor: pointer;
}
.json-btn:hover { background: #2a1858; }

#import-area { display: none; margin-top: 6px; }
#json-in {
  width: 100%; height: 80px;
  background: #0a0618; color: #8dbbff;
  border: 1px solid var(--border); border-radius: 4px;
  font: 10.5px monospace; padding: 5px; resize: none;
}
#btn-import-ok { width: 100%; margin-top: 4px; }

/* ── LEVEL COUNTER ───────────────────────────────────────────── */
#stats {
  font-size: 0.75rem; color: #9070c0; margin-top: 8px; line-height: 1.6;
}

/* ── TOAST ───────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--accent); border-radius: 8px;
  padding: 7px 18px; color: var(--accent); font-size: 0.82rem;
  opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999;
}
</style>
</head>
<body>

<div id="topbar">
  <h1>🔧 Fruit Match Editor</h1>
  <div class="meta-field">
    <label>Name</label>
    <input type="text" id="lvl-name" value="Custom Level">
  </div>
  <div class="meta-field">
    <label>Moves</label>
    <input type="number" id="lvl-moves" value="20" min="1" max="99">
  </div>
  <div class="meta-field">
    <label>Target</label>
    <input type="number" id="lvl-target" value="2000" min="100" step="100">
  </div>
  <button class="btn btn-accent" id="btn-test">▶ Test Level</button>
  <a class="btn" href="index.html" style="margin-left:0;white-space:nowrap" target="_blank">🎮 Play</a>
  <a class="btn" href="../index.html">🏠 Home</a>
</div>

<div id="main">
  <!-- SIDEBAR -->
  <div id="sidebar">

    <div class="tool-section">
      <div class="tool-label">Tool</div>
      <div class="tool-grid">
        <button class="tool-btn active" data-tool="block" title="Paint block">█ Block</button>
        <button class="tool-btn" data-tool="erase" title="Erase block">✕ Erase</button>
      </div>
    </div>

    <div class="tool-section">
      <div class="tool-label">Grid Size</div>
      <div class="prop-row">
        <label>Columns</label>
        <input type="number" id="grid-cols" value="8" min="4" max="12">
      </div>
      <div class="prop-row">
        <label>Rows</label>
        <input type="number" id="grid-rows" value="8" min="4" max="12">
      </div>
      <button class="btn btn-accent" id="btn-apply" style="margin-top:4px">Apply Size</button>
    </div>

    <div class="tool-section">
      <div class="tool-label">Presets</div>
      <button class="btn" id="btn-clear">Clear Blocks</button>
      <button class="btn" id="btn-border">Border Blocks</button>
      <button class="btn" id="btn-checkerboard">Checkerboard</button>
    </div>

    <a class="btn" href="index.html">🎮 Open Game</a>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <div id="grid"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right-panel">
    <h3>Level JSON</h3>
    <textarea id="json-out" spellcheck="false" readonly></textarea>
    <div class="json-btns">
      <button class="json-btn" id="btn-export">Export</button>
      <button class="json-btn" id="btn-copy">Copy</button>
      <button class="json-btn" id="btn-import">Import</button>
      <button class="json-btn" id="btn-dl">Download</button>
    </div>
    <div id="import-area">
      <textarea id="json-in" placeholder="Paste level JSON…" spellcheck="false"></textarea>
      <button class="json-btn" id="btn-import-ok">Load JSON</button>
    </div>
    <div id="stats"></div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

// ── STATE ──────────────────────────────────────────────────────────
let cols = 8, rows = 8;
let blocks = new Set(); // "r,c" strings
let tool   = 'block';
let painting = false;
let lastKey  = null;

// ── RESTORE (test mode return) ────────────────────────────────────
const restoreData = sessionStorage.getItem('fm_editor_restore');
if (restoreData) {
  sessionStorage.removeItem('fm_editor_restore');
  try {
    const lv = JSON.parse(restoreData);
    cols = lv.cols || 8;
    rows = lv.rows || 8;
    document.getElementById('lvl-name').value   = lv.name   || 'Custom Level';
    document.getElementById('lvl-moves').value  = lv.moves  || 20;
    document.getElementById('lvl-target').value = lv.target || 2000;
    document.getElementById('grid-cols').value  = cols;
    document.getElementById('grid-rows').value  = rows;
    blocks = new Set((lv.blocks || []).map(([r,c]) => `${r},${c}`));
  } catch(e) { /* ignore */ }
}

// ── DOM ───────────────────────────────────────────────────────────
const gridEl = document.getElementById('grid');

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  gridEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell))`;
  gridEl.style.gridTemplateRows    = `repeat(${rows}, var(--cell))`;
  gridEl.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      const key  = `${r},${c}`;
      cell.className = 'cell' + (blocks.has(key) ? ' block' : '');
      cell.dataset.r = r; cell.dataset.c = c;
      if (!blocks.has(key)) cell.textContent = ''; // empty floor
      gridEl.appendChild(cell);
    }
  }

  updateStats();
  exportJSON();
}

function updateStats() {
  const total = rows * cols;
  const bCount = blocks.size;
  const playable = total - bCount;
  document.getElementById('stats').innerHTML =
    `Grid: ${cols}×${rows} = ${total} cells<br>` +
    `Blocks: ${bCount} | Playable: ${playable}`;
}

// ── MOUSE PAINTING ────────────────────────────────────────────────
gridEl.addEventListener('mousedown', e => {
  painting = true; lastKey = null;
  applyTool(e);
});
gridEl.addEventListener('mousemove', e => { if (painting) applyTool(e); });
window.addEventListener('mouseup', () => { painting = false; lastKey = null; });

gridEl.addEventListener('contextmenu', e => {
  e.preventDefault();
  const cell = e.target.closest('[data-r]');
  if (!cell) return;
  const key = `${cell.dataset.r},${cell.dataset.c}`;
  blocks.delete(key);
  render();
});

function applyTool(e) {
  const cell = e.target.closest('[data-r]');
  if (!cell) return;
  const key = `${cell.dataset.r},${cell.dataset.c}`;
  if (key === lastKey) return;
  lastKey = key;
  if (tool === 'block')      blocks.add(key);
  else if (tool === 'erase') blocks.delete(key);
  render();
}

// ── TOOL BUTTONS ──────────────────────────────────────────────────
document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    tool = btn.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ── GRID SIZE ─────────────────────────────────────────────────────
document.getElementById('btn-apply').addEventListener('click', () => {
  const nc = Math.max(4, Math.min(12, +document.getElementById('grid-cols').value || 8));
  const nr = Math.max(4, Math.min(12, +document.getElementById('grid-rows').value || 8));
  // Remove out-of-bounds blocks
  const toRemove = [];
  blocks.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    if (r >= nr || c >= nc) toRemove.push(key);
  });
  toRemove.forEach(k => blocks.delete(k));
  cols = nc; rows = nr;
  render();
});

// ── PRESETS ───────────────────────────────────────────────────────
document.getElementById('btn-clear').addEventListener('click', () => {
  blocks.clear(); render();
});
document.getElementById('btn-border').addEventListener('click', () => {
  blocks.clear();
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (r === 0 || r === rows-1 || c === 0 || c === cols-1)
        blocks.add(`${r},${c}`);
  render();
});
document.getElementById('btn-checkerboard').addEventListener('click', () => {
  blocks.clear();
  for (let r = 1; r < rows-1; r += 2)
    for (let c = 1; c < cols-1; c += 2)
      blocks.add(`${r},${c}`);
  render();
});

// ── BUILD LEVEL OBJECT ────────────────────────────────────────────
function buildLevel() {
  return {
    name:   document.getElementById('lvl-name').value   || 'Custom Level',
    rows,
    cols,
    moves:  +(document.getElementById('lvl-moves').value)  || 20,
    target: +(document.getElementById('lvl-target').value) || 2000,
    blocks: [...blocks].map(k => k.split(',').map(Number)).sort((a,b) => a[0]-b[0] || a[1]-b[1]),
  };
}

// ── EXPORT JSON ───────────────────────────────────────────────────
function exportJSON() {
  document.getElementById('json-out').value =
    JSON.stringify(buildLevel(), null, 2);
}

document.getElementById('btn-export').addEventListener('click', exportJSON);

document.getElementById('btn-copy').addEventListener('click', () => {
  exportJSON();
  navigator.clipboard.writeText(document.getElementById('json-out').value)
    .then(() => toast('Copied to clipboard!'));
});

document.getElementById('btn-dl').addEventListener('click', () => {
  exportJSON();
  const name = (document.getElementById('lvl-name').value || 'level')
    .toLowerCase().replace(/\s+/g, '-');
  const blob = new Blob([document.getElementById('json-out').value], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: `${name}.json`
  });
  a.click(); URL.revokeObjectURL(a.href);
  toast('Downloaded!');
});

// ── IMPORT JSON ───────────────────────────────────────────────────
document.getElementById('btn-import').addEventListener('click', () => {
  const ia = document.getElementById('import-area');
  ia.style.display = ia.style.display === 'none' ? '' : 'none';
});

document.getElementById('btn-import-ok').addEventListener('click', () => {
  try {
    const lv = JSON.parse(document.getElementById('json-in').value);
    if (lv.cols) { cols = lv.cols; document.getElementById('grid-cols').value = cols; }
    if (lv.rows) { rows = lv.rows; document.getElementById('grid-rows').value = rows; }
    if (lv.name)   document.getElementById('lvl-name').value   = lv.name;
    if (lv.moves)  document.getElementById('lvl-moves').value  = lv.moves;
    if (lv.target) document.getElementById('lvl-target').value = lv.target;
    blocks = new Set((lv.blocks || []).map(([r,c]) => `${r},${c}`));
    document.getElementById('import-area').style.display = 'none';
    render();
    toast('Level loaded!');
  } catch(e) { toast('Invalid JSON — check format.'); }
});

// ── TEST MODE ─────────────────────────────────────────────────────
document.getElementById('btn-test').addEventListener('click', () => {
  const lv = buildLevel();
  sessionStorage.setItem('fm_editor_restore', JSON.stringify(lv));
  sessionStorage.setItem('fm_test_level', JSON.stringify(lv));
  window.open('index.html', '_blank');
});

// ── LIVE UPDATE ON META CHANGE ────────────────────────────────────
['lvl-name','lvl-moves','lvl-target'].forEach(id => {
  document.getElementById(id).addEventListener('input', exportJSON);
});

// ── TOAST ─────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.opacity = '0', 1800);
}

// ── BOOT ──────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
