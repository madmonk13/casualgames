<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Just Golf</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08060e">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Just Golf">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100dvw;height:100dvh;background:#08060e;font-family:'Segoe UI',Arial,sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;}
#hud{width:100%;flex-shrink:0;background:rgba(0,0,0,.6);padding:4px 6px;overflow-x:auto;z-index:6;}
#board{display:flex;gap:2px;min-width:min-content;justify-content:center;}
.fr{border:1px solid #3a2d50;border-radius:3px;min-width:46px;background:#151022;}
.fr .fh{font-size:.72rem;text-align:center;color:#a08cc0;border-bottom:1px solid #3a2d50;padding:1px 0;}
.fr .fh small{color:#6f5f8c;margin-left:3px;}
.fr .tot{text-align:center;font-size:1.2rem;font-weight:800;line-height:28px;color:#ffd54a;font-variant-numeric:tabular-nums;}
.fr.ftot{min-width:62px;} .fr.ftot .tot{color:#fff;}
.fr.fbest{min-width:56px;} .fr.fbest .tot{color:#8fe3ff;}
.fr.cur{border-color:#ffd54a;box-shadow:0 0 8px rgba(255,213,74,.4);}
.fr .tot.under{color:#5dff9a;} .fr .tot.over{color:#ff8a6a;} .fr .tot.ace{color:#ff7ad9;}
@media (orientation:portrait){
  #hud{padding-left:0;padding-right:0;}
  #board{width:100vw;gap:1px;}
  .fr{flex:1 1 0;min-width:0;} .fr.ftot{flex:1.3 1 0;} .fr.fbest{flex:1.3 1 0;}
}
@media (max-width:420px){ .fr .fh{font-size:.58rem;} .fr .tot{font-size:.95rem;line-height:22px;} }
#msg{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:clamp(1.3rem,5.5vw,2.3rem);font-weight:800;color:#ffd54a;
  text-shadow:0 2px 14px #000;pointer-events:none;letter-spacing:1px;z-index:5;line-height:1.3;}
#msg small{display:block;font-size:.55em;color:#e8dcff;letter-spacing:2px;}
#celebrate{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:15;pointer-events:none;opacity:0;
  font-weight:900;letter-spacing:5px;font-size:clamp(2.4rem,12vw,6rem);}
#celebrate.show{animation:celebpop 1.8s cubic-bezier(.2,.8,.3,1) forwards;}
#celebrate.gold{color:#ffd54a;text-shadow:0 0 34px rgba(255,170,0,.85),0 5px 0 #9a5600;}
#celebrate.pink{color:#ff7ad9;text-shadow:0 0 34px rgba(255,60,200,.85),0 5px 0 #7a0650;}
#celebrate.green{color:#5dff9a;text-shadow:0 0 30px rgba(40,255,140,.75),0 5px 0 #0a6a30;}
@keyframes celebpop{ 0%{opacity:0;transform:scale(.3) rotate(-9deg);} 14%{opacity:1;transform:scale(1.18) rotate(3deg);} 28%{transform:scale(1) rotate(0);} 72%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(1.12);} }
#info{position:fixed;left:10px;z-index:7;background:rgba(0,0,0,.5);border-radius:10px;padding:7px 11px;display:flex;flex-direction:column;gap:2px;
  font-size:clamp(.68rem,2.2vw,.86rem);font-weight:700;pointer-events:none;}
#info span{display:flex;justify-content:space-between;gap:12px;min-width:120px;} #info b{color:#ffd54a;}
#map{position:fixed;right:10px;z-index:7;width:clamp(76px,16vw,120px);height:auto;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:#1b3a1a;box-shadow:0 4px 14px rgba(0,0,0,.4);}
#ctrl{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 12px calc(14px + env(safe-area-inset-bottom));pointer-events:none;}
/* thumb-sized controls in the bottom corners: clubs on one side, SWING on the other (Settings can swap them for left-handers) */
#row{display:flex;justify-content:space-between;align-items:flex-end;width:100%;pointer-events:none;}
body.lefty #row{flex-direction:row-reverse;}
#row>*{pointer-events:auto;}
.clubset{display:flex;gap:6px;align-items:stretch;}
.clubset .btn.small{width:34px;height:78px;padding:0;border-radius:14px;font-size:1.5rem;}
/* with a mouse/trackpad, the controls sit at the two ends of the power meter instead of in the screen corners */
@media (hover:hover) and (pointer:fine){
  #ctrl{display:grid;grid-template-columns:auto auto auto;justify-content:center;align-items:center;column-gap:14px;row-gap:7px;}
  #hint{grid-column:1 / 4;grid-row:1;justify-self:center;}
  #row{display:contents;}
  .clubset{grid-column:1;grid-row:2;} #meter{grid-column:2;grid-row:2;} #swing{grid-column:3;grid-row:2;}
  body.lefty .clubset{grid-column:3;} body.lefty #swing{grid-column:1;}
  #ctrl #swing,#ctrl #club{width:64px;height:64px;} #ctrl .clubset .btn.small{height:64px;width:30px;}
}
.btn{padding:10px 14px;border:1px solid rgba(255,255,255,.28);border-radius:9px;background:rgba(18,14,28,.88);color:#ddd3ee;font-size:.95rem;font-weight:800;cursor:pointer;}
.btn.small{padding:10px 12px;font-size:1.2rem;line-height:1;}
#swing{width:78px;height:78px;padding:0;border-radius:18px;background:#ffd54a;color:#181000;border-color:#ffd54a;font-size:1rem;letter-spacing:1px;box-shadow:0 6px 16px rgba(0,0,0,.35);touch-action:manipulation;}
#swing:active{transform:scale(.96);}
#swing:disabled{opacity:.5;}
#club{width:78px;height:78px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;background:rgba(18,14,28,.88);border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:4px;line-height:1.1;box-shadow:0 6px 16px rgba(0,0,0,.35);}
#club b{display:block;color:#fff;} #club small{color:#b7a6d6;font-size:.72rem;}
#hint{font-size:.8rem;color:#f2ecff;text-shadow:0 1px 4px #000;min-height:1.1em;pointer-events:none;}
#meter{position:relative;width:min(86vw,420px);height:22px;border-radius:11px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);overflow:hidden;}
#mfill{position:absolute;top:0;bottom:0;left:12%;width:0;background:linear-gradient(90deg,#3ad46a,#ffd54a 70%,#ff5a4a);opacity:.85;}
#mzone{position:absolute;top:0;bottom:0;left:calc(12% - 2.2%);width:4.4%;background:rgba(255,255,255,.25);}
#mpow{position:absolute;top:0;bottom:0;width:3px;background:#fff;display:none;}
#mmark{position:absolute;top:-2px;bottom:-2px;width:3px;left:12%;background:#ff3b5c;box-shadow:0 0 6px #ff3b5c;}
#pad{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(46vw,240px);height:min(66vh,480px);z-index:24;display:none;
  border-radius:26px;background:rgba(10,8,20,.72);border:2px solid rgba(255,255,255,.35);box-shadow:0 18px 50px rgba(0,0,0,.5);backdrop-filter:blur(3px);}
#pad.open{display:block;}
#padCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:26px;}
#padClose{position:absolute;top:8px;right:10px;background:none;border:none;color:#ddd3ee;font-size:1.2rem;cursor:pointer;}
#padMsg{position:absolute;left:0;right:0;top:46%;text-align:center;font-weight:800;color:#f2ecff;font-size:.9rem;text-shadow:0 1px 4px #000;pointer-events:none;}
#stage{flex:1;width:100%;position:relative;cursor:grab;min-height:0;overflow:hidden;}
#stage.aiming{cursor:grabbing;}
#stage canvas{display:block;width:100%;height:100%;}
#loader{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(ellipse at center,#1d2a3a 0%,#06040c 100%);transition:opacity .45s;}
#loader.done{opacity:0;pointer-events:none;}
#busy{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(6,4,12,.72);opacity:0;pointer-events:none;transition:opacity .2s;}
#busy.show{opacity:1;pointer-events:auto;}
#busy .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd54a;animation:ldspin .8s linear infinite;}
#busy small{color:#e6dcf5;font:600 .8rem 'Segoe UI',Arial,sans-serif;letter-spacing:2px;}
#loader h1{margin:0;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:3px;color:#ffd54a;text-shadow:0 0 24px rgba(255,170,0,.5);font-family:'Segoe UI',Arial,sans-serif;}
#loader .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd54a;animation:ldspin .8s linear infinite;}
#loader small{color:#a99bc6;font:600 .8rem 'Segoe UI',Arial,sans-serif;letter-spacing:2px;}
@keyframes ldspin{to{transform:rotate(360deg)}}
#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, rgba(6,4,12,.3) 0%, rgba(6,4,12,.75) 100%);gap:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;padding:20px;}
#ov.show{opacity:1;pointer-events:auto;}
#ov h2{font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:2px;color:#ffd54a;text-shadow:0 0 20px rgba(255,170,0,.5);}
#ov p{color:#ddd3ee;font-size:clamp(.82rem,2.4vw,1rem);line-height:1.6;max-width:420px;text-shadow:0 1px 6px #000;}
#ov table{border-collapse:collapse;font-size:.9rem;color:#ddd3ee;table-layout:fixed;width:min(92vw,440px);margin:0 auto 6px;}   /* every nine's card is the same grid */
#ov table th:first-child{width:3.4em;}
#ov td,#ov th{border:1px solid #3a2d50;padding:3px 2px;text-align:center;} #ov th{color:#a08cc0;font-weight:600;}
#genPanel{display:none;flex-direction:column;align-items:center;gap:8px;width:min(92vw,420px);}
#genPanel.open{display:flex;}
#genPanel .cp-row button.sel{background:#ffd54a;color:#181000;} #genPanel .cp-row button.sel small{color:#4a3a00;}
.gen-seed{display:flex;gap:8px;align-items:center;}
.gen-seed input{width:9.5em;padding:9px 10px;border-radius:9px;border:1px solid #ffd54a;background:rgba(29,22,48,.9);color:#fff;font:800 1.05rem/1 'Segoe UI',Arial,sans-serif;letter-spacing:3px;text-align:center;text-transform:uppercase;}
.gen-seed button,.mini{padding:8px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:rgba(29,22,48,.9);color:#f2ecff;font-weight:800;cursor:pointer;}
#genSaved{width:100%;max-height:30vh;overflow:auto;display:flex;flex-direction:column;gap:5px;}
#genSaved .row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:9px;background:rgba(29,22,48,.75);border:1px solid rgba(255,255,255,.14);color:#ece6f8;font-size:.88rem;}
#genSaved .row span{flex:1;text-align:left;} #genSaved .row small{color:#bfb2d8;}
.gen-info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:9px;border:1px solid #3d3058;background:#1d1630;color:#ddd3ee;font-size:.88rem;font-weight:700;}
#coursePick{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px;}
#coursePick .cp-label,#genPanel .cp-label{color:#a08cc0;font-size:.78rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
#coursePick .cp-row,#genPanel .cp-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
#coursePick button,#genPanel .cp-row button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:10px 14px;border-radius:9px;border:1px solid #ffd54a;background:rgba(29,22,48,.9);color:#f2ecff;font-weight:800;font-size:.95rem;cursor:pointer;}
#coursePick button small,#genPanel .cp-row button small{font-weight:600;font-size:.68rem;color:#bfb2d8;}
#coursePick button.last,#genPanel .cp-row button.last{background:#ffd54a;color:#181000;} #coursePick button.last small,#genPanel .cp-row button.last small{color:#4a3a00;}
#startbtn{margin-top:6px;padding:11px 34px;background:#ffd54a;color:#181000;border:none;border-radius:8px;
  font-size:clamp(.95rem,2.6vw,1.15rem);font-weight:800;cursor:pointer;letter-spacing:1px;}
#startbtn:hover{background:#ffe27a;}
.iconbtn{position:fixed;top:6vh;z-index:25;border:none;background:none;color:#ddd3ee;display:flex;align-items:center;justify-content:center;
  height:1em;font-size:4em;line-height:1;padding:0;opacity:0.9;cursor:pointer;transition:transform .15s,opacity .15s;}
.iconbtn:hover{opacity:1;}
#cog{left:12px;} #cog:hover{transform:rotate(45deg);}
#mute{right:12px;}
#view{right:12px;}
.iconbtn svg{width:0.8em;height:0.8em;display:block;overflow:visible;
  filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000) drop-shadow(0 0 3px rgba(0,0,0,.55));}
#view.on{color:#ffd54a;}
#settings{position:fixed;inset:0;z-index:26;display:none;align-items:center;justify-content:center;background:rgba(2,2,8,.62);}
#settings.open{display:flex;}
.modal-card{width:min(94vw,480px);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:16px;
  background:rgba(18,14,28,.98);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);}
@media (max-width:520px){ .modal-card{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:none;} }
.app-title{text-align:center;color:#ffd54a;font-size:1.6rem;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px rgba(255,170,0,.45);margin-bottom:-4px;}
.app-title .emoji{text-shadow:none;}
.modal-head{display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{color:#ffd54a;font-size:1.2rem;letter-spacing:1px;}
#settingsClose{background:none;border:none;color:#b7a6d6;font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer;}
#settingsClose:hover{color:#fff;}
.sec-label{color:#b7a6d6;font-size:.8rem;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
.grid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
.picker{display:flex;align-items:center;gap:6px;}
.picker .grid{flex:1 1 auto;min-width:0;}
.grid.scroll{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scroll-snap-type:x mandatory;touch-action:pan-x;}
.grid.scroll .tile{scroll-snap-align:center;}
.navbtn{flex:0 0 auto;width:30px;align-self:stretch;min-height:46px;border:1px solid #3d3058;border-radius:8px;background:#1d1630;color:#ddd3ee;font-size:1.4rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s;}
.navbtn:hover{border-color:#6a5a90;color:#fff;} .navbtn:active{background:#2a2040;}
.tile{flex:0 0 62px;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:6px 4px;text-align:center;background:rgba(255,255,255,.05);transition:background .12s,border-color .12s;}
.tile:hover{background:rgba(255,255,255,.11);}
.tile.selected{border-color:#ffd54a;background:rgba(255,213,74,.14);}
.tile img.ball3d{width:100%;aspect-ratio:1;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));}
.tile .label{font-size:.68rem;color:#ddd3ee;margin-top:5px;}
.jump{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;}
.jump button{padding:7px 0;border:1px solid #3d3058;border-radius:7px;background:#1d1630;color:#ddd3ee;font-size:.8rem;font-weight:700;cursor:pointer;}
.jump button:active{background:#ffd54a;color:#181000;}
.toggle{width:100%;padding:11px;border:1px solid #3d3058;border-radius:9px;background:#1d1630;color:#ddd3ee;font-size:.9rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .12s;}
.toggle:hover{border-color:#6a5a90;}
.toggle.on{background:#ffd54a;color:#181000;border-color:#ffd54a;}
.seg{display:flex;border:1px solid #3d3058;border-radius:9px;overflow:hidden;}
.seg label{flex:1;cursor:pointer;}
.seg input{position:absolute;opacity:0;pointer-events:none;}
.seg span{display:block;padding:9px 4px;text-align:center;background:#1d1630;color:#ddd3ee;font-size:.88rem;font-weight:700;border-left:1px solid #3d3058;transition:all .12s;}
.seg label:first-child span{border-left:none;}
.seg span small{display:block;font-size:.68rem;font-weight:600;opacity:.75;}
.seg input:checked+span{background:#ffd54a;color:#181000;}
.stats{display:flex;justify-content:space-around;color:#ddd3ee;font-size:.85rem;}
.stats b{display:block;font-size:1.25rem;color:#ffd54a;text-align:center;}
</style>
</head>
<body>
<div id="hud"><div id="board"></div></div>
<div id="msg"></div>
<div id="info"><span>Stroke<b id="iStroke">1</b></span><span>To pin<b id="iDist">—</b></span><span>Lie<b id="iLie">Tee</b></span><span>Wind<b id="iWind">—</b></span></div>
<canvas id="map" width="150" height="300"></canvas>
<div id="ctrl">
  <div id="hint"></div>
  <div id="meter"><div id="mfill"></div><div id="mzone"></div><div id="mpow"></div><div id="mmark"></div></div>
  <div id="row"><div class="clubset"><button class="btn small" id="clubPrev" aria-label="Previous club">‹</button><div id="club"><b id="clubName">Driver</b><small id="clubCarry">250 yd</small></div><button class="btn small" id="clubNext" aria-label="Next club">›</button></div><button class="btn" id="swing">SWING</button></div>
</div>
<div id="celebrate"></div>
<button id="cog" class="iconbtn" title="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94a7.6 7.6 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.61-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 00-.61.22L2.68 8.84a.5.5 0 00.12.64l2.03 1.58a7.6 7.6 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32a.5.5 0 00.61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 00.5.42h3.84a.5.5 0 00.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 00.61-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg></button>
<button id="mute" class="iconbtn" title="Mute"></button>
<button id="view" class="iconbtn" title="Overview"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3L3 5.5v15.5l6-2.5 6 2.5 6-2.5V3l-6 2.5L9 3zm0 2.2l6 2.5v11.1l-6-2.5V5.2z"/></svg></button>
<div id="settings">
  <div class="modal-card">
    <div class="app-title">Just Golf <span class="emoji">🏌️</span></div>
    <div class="modal-head"><h3>Settings</h3><button id="settingsClose" aria-label="Close">✕</button></div>
    <div class="sec"><div class="sec-label">Ball</div>
      <div class="picker"><button class="navbtn" data-grid="ballGrid" data-dir="-1" aria-label="Previous ball">‹</button><div id="ballGrid" class="grid scroll"></div><button class="navbtn" data-grid="ballGrid" data-dir="1" aria-label="Next ball">›</button></div>
    </div>
    <div class="sec"><div class="sec-label" id="swingLbl">Swing</div>
      <div class="seg" role="radiogroup" aria-labelledby="swingLbl">
        <label><input type="radio" name="swing" value="meter"><span>Power meter<small>tap 3 times</small></span></label>
        <label><input type="radio" name="swing" value="draw"><span>Draw to drive<small>swipe the swing</small></span></label>
      </div>
    </div>
    <div class="sec"><div class="sec-label" id="maxLbl">Max over par</div>
      <div class="seg" role="radiogroup" aria-labelledby="maxLbl">
        <label><input type="radio" name="maxover" value="4"><span>+4</span></label>
        <label><input type="radio" name="maxover" value="8"><span>+8</span></label>
        <label><input type="radio" name="maxover" value="0"><span>No limit</span></label>
      </div>
    </div>
    <div class="sec"><div class="sec-label" id="todLbl">Time of day</div>
      <div class="seg" role="radiogroup" aria-labelledby="todLbl">
        <label><input type="radio" name="tod" value="0"><span>Morning</span></label>
        <label><input type="radio" name="tod" value="1"><span>Midday</span></label>
        <label><input type="radio" name="tod" value="2"><span>Golden hour</span></label>
        <label><input type="radio" name="tod" value="3"><span>Night</span></label>
      </div>

window.missHint=(function(){

  const el=()=>document.getElementById('hintModal'), off=()=>{ try{ return localStorage.getItem(key+'_hint_off')==='1'; }catch(e){ return false; } };

})();

function stepGreenAids(dt){

function buildTrees(){

const _rel=V3(), _f=V3(), _n=V3(), _tmp=V3();

const carryCache={};
function carryOf(ci,powMul){

const rollFrac=ci=>clamp(0.15-CLUBS[ci].rpm/75000,0.02,0.13);            // how much of a shot is roll-out, by club
const toPin=()=>Math.hypot(H.pin[0]-ball.p.x,H.pin[1]-ball.p.z);
function lieMul(){ const s=SURF[ball.lie]||SURF.fairway, c=CLUBS[clubIdx]; let p=s.pow; if(ball.lie==='sand'&&c.n==='S Wedge') p=0.88; if(c.n==='Driver'&&ball.lie!=='tee') p*=0.92; return p; }

// the pond the line at angle a crosses between from..to metres out (its full extent along the line), or null
function pondOnLine(a,from,to){ const P=ball.p, sx=Math.sin(a), sz=Math.cos(a), wet=s=>inWater(P.x+sx*s,P.z+sz*s); let s0=null;

function shotTarget(ci){

  const carry=atPin?Math.min(full,toP*(0.99-roll)):full, total=atPin?Math.max(carry,toP):carry*(1+roll);

// after picking the usual club: if it can only lay up short of water, see whether a longer one carries it
function avoidWater(){ if(clubIdx===PUTTER||shotTarget(clubIdx).kind!=='lay') return; const keep=clubIdx;

  clubIdx=keep; aimDefault(); }

function newGenGame(seed,theme){ clearGame(); setGen(seed,theme); ROUND_SKIN=null; roundCourse='gen'; testRound=false; anims=[]; scores=[]; holeIdx=0; startHole(); }
function jumpTo(i){ clearGame(); setCourse('all'); roundCourse='all'; testRound=true; anims=[]; scores=PLAY.slice(0,i).map(h=>h.par); holeIdx=i; startHole(); }
// the round in progress lives in sessionStorage, so a reload (or the Low graphics toggle) picks up where you left off
let resumeSave=null;
function saveGame(next){ try{ if(!H||phase==='over'||phase==='menu') return; const n=!!next; sessionStorage.setItem('justgolf_game',JSON.stringify({course:roundCourse,holeIdx:holeIdx+(n?1:0),scores,strokes:n?0:strokes,p:[ball.p.x,ball.p.z],last:ball.last,lie:ball.lie,wind,test:testRound,gen:roundCourse==='gen'?GEN:null,skin:ROUND_SKIN})); }catch(e){} }
function loadGame(){ try{ const g=JSON.parse(sessionStorage.getItem('justgolf_game')||'null'); if(!g||!Array.isArray(g.scores)) return null; if(g.course==='gen'&&g.gen) setGen(g.gen.seed,g.gen.theme); else setCourse(g.course||'front'); return g.holeIdx<PLAY.length?g:null; }catch(e){ return null; } }
function clearGame(){ try{ sessionStorage.removeItem('justgolf_game'); }catch(e){} }
function resumeGame(g){
  if(g.course==='gen'&&g.gen){ if(!sameCourse(GEN,g.gen)) setGen(g.gen.seed,g.gen.theme); } else setCourse(g.course||'front'); roundCourse=g.course||'front'; testRound=!!g.test; ROUND_SKIN=THEMES[g.skin]?g.skin:null; anims=[]; scores=g.scores.slice(); holeIdx=g.holeIdx; startHole(); if(g.wind) wind=g.wind;
  if(g.strokes>0){ strokes=g.strokes; const [x,z]=g.p; ball.p.set(x,meshH(x,z)+BALL_R,z); ball.lie=g.lie||surfAt(x,z); ball.last=g.last||[x,z]; buildTufts(); suggestClub(); aimDefault(); }
  updateUI(); buildHUD(); drawMap(true); saveGame();
}
function startHole(){
  H=PLAY[holeIdx]; strokes=0; buildHole(); envPrewarm(renderer,scene,camera);
  const [tx,tz]=H.tee; ball.p.set(tx,meshH(tx,tz)+BALL_R+0.03,tz); ball.v.set(0,0,0); ball.mode='rest'; ball.lie='tee'; ball.visible=true; ball.sink=0; ball.last=[tx,tz];
  const a=Math.random()*Math.PI*2, mph=Math.round(Math.random()*14*(H.wind||1)); wind={x:Math.sin(a)*mph*0.447,z:Math.cos(a)*mph*0.447,mph,a};   // exposed holes blow harder

  applyTOD();                                                                                   // (re-tints the haze for a themed course)
  showMsg(`HOLE ${HOLE_NO0+holeIdx+1} · ${H.name.toUpperCase()}<small>PAR ${H.par} · ${Math.round(H.len*YD)} YARDS${GEN&&holeIdx===0?' · '+courseLabel(GEN).toUpperCase():''}</small>`,3);
  updateUI(); buildHUD(); drawMap(true); saveGame();
}
function nextShot(){
  if(capHit()){ showMsg('Max strokes<small>SCORE '+capScore()+'</small>',1.6); endHole(capScore()); return; }      // also catches penalty strokes
  buildTufts(); ball.mode='rest'; phase='aim'; camMode='aim'; suggestClub(); aimDefault(); avoidWater(); updateUI(); buildHUD(); saveGame();
}
function strike(power,acc){                        // power 0..1, acc -1..1 (left = hook, right = slice)
  const c=CLUBS[clubIdx], lm=lieMul(), S2=SURF[ball.lie]||SURF.fairway;
  const v=c.v*power*lm*(1-Math.abs(acc)*0.15), la=(c.la+(ball.lie==='sand'?4:0)-(ball.lie==='tee'&&c.n!=='Driver'?0:0))*DEG;
  const dir=aim+acc*0.025, hs=v*Math.cos(la);
  ball.last=[ball.p.x,ball.p.z]; ball.v.set(Math.sin(dir)*hs,v*Math.sin(la),Math.cos(dir)*hs);
  ball.rpm=c.rpm*S2.spin*(0.82+0.18*power);
  ball.spinAxis.crossVectors(ball.v,UPV).normalize();                                       // pure backspin axis
  ball.spinAxis.applyAxisAngle(V3(Math.sin(dir),0,Math.cos(dir)),acc*0.55);                 // tilted axis → curve (right for a slice, left for a hook)
  ball.mode='fly'; ball.t=0; ball.inTree=false; ball.marked=false; strokes++; phase='flight'; camMode='flight'; flightPts=0; trail.geometry.setDrawRange(0,0);
  shotMarks(dir,power); sfxStrike(clubIdx,power);
  { const cy=carryOf(clubIdx,lm*power), roll=cy*rollFrac(clubIdx)*1.4, bx=ball.p.x, bz=ball.p.z;              // grass ready before the ball gets there
    ensureTufts(bx+Math.sin(dir)*cy,bz+Math.cos(dir)*cy); ensureTufts(bx+Math.sin(dir)*(cy+roll),bz+Math.cos(dir)*(cy+roll)); } buildHUD(); updateUI();
  showMsg(Math.abs(acc)<0.06?'Pure!':acc<0?(acc<-0.35?'Hook!':'Draw'):(acc>0.35?'Slice!':'Fade'),1.0);
}
function putt(dirx,dirz,pow){
  lastPuttFrom=toPin(); const v=7.2*Math.pow(pow,1.15)*settings.power; ball.last=[ball.p.x,ball.p.z]; ball.v.set(dirx*v,0,dirz*v); ball.mode='roll'; ball.t=0;
  strokes++; phase='flight'; camMode='putt'; sfxPutt(pow); buildHUD(); updateUI();
}
let lastPuttFrom=null;
function ballStopped(){
  if(ball.mode==='rest') return; ball.mode='rest';
  if(lastPuttFrom!=null){ if(lastPuttFrom<15) missHint.note(toPin()<Math.max(1,lastPuttFrom*0.4),'putt',3,'Your putts are finishing well short or long.<br>Watch the dotted guide while you pull back — it stretches to about where the putt will stop — and the grid and drifting dots on the green show which way it slopes.'); lastPuttFrom=null; }
  if(ball.lie==='ob'){ penalty('ob'); return; }
  const yds=Math.round(Math.hypot(ball.p.x-ball.last[0],ball.p.z-ball.last[1])*YD);
  if(yds>3) showMsg(`${yds} yards<small>${SURF[ball.lie].label.toUpperCase()}</small>`,1.6);
  tween(0.01,()=>{},()=>nextShot(),yds>3?1.4:0.5);
}
function penalty(kind){
  ball.mode='rest'; phase='penalty'; strokes++; const P=ball.p; lastPuttFrom=null;
  missHint.count('pen',3,'Water and out-of-bounds are adding up.<br>Tap the <b>map button</b> to see the whole hole, and check the <b>landing ring</b> sits somewhere safe before you swing. A shorter club to lay up is often the smart play.');
  if(kind==='water'){ sfxSplash(); ball.visible=false; { let lv=P.y; for(const W of H.water) if(ellR(W,P.x,P.z)<1.3) lv=waterLevel(W); envSplash(holeGroup,P.x,lv+0.02,P.z,1.6); }
    // drop: back along the line toward where it was hit, two clubs-lengths clear of the hazard
    let x=P.x, z=P.z; const dx=ball.last[0]-x, dz=ball.last[1]-z, l=Math.hypot(dx,dz)||1;
    // (clear of the pond's sunken bank too: the flight check counts anything below the water level near a pond as wet)
    const wetAt=inWater;
    for(let i=0;i<400&&(wetAt(x,z)||surfAt(x,z)==='sand');i++){ x+=dx/l*0.5; z+=dz/l*0.5; } x+=dx/l*2; z+=dz/l*2;
    // ponds are ringed by deep rough, which saps a quarter of the swing: keep going back along the line (up to 30 m, never past
    // where it was hit) to the first rough/fairway, so the next shot has a fair chance of clearing the water
    for(let k=0;k<30&&surfAt(x,z)==='deep'&&Math.hypot(ball.last[0]-x,ball.last[1]-z)>3;k++){ const nx=x+dx/l, nz=z+dz/l, ns=surfAt(nx,nz); if(wetAt(nx,nz)||ns==='sand'||ns==='ob') break; x=nx; z=nz; }   // …but never into another hazard
    showMsg('Splash!<small>1-STROKE PENALTY · DROP</small>',1.8);
    tween(0.01,()=>{},()=>{ ball.p.set(x,meshH(x,z)+BALL_R,z); ball.lie=surfAt(x,z); ball.visible=true; nextShot(); },1.8); }
  else { showMsg('Out of bounds<small>STROKE AND DISTANCE</small>',1.8);
    tween(0.01,()=>{},()=>{ const [x,z]=ball.last; ball.p.set(x,meshH(x,z)+BALL_R,z); ball.lie=surfAt(x,z); nextShot(); },1.8); }
}
function holed(){
  if(lastPuttFrom!=null){ missHint.note(true,'putt'); lastPuttFrom=null; }
  ball.mode='rest'; phase='sunk'; sfxCup(); const fx=ball.p.x, fz=ball.p.z;
  tween(0.3,u=>{ ball.p.x=fx+(H.pin[0]-fx)*u; ball.p.z=fz+(H.pin[1]-fz)*u; ball.sink=u*0.06; },()=>{ ball.visible=false; endHole(strokes); });
}
function endHole(sc){
  phase='sunk'; scores.push(sc); saveGame(true); const rel=sc-H.par;
  const term=sc===1?'HOLE IN ONE!':rel<=-3?'ALBATROSS!':rel===-2?'EAGLE!':rel===-1?'BIRDIE!':rel===0?'PAR':rel===1?'BOGEY':rel===2?'DOUBLE BOGEY':'+'+rel;
  if(rel<0){ celebrate(term,rel<=-2?'pink':'gold'); sfxChime('great'); if(!testRound){ stats.aces++; saveStats(); } } else if(rel===0){ celebrate(term,'green'); sfxChime('par'); } else { showMsg(term,1.6); sfxChime('over'); }
  buildHUD(); tween(0.01,()=>{},()=>{ holeIdx++; if(holeIdx>=PLAY.length) roundOver(); else startHole(); },2.4);
}
function roundOver(){
  clearGame(); phase='over'; const s=scores.reduce((a,b)=>a+b,0), par=PLAY.reduce((a,h)=>a+h.par,0), rel=s-par, bk=bestKey(roundCourse), isGen=roundCourse==='gen'&&GEN, ge=isGen?savedFind(GEN):null;
  const newBest=!testRound&&(isGen?(!!ge&&(!ge.best||s<ge.best)):(!stats[bk]||s<stats[bk]));
  const tix=Math.max(1,(par+Math.ceil(PLAY.length/4)-s)*4+2); if(!testRound){ stats.games++; stats.tickets+=tix; if(newBest){ if(isGen) setSavedBest(GEN,s); else stats[bk]=s; } saveStats(); } buildHUD();
  const ov=document.getElementById('ov'); ov.querySelector('h2').textContent=`🏌️ ${s} (${rel===0?'E':rel>0?'+'+rel:rel})`;
  let tbl=''; for(let a=0;a<PLAY.length;a+=9){ const hs=PLAY.slice(a,a+9), sc=scores.slice(a,a+9);
    tbl+=`<table><tr><th>Hole</th>${hs.map((h,i)=>`<th>${HOLE_NO0+a+i+1}</th>`).join('')}<th>${PLAY.length>9?(a?'In':'Out'):'Tot'}</th></tr>`
      +`<tr><th>Par</th>${hs.map(h=>`<td>${h.par}</td>`).join('')}<td>${hs.reduce((x,h)=>x+h.par,0)}</td></tr>`
      +`<tr><th>You</th>${sc.map(v=>`<td>${v}</td>`).join('')}<td><b>${sc.reduce((x,v)=>x+v,0)}</b></td></tr></table>`; }
  ov.querySelector('p').innerHTML=tbl+(PLAY.length>9?`<br>Total <b>${s}</b> · par ${par}`:'')+'<br>'
    +(newBest?'<b>New best!</b><br>':'')+(testRound?'Test round · not counted':`You won <b>${tix}</b> ticket${tix===1?'':'s'} 🎟️ &nbsp;·&nbsp; Best ${isGen?(newBest?s:(ge&&ge.best)||'–'):stats[bk]||'–'}`)
    +(isGen?`<br>Course <b>${courseLabel(GEN)}</b> ${ge?'· saved':'<button class="mini" id="ovSave">Save course</button>'}`:'');
  showStart('over'); refreshStats();
  const sv=document.getElementById('ovSave'); if(sv) sv.addEventListener('click',()=>{ saveCourse(GEN); setSavedBest(GEN,s); sv.replaceWith(document.createTextNode('· saved')); });
}
function celebrate(text,cls){ const el=document.getElementById('celebrate'); el.className=''; void el.offsetWidth; el.textContent=text; el.classList.add('show',cls); }
function showMsg(html,t){ document.getElementById('msg').innerHTML=html; msgT=t||1.4; }
function buildHUD(){
  const page=holeIdx>=9&&PLAY.length>9?1:0, from=page*9, to=Math.min(PLAY.length,from+9); let h='';
  if(page){ const out=scores.slice(0,9).reduce((a,b)=>a+b,0); h+=`<div class="fr"><div class="fh">OUT</div><div class="tot">${out}</div></div>`; }
  for(let i=from;i<to;i++){ const hh=PLAY[i], v=scores[i], cur=i===holeIdx&&phase!=='over'&&phase!=='menu', shown=v!=null?v:(cur&&strokes?strokes:'');
    const cls=v==null?'':v<hh.par?' under':v>hh.par?' over':''; h+=`<div class="fr${cur?' cur':''}"><div class="fh">${HOLE_NO0+i+1}<small>P${hh.par}</small></div><div class="tot${cls}">${shown}</div></div>`; }
  const s=scores.reduce((a,b)=>a+b,0), p=PLAY.slice(0,scores.length).reduce((a,x)=>a+x.par,0), r=s-p, best=roundCourse==='gen'&&GEN&&phase!=='menu'?((savedFind(GEN)||{}).best||0):stats[bestKey(phase==='menu'?settings.course:roundCourse)];
  h+=`<div class="fr ftot"><div class="fh">TOTAL</div><div class="tot">${scores.length?s+' <small style="font-size:.6em;color:#bba">'+(r===0?'E':r>0?'+'+r:r)+'</small>':'–'}</div></div><div class="fr fbest"><div class="fh">BEST</div><div class="tot">${best||'–'}</div></div>`;

const ARROWS=['↑','↗','→','↘','↓','↙','←','↖'];
function updateUI(){
  document.getElementById('iStroke').textContent=strokes+1;
  const d=toPin(); document.getElementById('iDist').textContent=ball.lie==='green'||d<20?Math.round(d*3.281)+' ft':Math.round(d*YD)+' yd';
  document.getElementById('iLie').textContent=(SURF[ball.lie]||SURF.fairway).label;
  // wind arrow relative to the way you're aiming
  const rel=Math.atan2(wind.x,wind.z)-aim; document.getElementById('iWind').textContent=wind.mph?ARROWS[((Math.round(rel/(Math.PI/4))%8)+8)%8]+' '+wind.mph+' mph':'calm';
  const c=CLUBS[clubIdx]; document.getElementById('clubName').textContent=c.n;
  document.getElementById('clubCarry').textContent=c.putter?'pull back from the ball':Math.round(carryOf(clubIdx,lieMul())*YD)+' yd carry';
  const putting=c.putter; document.getElementById('meter').style.visibility=putting||drawing()?'hidden':'visible';
  const T=!putting&&phase==='aim'?shotTarget(clubIdx):null;
  if(T){ const p=powerFor(clubIdx,T.carry), pw=document.getElementById('mpow'); pw.style.left=((IMPACT+(1-IMPACT)*p)*100)+'%'; pw.style.display=p<0.97||T.kind!=='normal'?'block':'none'; pw.style.background='rgba(255,213,74,.9)'; } document.getElementById('swing').style.display=putting?'none':'';
  let ht=''; if(phase==='aim'){ if(putting) ht='Touch the ball, pull back and release to putt'; else { const p=powerFor(clubIdx,T.carry), pc=Math.round(p*100);
    if(T.kind==='over') ht=`Carry the water: about ${pc}% power`+(drawing()?' · tap SWING and draw':' · tap SWING');
    else if(T.kind==='lay') ht=`Lay up short of the water: about ${pc}% power`+(drawing()?' · tap SWING and draw':' · tap SWING');
    else ht=drawing()?(p<0.97?`Pin needs about ${pc}% power · tap SWING and draw`:'Drag sideways to aim · tap SWING: back from ADDRESS, then through to FINISH'):(p<0.97?`Pin needs about ${pc}% power · tap SWING`:'Drag sideways to aim · tap SWING to start the meter'); } }

function powerFor(ci,d){ let lo=0.2, hi=1; if(carryOf(ci,lieMul())<d) return 1; for(let i=0;i<14;i++){ const m=(lo+hi)/2; if(carryOf(ci,lieMul()*m)<d) lo=m; else hi=m; } return (lo+hi)/2; }
function hint(t){ document.getElementById('hint').textContent=t; }

// ── 3-click swing meter: start, set power, then stop it on the impact zone for accuracy ──
let meter={state:'idle',x:0,power:0};
const IMPACT=0.12;
let _lastSwingTap=0;
function swingClick(){
  const now=performance.now(); if(now-_lastSwingTap<40) return; _lastSwingTap=now;      // one press never counts twice (button + the view under it, click + pointer)
  if(clubIdx===PUTTER) return;
  if(phase==='aim'&&drawing()){ getAC(); initSfx(); startAmbient(); openPad(); return; }
  if(phase!=='aim'&&meter.state==='idle') return; getAC(); initSfx(); startAmbient();
  if(meter.state==='idle'){ if(phase!=='aim') return; meter={state:'up',x:IMPACT,power:0}; phase='swing'; }
  else if(meter.state==='up'){ meter.power=clamp((meter.x-IMPACT)/(1-IMPACT),0.05,1); meter.state='down'; const pw=document.getElementById('mpow'); pw.style.left=(meter.x*100)+'%'; pw.style.display='block'; pw.style.background='#fff'; }
  else if(meter.state==='down'){ finishSwing(-(meter.x-IMPACT)/0.12); }      // early = hook (−), late = slice (+)
}
function finishSwing(accRaw){ const acc=clamp(accRaw,-1,1); meter.state='idle';
  missHint.note(Math.abs(acc)<0.35,'swing',3,'Your last few swings went way off line.<br>Stop the meter right on the white zone for a straight shot — or try <b>Swing: Draw to drive</b> in <b>Settings</b>.'); document.getElementById('mfill').style.width='0'; strike(meter.power,acc); }
function updateMeter(dt){
  if(meter.state==='idle') return; const sp=1.05*settings.meter;
  if(meter.state==='up'){ meter.x+=sp*dt; if(meter.x>=1){ meter.x=1; meter.power=1; meter.state='down'; } }
  else if(meter.state==='down'){ meter.x-=sp*1.15*dt; if(meter.x<=IMPACT-0.12){ finishSwing(1); return; } }          // never stopped it: a big slice
  document.getElementById('mmark').style.left=(meter.x*100)+'%';
  const f=document.getElementById('mfill'); f.style.left=(IMPACT*100)+'%'; f.style.width=Math.max(0,(meter.state==='up'?meter.x:meter.power*(1-IMPACT)+IMPACT)-IMPACT)*100+'%';
}

// ── draw to drive (Settings → Swing), like a real swing. Start at ADDRESS (centre), draw down for the backswing,
//    then sweep up through impact to FINISH. Backswing length caps the power, downswing speed sets it,
//    where you cross impact pushes/pulls and the bend of the downswing draws/fades. ──
const pad={cv:null,pts:[],on:false,turn:-1};
function padGeom(){ const r=pad.cv.getBoundingClientRect(), W=r.width, Hh=r.height;
  return {r,W,Hh,cx:W/2,cy:Hh*0.5,rad:Math.min(W*0.19,40),backY:Hh*0.92,finY:Hh*0.17}; }
function openPad(){ phase='pad'; document.getElementById('pad').classList.add('open'); pad.pts=[]; pad.on=false; pad.turn=-1; padMsg('Touch ADDRESS'); sizePad(); drawPad(); }
function closePad(){ document.getElementById('pad').classList.remove('open'); if(phase==='pad') phase='aim'; }
function padMsg(t){ document.getElementById('padMsg').textContent=t; }
function sizePad(){ const r=pad.cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1); pad.cv.width=r.width*dpr; pad.cv.height=r.height*dpr; pad.cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0); }
function drawPad(){
  const g=pad.cv.getContext('2d'), Q=padGeom(); g.clearRect(0,0,Q.W,Q.Hh);
  const bg=g.createLinearGradient(0,Q.cy,0,Q.Hh); bg.addColorStop(0,'rgba(80,160,255,0)'); bg.addColorStop(1,'rgba(80,160,255,.28)'); g.fillStyle=bg; g.fillRect(0,Q.cy,Q.W,Q.Hh-Q.cy);   // backswing zone
  g.fillStyle='rgba(255,213,74,.16)'; g.fillRect(0,0,Q.W,Q.finY);                                                                                                   // finish zone
  g.strokeStyle='rgba(255,213,74,.7)'; g.setLineDash([5,6]); g.lineWidth=2; g.beginPath(); g.moveTo(10,Q.finY); g.lineTo(Q.W-10,Q.finY); g.stroke();
  g.strokeStyle='rgba(255,255,255,.35)'; g.beginPath(); g.moveTo(10,Q.cy); g.lineTo(Q.W-10,Q.cy); g.stroke(); g.setLineDash([]);                                     // impact line
  g.font='800 12px "Segoe UI",Arial'; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#ffd54a'; g.fillText('FINISH',Q.cx,Q.finY*0.5); g.fillStyle='#8fc4ff'; g.fillText('BACKSWING',Q.cx,Q.Hh-18);
  g.fillStyle='rgba(93,255,154,.2)'; g.strokeStyle='#5dff9a'; g.lineWidth=3; g.beginPath(); g.arc(Q.cx,Q.cy,Q.rad,0,7); g.fill(); g.stroke();
  g.fillStyle='#5dff9a'; g.fillText('ADDRESS',Q.cx,Q.cy);
  const P=pad.pts; if(P.length>1){ g.lineCap='round'; g.lineJoin='round';
    const seg=(a,b,col)=>{ if(b-a<1) return; g.strokeStyle='rgba(0,0,0,.5)'; g.lineWidth=9; g.beginPath(); for(let i=a;i<=b;i++) i===a?g.moveTo(P[i].x,P[i].y):g.lineTo(P[i].x,P[i].y); g.stroke();
      g.strokeStyle=col; g.lineWidth=5; g.beginPath(); for(let i=a;i<=b;i++) i===a?g.moveTo(P[i].x,P[i].y):g.lineTo(P[i].x,P[i].y); g.stroke(); };
    const t=pad.turn<0?P.length-1:pad.turn; seg(0,t,'#8fc4ff'); if(pad.turn>=0) seg(pad.turn,P.length-1,'#ffffff');
    const back=clamp((P[t].y-Q.cy)/(Q.backY-Q.cy),0,1); g.fillStyle='rgba(143,196,255,.9)'; g.fillRect(Q.W-10,Q.cy,5,(Q.Hh-Q.cy)*back); }                          // backswing length bar
}
function padPt(e){ const Q=padGeom(); return {x:e.clientX-Q.r.left,y:e.clientY-Q.r.top,t:performance.now()}; }
function padDown(e){ e.preventDefault(); e.stopPropagation(); const Q=padGeom(), p=padPt(e);
  if(Math.hypot(p.x-Q.cx,p.y-Q.cy)>Q.rad*1.2){ padMsg('Start on ADDRESS'); return; }
  try{ pad.cv.setPointerCapture(e.pointerId); }catch(_){} pad.on=true; pad.pts=[p]; pad.turn=-1; padMsg('Swing back (down)…'); drawPad(); }
function padMove(e){
  if(!pad.on) return; e.preventDefault(); const p=padPt(e), P=pad.pts; P.push(p);
  if(pad.turn<0){ let lo=0; for(let i=1;i<P.length;i++) if(P[i].y>P[lo].y) lo=i;                       // lowest point so far = top of the backswing
    if(P[lo].y-p.y>12&&P[lo].y>padGeom().cy+14){ pad.turn=lo; padMsg('…and through!'); } }
  drawPad();
}
function padUp(e){
  if(!pad.on) return; e.preventDefault(); pad.on=false; const Q=padGeom(), P=pad.pts, end=P[P.length-1], retry=t=>{ padMsg(t); pad.pts=[]; pad.turn=-1; drawPad(); };
  if(pad.turn<0) return retry('Swing back first, then through');
  if(end.y>Q.finY) return retry('Follow through into FINISH');
  const T=P[pad.turn], back=clamp((T.y-Q.cy)/(Q.backY-Q.cy),0,1);

  pick('tod','tod'); pick('maxover','maxOver');
  document.querySelectorAll('input[name="tod"]').forEach(r=>r.addEventListener('change',()=>applyTOD()));
  document.querySelectorAll('input[name="skin"]').forEach(r=>r.addEventListener('change',()=>{ if(r.checked) busyThen(()=>setSkin(r.value)); }));
    { const jg=document.getElementById('jumpGrid');                                   // testing: start a round at any hole (earlier holes count as par; stats untouched)
    for(let i=0;i<HOLES.length;i++){ const b=document.createElement('button'); b.textContent=i+1; b.addEventListener('click',()=>{ getAC(); initSfx(); modal.classList.remove('open'); document.getElementById('ov').classList.remove('show'); jumpTo(i); }); jg.appendChild(b); } }
  document.getElementById('newGameBtn').addEventListener('click',()=>{ getAC(); initSfx(); modal.classList.remove('open'); if(phase==='menu') showStart(resumeSave?'resume':'start'); else if(phase!=='over') showStart('newgame'); });
}
// the start card: pick a course to start a new round (it's remembered and highlighted next time); START/CONTINUE only
// resumes a round in progress (or goes back to it from Settings → New Game)
function showStart(mode,show){ const ov=document.getElementById('ov'), sb=document.getElementById('startbtn'); document.getElementById('genPanel').classList.remove('open'); document.getElementById('coursePick').style.display=''; delete sb.dataset.was;
  sb.style.display=mode==='resume'||mode==='newgame'?'':'none'; sb.textContent=mode==='resume'?'CONTINUE ROUND':'BACK TO ROUND';
  document.getElementById('cpLabel').textContent=mode==='resume'?'Or start a new round':mode==='over'?'Play again':mode==='newgame'?'Start a new round':'Choose a course';
  document.querySelectorAll('#coursePick button').forEach(b=>b.classList.toggle('last',b.dataset.c===settings.course));
  if(mode==='newgame'){ ov.querySelector('h2').textContent=OV_TITLE; ov.querySelector('p').innerHTML='Starting a new round ends the one you\'re playing.'; }
  if(show!==false) ov.classList.add('show'); }
let OV_TITLE='';
// ── Generate: pick a theme and a seed (a fresh one is offered; type one to replay a course), or a saved course ──
let genTheme='default';
function openGen(on){ document.getElementById('genPanel').classList.toggle('open',on); document.getElementById('coursePick').style.display=on?'none':''; const sb=document.getElementById('startbtn');
  if(on){ sb.dataset.was=sb.style.display; sb.style.display='none'; genTheme=THEMES[settings.genTheme]?settings.genTheme:'default'; document.getElementById('genSeed').value=newSeed(); drawGenPanel(); } else if(sb.dataset.was!=null){ sb.style.display=sb.dataset.was; } }
function drawGenPanel(){ document.querySelectorAll('#genThemes button').forEach(b=>b.classList.toggle('sel',b.dataset.t===genTheme));
  const a=savedCourses(), box=document.getElementById('genSaved'); document.getElementById('genSavedLbl').style.display=a.length?'':'none'; box.innerHTML='';
  for(const e of a){ const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<span><b>${courseLabel(e)}</b> <small>${e.best?'best '+e.best:'no score yet'}</small></span><button class="mini" data-act="play">Play</button><button class="mini" data-act="del" aria-label="Delete">✕</button>`;
    row.querySelector('[data-act=play]').addEventListener('click',()=>startGen(e.seed,e.theme));
    row.querySelector('[data-act=del]').addEventListener('click',()=>{ writeSaved(savedCourses().filter(x=>!sameCourse(x,e))); drawGenPanel(); });
    box.appendChild(row); } }
function startGen(seed,theme){ settings.genTheme=theme; saveSettings(); openGen(false); document.getElementById('ov').classList.remove('show'); getAC(); initSfx(); startAmbient(); resize(); resumeSave=null; newGenGame(seed,theme); refreshStats(); }
document.querySelectorAll('#genThemes button').forEach(b=>b.addEventListener('click',()=>{ genTheme=b.dataset.t; drawGenPanel(); }));
document.getElementById('genRoll').addEventListener('click',()=>{ document.getElementById('genSeed').value=newSeed(); });
document.getElementById('genSeed').addEventListener('input',e=>{ const v=cleanSeed(e.target.value); if(v!==e.target.value) e.target.value=v; });
document.getElementById('genPlay').addEventListener('click',()=>{ const sd=cleanSeed(document.getElementById('genSeed').value)||newSeed(); startGen(sd,genTheme); });
document.getElementById('genBack').addEventListener('click',()=>openGen(false));
document.querySelectorAll('#coursePick button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.c==='gen'){ openGen(true); return; } settings.course=b.dataset.c; saveSettings();
  document.getElementById('ov').classList.remove('show'); getAC(); initSfx(); startAmbient(); resize(); resumeSave=null; newGame(); refreshStats(); }));
document.getElementById('startbtn').addEventListener('click',()=>{ document.getElementById('ov').classList.remove('show'); getAC(); initSfx(); startAmbient(); resize(); if(resumeSave){ const g=resumeSave; resumeSave=null; resumeGame(g); } });
function boot(){
  setupSettings();
  document.querySelector('#ov p').innerHTML='<b>Drag sideways to aim</b>, then tap <b>SWING</b> three times: once to start, once to set power, and once on the white zone for a straight shot (early hooks, late slices). Pick clubs with ‹ ›; the ring shows where a full shot lands.<br>On the green, <b>touch the ball, pull back &amp; release</b> to putt. Watch the wind, the water and the bunkers.';
  initScene(); bindInput();
  H=HOLES[0]; buildHole(); envPrewarm(renderer,scene,camera); ball.p.set(H.tee[0],hAt(H.tee[0],H.tee[1])+BALL_R,H.tee[1]); aimAtPin(); phase='menu'; camMode='aim';
  resumeSave=loadGame(); OV_TITLE=document.querySelector('#ov h2').textContent; showStart(resumeSave?'resume':'start',false);
  try{ if(sessionStorage.getItem('lowgfxReload')){ sessionStorage.removeItem('lowgfxReload'); document.getElementById('ov').classList.remove('show'); if(resumeSave){ const g=resumeSave; resumeSave=null; resumeGame(g); } else newGame(); document.getElementById('settings').classList.add('open'); } }catch(e){}
  buildHUD(); drawMap(true);
  requestAnimationFrame(t=>{ lastT=t; loop(t); });
}
// show the title + spinner first, then build the scene; the start card appears once the first frames have drawn
// (that first render is where the shaders compile, so it's part of the wait)
function bootDone(){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ const L=document.getElementById('loader'); L.classList.add('done'); setTimeout(()=>L.remove(),500);
  if(phase==='menu') document.getElementById('ov').classList.add('show'); })); }
requestAnimationFrame(()=>setTimeout(()=>{ try{ boot(); bootDone(); }catch(err){ document.getElementById('loader').remove(); showFatal(err); } },0));
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
