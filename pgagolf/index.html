<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Just Golf</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08060e">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Just Golf">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100dvw;height:100dvh;background:#08060e;font-family:'Segoe UI',Arial,sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;}
#hud{width:100%;flex-shrink:0;background:rgba(0,0,0,.6);padding:4px 6px;overflow-x:auto;z-index:6;}
#board{display:flex;gap:2px;min-width:min-content;justify-content:center;}
.fr{border:1px solid #3a2d50;border-radius:3px;min-width:46px;background:#151022;}
.fr .fh{font-size:.72rem;text-align:center;color:#a08cc0;border-bottom:1px solid #3a2d50;padding:1px 0;}
.fr .fh small{color:#6f5f8c;margin-left:3px;}
.fr .tot{text-align:center;font-size:1.2rem;font-weight:800;line-height:28px;color:#ffd54a;font-variant-numeric:tabular-nums;}
.fr.ftot{min-width:62px;} .fr.ftot .tot{color:#fff;}
.fr.fbest{min-width:56px;} .fr.fbest .tot{color:#8fe3ff;}
.fr.cur{border-color:#ffd54a;box-shadow:0 0 8px rgba(255,213,74,.4);}
.fr .tot.under{color:#5dff9a;} .fr .tot.over{color:#ff8a6a;} .fr .tot.ace{color:#ff7ad9;}
@media (orientation:portrait){
  #hud{padding-left:0;padding-right:0;}
  #board{width:100vw;gap:1px;}
  .fr{flex:1 1 0;min-width:0;} .fr.ftot{flex:1.3 1 0;} .fr.fbest{flex:1.3 1 0;}
}
@media (max-width:420px){ .fr .fh{font-size:.58rem;} .fr .tot{font-size:.95rem;line-height:22px;} }
#msg{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:clamp(1.3rem,5.5vw,2.3rem);font-weight:800;color:#ffd54a;
  text-shadow:0 2px 14px #000;pointer-events:none;letter-spacing:1px;z-index:5;line-height:1.3;}
#msg small{display:block;font-size:.55em;color:#e8dcff;letter-spacing:2px;}
#celebrate{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:15;pointer-events:none;opacity:0;
  font-weight:900;letter-spacing:5px;font-size:clamp(2.4rem,12vw,6rem);}
#celebrate.show{animation:celebpop 1.8s cubic-bezier(.2,.8,.3,1) forwards;}
#celebrate.gold{color:#ffd54a;text-shadow:0 0 34px rgba(255,170,0,.85),0 5px 0 #9a5600;}
#celebrate.pink{color:#ff7ad9;text-shadow:0 0 34px rgba(255,60,200,.85),0 5px 0 #7a0650;}
#celebrate.green{color:#5dff9a;text-shadow:0 0 30px rgba(40,255,140,.75),0 5px 0 #0a6a30;}
@keyframes celebpop{ 0%{opacity:0;transform:scale(.3) rotate(-9deg);} 14%{opacity:1;transform:scale(1.18) rotate(3deg);} 28%{transform:scale(1) rotate(0);} 72%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(1.12);} }
#info{position:fixed;left:10px;z-index:7;background:rgba(0,0,0,.5);border-radius:10px;padding:7px 11px;display:flex;flex-direction:column;gap:2px;
  font-size:clamp(.68rem,2.2vw,.86rem);font-weight:700;pointer-events:none;}
#info span{display:flex;justify-content:space-between;gap:12px;min-width:120px;} #info b{color:#ffd54a;}
#map{position:fixed;right:10px;z-index:7;width:clamp(76px,16vw,120px);height:auto;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:#1b3a1a;box-shadow:0 4px 14px rgba(0,0,0,.4);}
#ctrl{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 10px 14px;pointer-events:none;}
#row{display:flex;gap:8px;align-items:center;pointer-events:auto;}
.btn{padding:10px 14px;border:1px solid rgba(255,255,255,.28);border-radius:9px;background:rgba(18,14,28,.88);color:#ddd3ee;font-size:.95rem;font-weight:800;cursor:pointer;}
.btn.small{padding:10px 12px;font-size:1.2rem;line-height:1;}
#swing{background:#ffd54a;color:#181000;border-color:#ffd54a;min-width:120px;}
#swing:disabled{opacity:.5;}
#club{min-width:96px;text-align:center;background:rgba(18,14,28,.88);border:1px solid rgba(255,255,255,.28);border-radius:9px;padding:5px 8px;line-height:1.15;}
#club b{display:block;color:#fff;} #club small{color:#b7a6d6;font-size:.72rem;}
#hint{font-size:.8rem;color:#f2ecff;text-shadow:0 1px 4px #000;min-height:1.1em;pointer-events:none;}
#meter{position:relative;width:min(86vw,420px);height:22px;border-radius:11px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);overflow:hidden;}
#mfill{position:absolute;top:0;bottom:0;left:12%;width:0;background:linear-gradient(90deg,#3ad46a,#ffd54a 70%,#ff5a4a);opacity:.85;}
#mzone{position:absolute;top:0;bottom:0;left:calc(12% - 2.2%);width:4.4%;background:rgba(255,255,255,.25);}
#mpow{position:absolute;top:0;bottom:0;width:3px;background:#fff;display:none;}
#mmark{position:absolute;top:-2px;bottom:-2px;width:3px;left:12%;background:#ff3b5c;box-shadow:0 0 6px #ff3b5c;}
#pad{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(46vw,240px);height:min(66vh,480px);z-index:24;display:none;
  border-radius:26px;background:rgba(10,8,20,.72);border:2px solid rgba(255,255,255,.35);box-shadow:0 18px 50px rgba(0,0,0,.5);backdrop-filter:blur(3px);}
#pad.open{display:block;}
#padCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:26px;}
#padClose{position:absolute;top:8px;right:10px;background:none;border:none;color:#ddd3ee;font-size:1.2rem;cursor:pointer;}
#padMsg{position:absolute;left:0;right:0;top:46%;text-align:center;font-weight:800;color:#f2ecff;font-size:.9rem;text-shadow:0 1px 4px #000;pointer-events:none;}
#stage{flex:1;width:100%;position:relative;cursor:grab;min-height:0;overflow:hidden;}
#stage.aiming{cursor:grabbing;}
#stage canvas{display:block;width:100%;height:100%;}
#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, rgba(6,4,12,.3) 0%, rgba(6,4,12,.75) 100%);gap:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;padding:20px;}
#ov.show{opacity:1;pointer-events:auto;}
#ov h2{font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:2px;color:#ffd54a;text-shadow:0 0 20px rgba(255,170,0,.5);}
#ov p{color:#ddd3ee;font-size:clamp(.82rem,2.4vw,1rem);line-height:1.6;max-width:420px;text-shadow:0 1px 6px #000;}
#ov table{border-collapse:collapse;font-size:.9rem;color:#ddd3ee;}
#ov td,#ov th{border:1px solid #3a2d50;padding:3px 9px;text-align:center;} #ov th{color:#a08cc0;font-weight:600;}
#startbtn{margin-top:6px;padding:11px 34px;background:#ffd54a;color:#181000;border:none;border-radius:8px;
  font-size:clamp(.95rem,2.6vw,1.15rem);font-weight:800;cursor:pointer;letter-spacing:1px;}
#startbtn:hover{background:#ffe27a;}
.iconbtn{position:fixed;top:6vh;z-index:25;border:none;background:none;color:#ddd3ee;display:flex;align-items:center;justify-content:center;
  height:1em;font-size:4em;line-height:1;padding:0;opacity:0.9;cursor:pointer;transition:transform .15s,opacity .15s;}
.iconbtn:hover{opacity:1;}
#cog{left:12px;} #cog:hover{transform:rotate(45deg);}
#mute{right:12px;}
#view{right:12px;}
.iconbtn svg{width:0.8em;height:0.8em;display:block;overflow:visible;
  filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000) drop-shadow(0 0 3px rgba(0,0,0,.55));}
#view.on{color:#ffd54a;}
#settings{position:fixed;inset:0;z-index:26;display:none;align-items:center;justify-content:center;background:rgba(2,2,8,.62);}
#settings.open{display:flex;}
.modal-card{width:min(94vw,480px);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:16px;
  background:rgba(18,14,28,.98);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);}
@media (max-width:520px){ .modal-card{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:none;} }
.app-title{text-align:center;color:#ffd54a;font-size:1.6rem;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px rgba(255,170,0,.45);margin-bottom:-4px;}
.app-title .emoji{text-shadow:none;}
.modal-head{display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{color:#ffd54a;font-size:1.2rem;letter-spacing:1px;}
#settingsClose{background:none;border:none;color:#b7a6d6;font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer;}
#settingsClose:hover{color:#fff;}
.sec-label{color:#b7a6d6;font-size:.8rem;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
.grid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
.picker{display:flex;align-items:center;gap:6px;}
.picker .grid{flex:1 1 auto;min-width:0;}
.grid.scroll{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scroll-snap-type:x mandatory;touch-action:pan-x;}
.grid.scroll .tile{scroll-snap-align:center;}
.navbtn{flex:0 0 auto;width:30px;align-self:stretch;min-height:46px;border:1px solid #3d3058;border-radius:8px;background:#1d1630;color:#ddd3ee;font-size:1.4rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s;}
.navbtn:hover{border-color:#6a5a90;color:#fff;} .navbtn:active{background:#2a2040;}
.tile{flex:0 0 62px;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:6px 4px;text-align:center;background:rgba(255,255,255,.05);transition:background .12s,border-color .12s;}
.tile:hover{background:rgba(255,255,255,.11);}
.tile.selected{border-color:#ffd54a;background:rgba(255,213,74,.14);}
.tile img.ball3d{width:100%;aspect-ratio:1;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));}
.tile .label{font-size:.68rem;color:#ddd3ee;margin-top:5px;}
.toggle{width:100%;padding:11px;border:1px solid #3d3058;border-radius:9px;background:#1d1630;color:#ddd3ee;font-size:.9rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .12s;}
.toggle:hover{border-color:#6a5a90;}
.toggle.on{background:#ffd54a;color:#181000;border-color:#ffd54a;}
.seg{display:flex;border:1px solid #3d3058;border-radius:9px;overflow:hidden;}
.seg label{flex:1;cursor:pointer;}
.seg input{position:absolute;opacity:0;pointer-events:none;}
.seg span{display:block;padding:9px 4px;text-align:center;background:#1d1630;color:#ddd3ee;font-size:.88rem;font-weight:700;border-left:1px solid #3d3058;transition:all .12s;}
.seg label:first-child span{border-left:none;}
.seg span small{display:block;font-size:.68rem;font-weight:600;opacity:.75;}
.seg input:checked+span{background:#ffd54a;color:#181000;}
.stats{display:flex;justify-content:space-around;color:#ddd3ee;font-size:.85rem;}
.stats b{display:block;font-size:1.25rem;color:#ffd54a;text-align:center;}
</style>
</head>
<body>
<div id="hud"><div id="board"></div></div>
<div id="msg"></div>
<div id="info"><span>Stroke<b id="iStroke">1</b></span><span>To pin<b id="iDist">—</b></span><span>Lie<b id="iLie">Tee</b></span><span>Wind<b id="iWind">—</b></span></div>
<canvas id="map" width="150" height="300"></canvas>
<div id="ctrl">
  <div id="hint"></div>
  <div id="meter"><div id="mfill"></div><div id="mzone"></div><div id="mpow"></div><div id="mmark"></div></div>
  <div id="row"><button class="btn small" id="clubPrev" aria-label="Previous club">‹</button><div id="club"><b id="clubName">Driver</b><small id="clubCarry">250 yd</small></div><button class="btn small" id="clubNext" aria-label="Next club">›</button><button class="btn" id="swing">SWING</button></div>
</div>
<div id="celebrate"></div>
<button id="cog" class="iconbtn" title="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94a7.6 7.6 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.61-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 00-.61.22L2.68 8.84a.5.5 0 00.12.64l2.03 1.58a7.6 7.6 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32a.5.5 0 00.61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 00.5.42h3.84a.5.5 0 00.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 00.61-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg></button>
<button id="mute" class="iconbtn" title="Mute"></button>
<button id="view" class="iconbtn" title="Overview"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3L3 5.5v15.5l6-2.5 6 2.5 6-2.5V3l-6 2.5L9 3zm0 2.2l6 2.5v11.1l-6-2.5V5.2z"/></svg></button>
<div id="settings">
  <div class="modal-card">
    <div class="app-title">Just Golf <span class="emoji">🏌️</span></div>
    <div class="modal-head"><h3>Settings</h3><button id="settingsClose" aria-label="Close">✕</button></div>
    <div class="sec"><div class="sec-label">Ball</div>
      <div class="picker"><button class="navbtn" data-grid="ballGrid" data-dir="-1" aria-label="Previous ball">‹</button><div id="ballGrid" class="grid scroll"></div><button class="navbtn" data-grid="ballGrid" data-dir="1" aria-label="Next ball">›</button></div>
    </div>
    <div class="sec"><div class="sec-label" id="sensLbl">Sensitivity</div>
      <div class="seg" role="radiogroup" aria-labelledby="sensLbl">
        <label><input type="radio" name="sens" value="1"><span>Low<small>100%</small></span></label>
        <label><input type="radio" name="sens" value="1.15"><span>Medium<small>115%</small></span></label>
        <label><input type="radio" name="sens" value="1.5"><span>High<small>150%</small></span></label>
      </div>
    </div>
    <div class="sec"><div class="sec-label" id="mspLbl">Swing meter speed</div>
      <div class="seg" role="radiogroup" aria-labelledby="mspLbl">
        <label><input type="radio" name="msp" value="0.8"><span>Slow</span></label>
        <label><input type="radio" name="msp" value="1"><span>Normal</span></label>
        <label><input type="radio" name="msp" value="1.3"><span>Fast</span></label>
      </div>
    </div>
    <button class="toggle" id="setGuide"></button>
    <button class="toggle" id="setDraw"></button>
    <button class="toggle" id="setOpt"></button>
    <button class="toggle" id="newGameBtn">New Game</button>
    <div class="stats"><div><b id="stBest">–</b>Best</div><div><b id="stGames">0</b>Rounds</div><div><b id="stAces">0</b>Birdies+</div><div><b id="stTix">0</b>Tickets</div></div>
  </div>
</div>
<div id="stage"></div>
<div id="pad"><canvas id="padCv"></canvas><button id="padClose" aria-label="Cancel">✕</button><div id="padMsg"></div></div>
<div id="ov" class="show">
  <h2>🏌️ JUST GOLF</h2>
  <p></p>
  <button id="startbtn">START</button>
</div>
<script src="lib/three.min.js"></script>
<script>
let _fatalShown=false;
function showFatal(err){
  try{ console.error(err); }catch(e){}
  if(_fatalShown) return; _fatalShown=true;
  try{ const ov=document.getElementById('ov'); if(ov){ ov.classList.add('show');
    const p=ov.querySelector('p'); if(p) p.textContent='⚠ '+((err&&(err.message||err))+'').slice(0,200); } }catch(e){}
}
window.addEventListener('error',e=>showFatal(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showFatal(e.reason));

let PERF=false, ANISO=4;
const NZ=(function(){
  let s=1337; const rnd=()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; };
  const P=new Uint16Array(512), V=new Float32Array(256), perm=[...Array(256).keys()];
  for(let i=255;i>0;i--){ const j=(rnd()*(i+1))|0; const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  for(let i=0;i<512;i++) P[i]=perm[i&255]; for(let i=0;i<256;i++) V[i]=rnd();
  function n2(x,y,px,py){
    let xi=Math.floor(x), yi=Math.floor(y); const xf=x-xi, yf=y-yi; let x1=xi+1, y1=yi+1;
    if(px){ xi=((xi%px)+px)%px; x1=((x1%px)+px)%px; } if(py){ yi=((yi%py)+py)%py; y1=((y1%py)+py)%py; }
    xi&=255; x1&=255; yi&=255; y1&=255;
    const a=V[P[P[xi]+yi]], b=V[P[P[x1]+yi]], c=V[P[P[xi]+y1]], d=V[P[P[x1]+y1]];
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  }
  function fbm(x,y,oct,px,py){ let sum=0,amp=0.5,norm=0,f=1;
    for(let i=0;i<oct;i++){ sum+=amp*n2(x*f,y*f,px?px*f:0,py?py*f:0); norm+=amp; amp*=0.5; f*=2; } return sum/norm; }
  return {n2,fbm,rnd};
})();
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function toTex(c,o){ o=o||{}; const t=new THREE.CanvasTexture(c);
  if(o.srgb!==false) t.encoding=THREE.sRGBEncoding;
  if(o.repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(o.repeat[0],o.repeat[1]); }
  if(o.offset) t.offset.set(o.offset[0],o.offset[1]);
  t.anisotropy=ANISO; return t; }
// run a per-pixel shader: fn(x,y) → [r,g,b,bump]; returns {color, bump} canvases
function shade(W,H,fn,withBump){
  const c=mkCanvas(W,H), g=c.getContext('2d'), img=g.createImageData(W,H), d=img.data;
  let bc=null,bd=null,bimg=null,bg=null;
  if(withBump){ bc=mkCanvas(W,H); bg=bc.getContext('2d'); bimg=bg.createImageData(W,H); bd=bimg.data; }
  const out=[0,0,0,128];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ fn(x,y,out); const i=(y*W+x)*4;
    d[i]=out[0]; d[i+1]=out[1]; d[i+2]=out[2]; d[i+3]=255;
    if(bd){ bd[i]=bd[i+1]=bd[i+2]=out[3]; bd[i+3]=255; } }
  g.putImageData(img,0,0); if(bg) bg.putImageData(bimg,0,0);
  return {color:c,bump:bc};
}
const mix=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
function oakTex(){
  const W=PERF?512:1024, H=PERF?256:512, LEAF=10.4;   // spans the whole 152"×104" side panel
  const leafTone=[]; for(let i=0;i<12;i++) leafTone.push(0.9+NZ.rnd()*0.18);
  return shade(W,H,(x,y,o)=>{
    const wz=x/W*152, wy=y/H*104, leaf=Math.floor(wy/LEAF), ly=wy-leaf*LEAF, lz=(leaf&1)?152-wz:wz;
    // streaky long grain: high frequency across the leaf, very low along it
    const streak=NZ.fbm(lz*0.018+leaf*11,ly*1.7,4);
    const fine=NZ.n2(lz*0.09+leaf*3,ly*6.5);
    // soft cathedral arches (growth rings cut at a shallow angle)
    const c=ly*0.55+4.5*NZ.fbm(lz*0.01+leaf*5,ly*0.12,3)-0.0016*(lz-70-leaf*13)*(lz-70-leaf*13);
    const f=c*0.9-Math.floor(c*0.9), arch=sstep(0.55,0.9,f)*(1-sstep(0.9,1,f));
    let t=clamp(0.25+streak*0.5+fine*0.18+arch*0.22,0,1);
    const k=leafTone[leaf%12];

// putting aids: a grid draped over the green (shows the lay of the land) and dots that drift downhill
function buildGreenAids(){

// trees: instanced trunks + canopies lining the hole and in clumps, kept off fairway, greens, tees and water

  for(let tries=0;TREES.length<want&&tries<6000;tries++){
    const [rpx,rpz,rdx,rdz]=routePoint(-40+rnd()*(H.len+90)), side=rnd()<0.5?-1:1, off=(H.dense?16:24)+rnd()*(H.ob+60), x=rpx-rdz*off*side, z=rpz+rdx*off*side, s=surfAt(x,z);

const _rel=V3(), _f=V3(), _n=V3(), _tmp=V3();

  const Cd=0.22+0.3*Math.min(S,0.3), Cl=clamp(1.05*S+0.06,0.06,0.33), q=0.5*RHO*BALL_A*sp*sp/BALL_M;

function trailFade(){ tween(1.6,u=>{ trail.material.opacity=0.75*(1-u); },()=>{ trail.geometry.setDrawRange(0,0); trail.material.opacity=0.75; flightPts=0; }); }

// expected carry for a club (no wind, centred strike) — used for club suggestions and the landing marker
const carryCache={};
function carryOf(ci,powMul){
  const key=ci+'/'+(powMul||1).toFixed(2); if(carryCache[key]!=null) return carryCache[key];
  const c=CLUBS[ci]; if(c.putter) return 0;
  const v=c.v*(powMul||1), la=c.la*DEG; let px=0,py=0,vz=v*Math.cos(la),vy=v*Math.sin(la),rpm=c.rpm,t=0;

const rollFrac=ci=>clamp(0.15-CLUBS[ci].rpm/75000,0.02,0.13);            // how much of a shot is roll-out, by club
const toPin=()=>Math.hypot(H.pin[0]-ball.p.x,H.pin[1]-ball.p.z);
function lieMul(){ const s=SURF[ball.lie]||SURF.fairway, c=CLUBS[clubIdx]; let p=s.pow; if(ball.lie==='sand'&&c.n==='S Wedge') p=0.88; if(c.n==='Driver'&&ball.lie!=='tee') p*=0.92; return p; }
function suggestClub(){
  if(ball.lie==='green'){ clubIdx=PUTTER; return; }
  const d=toPin(); let best=CLUBS.length-2;
  for(let i=0;i<PUTTER;i++){ if(CLUBS[i].tee&&ball.lie!=='tee') continue; if(carryOf(i,lieMul())<=d*(1.02-rollFrac(i))){ best=i; break; } }
  if(d<12&&(ball.lie==='fringe'||ball.lie==='fairway')) best=PUTTER;                  // close on the fringe/fairway: putt it

}
function aimAtPin(){ aim=Math.atan2(H.pin[0]-ball.p.x,H.pin[1]-ball.p.z); }
function aimDefault(){
  if(clubIdx===PUTTER){ aimAtPin(); return; }
  const reach=carryOf(clubIdx,lieMul())*(1+rollFrac(clubIdx)), R=routeInfo(ball.p.x,ball.p.z);
  if(toPin()<=reach*1.02){ aimAtPin(); return; }
  const [x,z]=routePoint(R.s+reach); aim=Math.atan2(x-ball.p.x,z-ball.p.z);

function newGame(){ anims=[]; scores=[]; holeIdx=0; startHole(); }
function startHole(){

  const [tx,tz]=H.tee; ball.p.set(tx,hAt(tx,tz)+BALL_R+0.03,tz); ball.v.set(0,0,0); ball.mode='rest'; ball.lie='tee'; ball.visible=true; ball.sink=0; ball.last=[tx,tz];
  const a=Math.random()*Math.PI*2, mph=Math.round(Math.random()*14); wind={x:Math.sin(a)*mph*0.447,z:Math.cos(a)*mph*0.447,mph,a};
  suggestClub(); aimDefault(); phase='intro'; camMode='intro'; introT=0;
  showMsg(`HOLE ${holeIdx+1} · ${H.name.toUpperCase()}<small>PAR ${H.par} · ${Math.round(H.len*YD)} YARDS</small>`,3);
  updateUI(); buildHUD(); drawMap(true);
}
function nextShot(){
  ball.mode='rest'; phase='aim'; camMode='aim'; suggestClub(); aimDefault(); updateUI(); buildHUD();
}
function strike(power,acc){                        // power 0..1, acc -1..1 (left = hook, right = slice)
  const c=CLUBS[clubIdx], lm=lieMul(), S2=SURF[ball.lie]||SURF.fairway;
  const v=c.v*power*lm*(1-Math.abs(acc)*0.15), la=(c.la+(ball.lie==='sand'?4:0)-(ball.lie==='tee'&&c.n!=='Driver'?0:0))*DEG;

  ball.spinAxis.applyAxisAngle(V3(Math.sin(dir),0,Math.cos(dir)),acc*0.55);                 // tilted axis → curve (right for a slice, left for a hook)

function putt(dirx,dirz,pow){
  const v=7.2*Math.pow(pow,1.4)*settings.power; ball.last=[ball.p.x,ball.p.z]; ball.v.set(dirx*v,0,dirz*v); ball.mode='roll'; ball.t=0;

}
function ballStopped(){
  if(ball.mode==='rest') return; ball.mode='rest';
  if(ball.lie==='ob'){ penalty('ob'); return; }
  const yds=Math.round(Math.hypot(ball.p.x-ball.last[0],ball.p.z-ball.last[1])*YD);
  if(yds>3) showMsg(`${yds} yards<small>${SURF[ball.lie].label.toUpperCase()}</small>`,1.6);
  tween(0.01,()=>{},()=>{ if(strokes>=10){ endHole(10); return; } nextShot(); },yds>3?1.4:0.5);
}
function penalty(kind){
  ball.mode='rest'; phase='penalty'; strokes++; const P=ball.p;
  if(kind==='water'){ sfxSplash(); ball.visible=false;
    // drop: back along the line toward where it was hit, two clubs-lengths clear of the hazard
    let x=P.x, z=P.z; const dx=ball.last[0]-x, dz=ball.last[1]-z, l=Math.hypot(dx,dz)||1;
    for(let i=0;i<400&&(surfAt(x,z)==='water'||surfAt(x,z)==='sand');i++){ x+=dx/l*0.5; z+=dz/l*0.5; } x+=dx/l*2; z+=dz/l*2;
    showMsg('Splash!<small>1-STROKE PENALTY · DROP</small>',1.8);
    tween(0.01,()=>{},()=>{ ball.p.set(x,hAt(x,z)+BALL_R,z); ball.lie=surfAt(x,z); ball.visible=true; nextShot(); },1.8); }
  else { showMsg('Out of bounds<small>STROKE AND DISTANCE</small>',1.8);
    tween(0.01,()=>{},()=>{ const [x,z]=ball.last; ball.p.set(x,hAt(x,z)+BALL_R,z); ball.lie=surfAt(x,z); nextShot(); },1.8); }
}
function holed(){
  ball.mode='rest'; phase='sunk'; sfxCup(); const fx=ball.p.x, fz=ball.p.z;
  tween(0.3,u=>{ ball.p.x=fx+(H.pin[0]-fx)*u; ball.p.z=fz+(H.pin[1]-fz)*u; ball.sink=u*0.06; },()=>{ ball.visible=false; endHole(strokes); });
}
function endHole(sc){
  phase='sunk'; scores.push(sc); const rel=sc-H.par;
  const term=sc===1?'HOLE IN ONE!':rel<=-3?'ALBATROSS!':rel===-2?'EAGLE!':rel===-1?'BIRDIE!':rel===0?'PAR':rel===1?'BOGEY':rel===2?'DOUBLE BOGEY':'+'+rel;
  if(rel<0){ celebrate(term,rel<=-2?'pink':'gold'); sfxChime('great'); stats.aces++; saveStats(); } else if(rel===0){ celebrate(term,'green'); sfxChime('par'); } else { showMsg(term,1.6); sfxChime('over'); }
  buildHUD(); tween(0.01,()=>{},()=>{ holeIdx++; if(holeIdx>=HOLES.length) roundOver(); else startHole(); },2.4);
}
function roundOver(){
  phase='over'; const s=scores.reduce((a,b)=>a+b,0), par=HOLES.reduce((a,h)=>a+h.par,0), rel=s-par, newBest=!stats.best||s<stats.best;
  const tix=Math.max(1,(par+2-s)*4+2); stats.games++; stats.tickets+=tix; if(newBest) stats.best=s; saveStats(); buildHUD();
  const ov=document.getElementById('ov'); ov.querySelector('h2').textContent=`🏌️ ${s} (${rel===0?'E':rel>0?'+'+rel:rel})`;
  ov.querySelector('p').innerHTML=`<table><tr><th>Hole</th>${HOLES.map((h,i)=>`<th>${i+1}</th>`).join('')}<th>Tot</th></tr><tr><th>Par</th>${HOLES.map(h=>`<td>${h.par}</td>`).join('')}<td>${par}</td></tr><tr><th>You</th>${scores.map(v=>`<td>${v}</td>`).join('')}<td><b>${s}</b></td></tr></table><br>`
    +(newBest?'<b>New best!</b><br>':'')+`You won <b>${tix}</b> ticket${tix===1?'':'s'} 🎟️ &nbsp;·&nbsp; Best ${stats.best}`;
  document.getElementById('startbtn').textContent='PLAY AGAIN'; ov.classList.add('show'); refreshStats();
}
function celebrate(text,cls){ const el=document.getElementById('celebrate'); el.className=''; void el.offsetWidth; el.textContent=text; el.classList.add('show',cls); }
function showMsg(html,t){ document.getElementById('msg').innerHTML=html; msgT=t||1.4; }
function buildHUD(){
  let h=''; HOLES.forEach((hh,i)=>{ const v=scores[i], cur=i===holeIdx&&phase!=='over'&&phase!=='menu', shown=v!=null?v:(cur&&strokes?strokes:'');
    const cls=v==null?'':v<hh.par?' under':v>hh.par?' over':''; h+=`<div class="fr${cur?' cur':''}"><div class="fh">${i+1}<small>P${hh.par}</small></div><div class="tot${cls}">${shown}</div></div>`; });
  const s=scores.reduce((a,b)=>a+b,0), p=HOLES.slice(0,scores.length).reduce((a,x)=>a+x.par,0), r=s-p;
  h+=`<div class="fr ftot"><div class="fh">TOTAL</div><div class="tot">${scores.length?s+' <small style="font-size:.6em;color:#bba">'+(r===0?'E':r>0?'+'+r:r)+'</small>':'–'}</div></div><div class="fr fbest"><div class="fh">BEST</div><div class="tot">${stats.best||'–'}</div></div>`;
  document.getElementById('board').innerHTML=h;
}
const ARROWS=['↑','↗','→','↘','↓','↙','←','↖'];
function updateUI(){
  document.getElementById('iStroke').textContent=strokes+1;
  const d=toPin(); document.getElementById('iDist').textContent=ball.lie==='green'||d<20?Math.round(d*3.281)+' ft':Math.round(d*YD)+' yd';
  document.getElementById('iLie').textContent=(SURF[ball.lie]||SURF.fairway).label;
  // wind arrow relative to the way you're aiming
  const rel=Math.atan2(wind.x,wind.z)-aim; document.getElementById('iWind').textContent=wind.mph?ARROWS[((Math.round(rel/(Math.PI/4))%8)+8)%8]+' '+wind.mph+' mph':'calm';
  const c=CLUBS[clubIdx]; document.getElementById('clubName').textContent=c.n;
  document.getElementById('clubCarry').textContent=c.putter?'pull back to putt':Math.round(carryOf(clubIdx,lieMul())*YD)+' yd carry';
  const putting=c.putter; document.getElementById('meter').style.visibility=putting||settings.drawSwing?'hidden':'visible';
  if(!putting&&phase==='aim'){ const p=powerFor(clubIdx,toPin()*(0.99-rollFrac(clubIdx))), pw=document.getElementById('mpow'); pw.style.left=((IMPACT+(1-IMPACT)*p)*100)+'%'; pw.style.display=p<0.97?'block':'none'; pw.style.background='rgba(255,213,74,.9)'; } document.getElementById('swing').style.display=putting?'none':'';
  let ht=''; if(phase==='aim'){ if(putting) ht='Pull back anywhere and release to putt'; else { const p=powerFor(clubIdx,toPin()*(0.99-rollFrac(clubIdx))); ht=settings.drawSwing?(p<0.97?`Pin needs about ${Math.round(p*100)}% power · tap SWING and draw`:'Drag sideways to aim · tap SWING: back from ADDRESS, then through to FINISH'):(p<0.97?`Pin needs about ${Math.round(p*100)}% power · tap SWING`:'Drag sideways to aim · tap SWING to start the meter'); } }
  hint(ht);
}
function powerFor(ci,d){ let lo=0.2, hi=1; if(carryOf(ci,lieMul())<d) return 1; for(let i=0;i<14;i++){ const m=(lo+hi)/2; if(carryOf(ci,lieMul()*m)<d) lo=m; else hi=m; } return (lo+hi)/2; }
function hint(t){ document.getElementById('hint').textContent=t; }

// ── 3-click swing meter: start, set power, then stop it on the impact zone for accuracy ──
let meter={state:'idle',x:0,power:0};
const IMPACT=0.12;
function swingClick(){
  if(settings.drawSwing&&phase==='aim'&&clubIdx!==PUTTER){ getAC(); initSfx(); startAmbient(); openPad(); return; }
  if(phase!=='aim'&&meter.state==='idle') return; getAC(); initSfx(); startAmbient();
  if(meter.state==='idle'){ if(phase!=='aim') return; meter={state:'up',x:IMPACT,power:0}; phase='swing'; }
  else if(meter.state==='up'){ meter.power=clamp((meter.x-IMPACT)/(1-IMPACT),0.05,1); meter.state='down'; const pw=document.getElementById('mpow'); pw.style.left=(meter.x*100)+'%'; pw.style.display='block'; pw.style.background='#fff'; }
  else if(meter.state==='down'){ finishSwing(-(meter.x-IMPACT)/0.12); }      // early = hook (−), late = slice (+)
}
function finishSwing(accRaw){ const acc=clamp(accRaw,-1,1); meter.state='idle'; document.getElementById('mfill').style.width='0'; strike(meter.power,acc); }
function updateMeter(dt){
  if(meter.state==='idle') return; const sp=1.05*settings.meter;
  if(meter.state==='up'){ meter.x+=sp*dt; if(meter.x>=1){ meter.x=1; meter.power=1; meter.state='down'; } }
  else if(meter.state==='down'){ meter.x-=sp*1.15*dt; if(meter.x<=IMPACT-0.12){ finishSwing(1); return; } }          // never stopped it: a big slice
  document.getElementById('mmark').style.left=(meter.x*100)+'%';
  const f=document.getElementById('mfill'); f.style.left=(IMPACT*100)+'%'; f.style.width=Math.max(0,(meter.state==='up'?meter.x:meter.power*(1-IMPACT)+IMPACT)-IMPACT)*100+'%';
}

// ── experimental: draw to swing, like a real swing. Start at ADDRESS (centre), draw down for the backswing,
//    then sweep up through impact to FINISH. Backswing length caps the power, downswing speed sets it,
//    where you cross impact pushes/pulls and the bend of the downswing draws/fades. ──
const pad={cv:null,pts:[],on:false,turn:-1};
function padGeom(){ const r=pad.cv.getBoundingClientRect(), W=r.width, Hh=r.height;
  return {r,W,Hh,cx:W/2,cy:Hh*0.5,rad:Math.min(W*0.19,40),backY:Hh*0.92,finY:Hh*0.17}; }
function openPad(){ phase='pad'; document.getElementById('pad').classList.add('open'); pad.pts=[]; pad.on=false; pad.turn=-1; padMsg('Touch ADDRESS'); sizePad(); drawPad(); }
function closePad(){ document.getElementById('pad').classList.remove('open'); if(phase==='pad') phase='aim'; }
function padMsg(t){ document.getElementById('padMsg').textContent=t; }
function sizePad(){ const r=pad.cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1); pad.cv.width=r.width*dpr; pad.cv.height=r.height*dpr; pad.cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0); }
function drawPad(){
  const g=pad.cv.getContext('2d'), Q=padGeom(); g.clearRect(0,0,Q.W,Q.Hh);
  const bg=g.createLinearGradient(0,Q.cy,0,Q.Hh); bg.addColorStop(0,'rgba(80,160,255,0)'); bg.addColorStop(1,'rgba(80,160,255,.28)'); g.fillStyle=bg; g.fillRect(0,Q.cy,Q.W,Q.Hh-Q.cy);   // backswing zone
  g.fillStyle='rgba(255,213,74,.16)'; g.fillRect(0,0,Q.W,Q.finY);                                                                                                   // finish zone
  g.strokeStyle='rgba(255,213,74,.7)'; g.setLineDash([5,6]); g.lineWidth=2; g.beginPath(); g.moveTo(10,Q.finY); g.lineTo(Q.W-10,Q.finY); g.stroke();
  g.strokeStyle='rgba(255,255,255,.35)'; g.beginPath(); g.moveTo(10,Q.cy); g.lineTo(Q.W-10,Q.cy); g.stroke(); g.setLineDash([]);                                     // impact line
  g.font='800 12px "Segoe UI",Arial'; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#ffd54a'; g.fillText('FINISH',Q.cx,Q.finY*0.5); g.fillStyle='#8fc4ff'; g.fillText('BACKSWING',Q.cx,Q.Hh-18);
  g.fillStyle='rgba(93,255,154,.2)'; g.strokeStyle='#5dff9a'; g.lineWidth=3; g.beginPath(); g.arc(Q.cx,Q.cy,Q.rad,0,7); g.fill(); g.stroke();
  g.fillStyle='#5dff9a'; g.fillText('ADDRESS',Q.cx,Q.cy);
  const P=pad.pts; if(P.length>1){ g.lineCap='round'; g.lineJoin='round';
    const seg=(a,b,col)=>{ if(b-a<1) return; g.strokeStyle='rgba(0,0,0,.5)'; g.lineWidth=9; g.beginPath(); for(let i=a;i<=b;i++) i===a?g.moveTo(P[i].x,P[i].y):g.lineTo(P[i].x,P[i].y); g.stroke();
      g.strokeStyle=col; g.lineWidth=5; g.beginPath(); for(let i=a;i<=b;i++) i===a?g.moveTo(P[i].x,P[i].y):g.lineTo(P[i].x,P[i].y); g.stroke(); };
    const t=pad.turn<0?P.length-1:pad.turn; seg(0,t,'#8fc4ff'); if(pad.turn>=0) seg(pad.turn,P.length-1,'#ffffff');
    const back=clamp((P[t].y-Q.cy)/(Q.backY-Q.cy),0,1); g.fillStyle='rgba(143,196,255,.9)'; g.fillRect(Q.W-10,Q.cy,5,(Q.Hh-Q.cy)*back); }                          // backswing length bar
}
function padPt(e){ const Q=padGeom(); return {x:e.clientX-Q.r.left,y:e.clientY-Q.r.top,t:performance.now()}; }
function padDown(e){ e.preventDefault(); e.stopPropagation(); const Q=padGeom(), p=padPt(e);
  if(Math.hypot(p.x-Q.cx,p.y-Q.cy)>Q.rad*1.2){ padMsg('Start on ADDRESS'); return; }
  try{ pad.cv.setPointerCapture(e.pointerId); }catch(_){} pad.on=true; pad.pts=[p]; pad.turn=-1; padMsg('Swing back (down)…'); drawPad(); }
function padMove(e){
  if(!pad.on) return; e.preventDefault(); const p=padPt(e), P=pad.pts; P.push(p);
  if(pad.turn<0){ let lo=0; for(let i=1;i<P.length;i++) if(P[i].y>P[lo].y) lo=i;                       // lowest point so far = top of the backswing
    if(P[lo].y-p.y>12&&P[lo].y>padGeom().cy+14){ pad.turn=lo; padMsg('…and through!'); } }
  drawPad();
}
function padUp(e){
  if(!pad.on) return; e.preventDefault(); pad.on=false; const Q=padGeom(), P=pad.pts, end=P[P.length-1], retry=t=>{ padMsg(t); pad.pts=[]; pad.turn=-1; drawPad(); };
  if(pad.turn<0) return retry('Swing back first, then through');
  if(end.y>Q.finY) return retry('Follow through into FINISH');
  const T=P[pad.turn], back=clamp((T.y-Q.cy)/(Q.backY-Q.cy),0,1);
  if(back<0.12) return retry('Take a bigger backswing');
  // downswing speed from the top of the backswing to the finish line
  let k=pad.turn; while(k<P.length-1&&P[k].y>Q.finY) k++;
  let len=0; for(let i=pad.turn+1;i<=k;i++) len+=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);
  const dt=Math.max(0.04,(P[k].t-T.t)/1000), speed=len/Q.Hh/dt;
  const power=clamp(Math.min(speed/3.6,0.3+0.75*back),0.08,1);
  // where the club crosses impact (vs. address) and how the downswing bends
  let ix=Q.cx; for(let i=pad.turn+1;i<=k;i++) if(P[i-1].y>=Q.cy&&P[i].y<Q.cy){ const u=(P[i-1].y-Q.cy)/(P[i-1].y-P[i].y||1); ix=mix(P[i-1].x,P[i].x,u); break; }
  const ax=T.x, ay=T.y, dx=P[k].x-ax, dy=P[k].y-ay, L=Math.hypot(dx,dy)||1; let bow=0, n=0;
  for(let i=pad.turn;i<=k;i++){ bow+=-((P[i].x-ax)*dy-(P[i].y-ay)*dx)/L; n++; } bow/=Math.max(1,n)*Q.W;
  const acc=clamp(bow*3.6+(ix-Q.cx)/Q.W*2.2,-1,1);
  const shape=Math.abs(acc)<0.06?'straight':acc<0?(acc<-0.35?'hook':'draw'):(acc>0.35?'slice':'fade');
  padMsg(`Power ${Math.round(power*100)}% · ${shape}`);
  setTimeout(()=>{ closePad(); strike(power,acc); },260);
}

// ═══════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════
let camMode='intro', introT=0, viewOn=false;
const camPos=V3(0,40,-40), camLook=V3(0,0,0), _tp=V3(), _tl=V3();
function updateCamera(dt){
  const P=ball.p, d=[Math.sin(aim),Math.cos(aim)];
  let k=1-Math.exp(-dt*3.5);
  if(camMode==='intro'){ const t=clamp(introT/3,0,1), e=smooth(t), [px,pz]=H.pin, mx=mix(px,P.x,e), mz=mix(pz,P.z,e);   // fly from the green back to the tee
    _tp.set(mx-d[0]*30,hAt(mx,mz)+mix(45,4,e),mz-d[1]*30); _tl.set(mix(px,P.x+d[0]*60,e),hAt(px,pz),mix(pz,P.z+d[1]*60,e)); k=1-Math.exp(-dt*5); }
  else if(viewOn&&(phase==='aim'||phase==='swing')){ const [px,pz]=H.pin, mx=(px+P.x)/2, mz=(pz+P.z)/2, dist=Math.hypot(px-P.x,pz-P.z);
    _tp.set(mx-d[0]*dist*0.35,hAt(mx,mz)+Math.max(30,dist*0.75),mz-d[1]*dist*0.35); _tl.set(mx,hAt(mx,mz),mz); }
  else if(camMode==='flight'&&ball.mode==='fly'){ const vh=Math.hypot(ball.v.x,ball.v.z)||1, ux=ball.v.x/vh, uz=ball.v.z/vh;
    _tp.set(P.x-ux*14,Math.max(P.y+4,hAt(P.x-ux*14,P.z-uz*14)+3),P.z-uz*14); _tl.set(P.x+ux*6,P.y-1,P.z+uz*6); k=1-Math.exp(-dt*2.2); }
  else if(ball.mode==='roll'||phase==='sunk'){ const putting=camMode==='putt';
    _tp.set(P.x-d[0]*(putting?3.2:10),hAt(P.x,P.z)+(putting?1.4:4),P.z-d[1]*(putting?3.2:10)); _tl.set(P.x,P.y,P.z); k=1-Math.exp(-dt*(putting?3:2)); }
  else { const putting=clubIdx===PUTTER, back=putting?2.6:7, up=putting?1.15:3.4, ahead=putting?3:70;
    _tp.set(P.x-d[0]*back,hAt(P.x-d[0]*back,P.z-d[1]*back)+up,P.z-d[1]*back); _tl.set(P.x+d[0]*ahead,hAt(P.x+d[0]*ahead,P.z+d[1]*ahead)+(putting?0:2.5),P.z+d[1]*ahead); }
  camPos.lerp(_tp,k); camLook.lerp(_tl,k);
  const gy=hAt(camPos.x,camPos.z)+0.4; if(camPos.y<gy) camPos.y=gy;
  camera.position.copy(camPos); camera.lookAt(camLook);
  L.sun.position.set(P.x+60,P.y+120,P.z-70); L.sun.target.position.copy(P);                    // shadows follow the action
}

// ═══════════════════════════════════════════════════════
//  INPUT — drag to aim; on the green, pull back & release to putt
// ═══════════════════════════════════════════════════════
let dragging=false, dragX=0, aimPx=null, aimStart=null, aimDir=new THREE.Vector2(0,1), puttPow=0;
const _hit=V3(), groundPlane=new THREE.Plane(V3(0,1,0),0);
function planePt(e){
  const r=renderer.domElement.getBoundingClientRect(); groundPlane.constant=-ball.p.y;
  raycaster.setFromCamera({x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1},camera);
  return raycaster.ray.intersectPlane(groundPlane,_hit)?[_hit.x,_hit.z]:null;
}
function pdown(e){
  if(phase==='intro'){ phase='aim'; camMode='aim'; updateUI(); return; }
  if(phase==='swing'){ swingClick(); return; }                                    // the meter can be tapped anywhere too
  if(phase!=='aim') return; e.preventDefault(); getAC(); initSfx(); startAmbient();
  try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(_){}
  dragging=true; dragX=e.clientX; aimPx=[e.clientX,e.clientY]; aimStart=planePt(e); puttPow=0;
}
function pmove(e){
  if(!dragging) return; e.preventDefault();
  if(clubIdx===PUTTER){ const p=planePt(e); if(!p||!aimStart) return; const dx=aimStart[0]-p[0], dz=aimStart[1]-p[1], l=Math.hypot(dx,dz);
    const r=renderer.domElement.getBoundingClientRect(); puttPow=clamp(Math.hypot(e.clientX-aimPx[0],e.clientY-aimPx[1])/(Math.min(r.width,r.height)*0.3),0,1); if(l>0.01){ aimDir.set(dx/l,dz/l); } return; }
  const dx=e.clientX-dragX; dragX=e.clientX; aim-=dx*0.0035*(viewOn?2:1); updateUI();
}
function pup(e){
  if(!dragging) return; dragging=false;
  if(clubIdx===PUTTER&&phase==='aim'&&puttPow>0.03){ aim=Math.atan2(aimDir.x,aimDir.y); putt(aimDir.x,aimDir.y,puttPow); }
  puttPow=0;
}
function bindInput(){ const el=renderer.domElement; el.addEventListener('pointerdown',pdown); el.addEventListener('pointermove',pmove); el.addEventListener('pointerup',pup); el.addEventListener('pointercancel',pup);
  document.getElementById('swing').addEventListener('click',e=>{ e.stopPropagation(); swingClick(); });
  pad.cv=document.getElementById('padCv'); pad.cv.addEventListener('pointerdown',padDown); pad.cv.addEventListener('pointermove',padMove); pad.cv.addEventListener('pointerup',padUp); pad.cv.addEventListener('pointercancel',padUp);
  document.getElementById('padClose').addEventListener('click',e=>{ e.stopPropagation(); closePad(); updateUI(); });
  window.addEventListener('resize',()=>{ if(document.getElementById('pad').classList.contains('open')){ sizePad(); drawPad(); } });
  document.getElementById('clubPrev').addEventListener('click',()=>{ if(phase!=='aim') return; clubIdx=(clubIdx+CLUBS.length-1)%CLUBS.length; aimDefault(); updateUI(); });
  document.getElementById('clubNext').addEventListener('click',()=>{ if(phase!=='aim') return; clubIdx=(clubIdx+1)%CLUBS.length; aimDefault(); updateUI(); });
  window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); swingClick(); } }); }

// aim aids: dotted line to the expected landing spot + a ring there; putting arrow length = power
function syncAim(){
  const show=settings.guide&&(phase==='aim'||phase==='swing'), putting=clubIdx===PUTTER, P=ball.p;
  landMark.visible=show&&!putting; aimLine.visible=show&&(!putting||puttPow>0.02);
  puttArrow.visible=putting&&phase==='aim'&&puttPow>0.02;
  if(puttArrow.visible){ const len=0.15+puttPow*2.4, ang=Math.atan2(aimDir.x,aimDir.y), y=hAt(P.x,P.z)+0.02;
    puttArrow.position.set(P.x+aimDir.x*0.05,y,P.z+aimDir.y*0.05); puttArrow.rotation.set(0,ang+Math.PI,0); puttArrow.scale.set(0.2,1,len); puttArrow.material.color.setHSL(0.33*(1-puttPow),1,0.55); }
  if(!aimLine.visible&&!landMark.visible) return;
  const dir=putting&&puttPow>0.02?[aimDir.x,aimDir.y]:[Math.sin(aim),Math.cos(aim)], pos=aimLine.geometry.attributes.position;
  const reach=putting?0.15+puttPow*2.4+3:carryOf(clubIdx,lieMul()), n=putting?40:200, s0=putting?0.15+puttPow*2.4:0;
  for(let i=0;i<n;i++){ const s=s0+(reach-s0)*i/n, x=P.x+dir[0]*s, z=P.z+dir[1]*s; pos.setXYZ(i,x,hAt(x,z)+0.03,z); } aimLine.geometry.setDrawRange(0,n); pos.needsUpdate=true;
  aimLine.material.size=putting?5:3;
  if(landMark.visible){ const x=P.x+dir[0]*reach, z=P.z+dir[1]*reach, sc=Math.max(2.5,reach*0.035); landMark.position.set(x,hAt(x,z)+0.05,z); landMark.scale.set(sc,sc,1); }
}

// ── hole map: surfaces painted once, ball / aim / pin drawn live ──
let mapBase=null;
function drawMap(rebuild){
  const cv=document.getElementById('map'), g=cv.getContext('2d'), W=cv.width, Hh=cv.height;
  let ax0=1e9,ax1=-1e9,az1=-1e9; for(const [x,z] of H.route){ ax0=Math.min(ax0,x); ax1=Math.max(ax1,x); az1=Math.max(az1,z); }
  let x0=ax0-H.ob*0.8, x1=ax1+H.ob*0.8, z0=-24, z1=az1+30; const asp=(z1-z0)/(x1-x0), want=Hh/W; if(asp<want){ const ex=((z1-z0)/want-(z1-z0))/2; z0-=ex*0.2; z1+=ex*1.8; } else { const ex=((z1-z0)/want-(x1-x0))/2; x0-=ex; x1+=ex; }
  const sx=W/(x1-x0), sz=Hh/(z1-z0), m=(x,z)=>[ (x1-x)*sx, Hh-(z-z0)*sz ];   // screen-left is world +x
  if(rebuild||!mapBase){ mapBase=mkCanvas(W,Hh); const b=mapBase.getContext('2d'), img=b.createImageData(W,Hh), d=img.data, c3=[0,0,0];
    for(let py=0;py<Hh;py++) for(let px=0;px<W;px++){ const x=x1-(px+0.5)/sx, z=z0+(Hh-py-0.5)/sz, s=surfAt(x,z), c=SURF_COL[s==='water'?'water':s], i=(py*W+px)*4;
      const k=s==='water'?[50,110,190]:c; d[i]=k[0]; d[i+1]=k[1]; d[i+2]=k[2]; d[i+3]=255; }
    b.putImageData(img,0,0); b.fillStyle='rgba(20,60,20,.85)'; for(const T of TREES){ const [px,py]=m(T.x,T.z); b.beginPath(); b.arc(px,py,Math.max(1.4,T.cr*sx*0.8),0,7); b.fill(); } }
  g.drawImage(mapBase,0,0);
  const [bx,by]=m(ball.p.x,ball.p.z), [px,py]=m(H.pin[0],H.pin[1]);
  if(phase==='aim'||phase==='swing'){ const reach=clubIdx===PUTTER?0:carryOf(clubIdx,lieMul()), [lx,ly]=m(ball.p.x+Math.sin(aim)*reach,ball.p.z+Math.cos(aim)*reach);
    g.strokeStyle='rgba(255,255,255,.85)'; g.setLineDash([3,3]); g.lineWidth=1.5; g.beginPath(); g.moveTo(bx,by); g.lineTo(lx,ly); g.stroke(); g.setLineDash([]); g.beginPath(); g.arc(lx,ly,3.5,0,7); g.stroke(); }
  g.strokeStyle='#fff'; g.lineWidth=1.5; g.beginPath(); g.moveTo(px,py); g.lineTo(px,py-12); g.stroke(); g.fillStyle='#ffd21a'; g.fillRect(px,py-12,7,5);
  g.fillStyle='#fff'; g.strokeStyle='#000'; g.lineWidth=1; g.beginPath(); g.arc(bx,by,3.2,0,7); g.fill(); g.stroke();
}

// ═══════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════
let lastT=0, mapT=0, birdT=6;
function syncBall(){
  const P=ball.p; ballMesh.position.set(P.x,P.y-ball.sink,P.z); ballMesh.visible=ball.visible;
  const dist=camera.position.distanceTo(P); ballMesh.scale.setScalar(Math.max(1,dist/14));      // keep the ball readable at range
  if(ball.mode==='roll'){ const sp=Math.hypot(ball.v.x,ball.v.z); if(sp>1e-4) ballMesh.rotateOnWorldAxis(_tmp.set(ball.v.z,0,-ball.v.x).normalize(),sp/BALL_R/60); }
  const gy=hAt(P.x,P.z); shadowDisc.position.set(P.x,gy+0.006,P.z); shadowDisc.scale.setScalar(Math.max(1,dist/14)); shadowDisc.visible=ball.visible&&P.y-gy<3;
}
function loop(t){
  try{
    const dt=Math.min((t-lastT)/1000,0.033); lastT=t; clock+=dt;
    if(renderer&&(lastW<2||lastH<2)) resize();
    if(H){
      const n=Math.max(1,Math.ceil(dt*480)); for(let k=0;k<n;k++) physStep(dt/n);
      updateMeter(dt); stepAnims(dt);
      if(phase==='intro'){ introT+=dt; if(introT>3.4){ phase='aim'; camMode='aim'; updateUI(); } }
      if(flagCloth){ const p=flagCloth.geometry.attributes.position, b=flagCloth.userData.base, ws=0.6+wind.mph/14; for(let i=0;i<p.count;i++){ const x=b[i*3]; p.setZ(i,Math.sin(clock*4*ws+x*9)*0.04*(x/0.5)*ws); } p.needsUpdate=true;
        pinMesh.rotation.y=Math.atan2(wind.x,wind.z)-Math.PI/2; pinMesh.visible=!(ball.lie==='green'&&toPin()<1.2&&ball.mode!=='rest'); }
      if(msgT>0){ msgT-=dt; if(msgT<=0) document.getElementById('msg').innerHTML=''; }
      if(M.water.map) M.water.map.offset.x+=dt*0.01;
      birdT-=dt; if(birdT<0){ birdT=5+Math.random()*12; birdChirp(); }
      if(renderer){ syncBall(); updateCamera(dt); syncAim(); if(greenGrid) stepGreenAids(dt); mapT-=dt; if(mapT<0){ mapT=0.1; drawMap(false); } }
    }
    if(renderer) renderer.render(scene,camera);
  }catch(err){ showFatal(err); }
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════
function saveSettings(){ try{ localStorage.setItem('justgolf',JSON.stringify(settings)); }catch(e){} }
function loadSettings(){ try{ Object.assign(settings,JSON.parse(localStorage.getItem('justgolf')||'{}')); }catch(e){} if(!BALL_TYPES.some(b=>b.id===settings.ball)) settings.ball='white'; }
function saveStats(){ try{ localStorage.setItem('justgolf_stats',JSON.stringify(stats)); }catch(e){} }
function loadStats(){ try{ Object.assign(stats,JSON.parse(localStorage.getItem('justgolf_stats')||'{}')); }catch(e){} }
function refreshStats(){ document.getElementById('stBest').textContent=stats.best||'–'; document.getElementById('stGames').textContent=stats.games; document.getElementById('stAces').textContent=stats.aces; document.getElementById('stTix').textContent=stats.tickets; }
function setupSettings(){
  loadSettings(); loadStats();
  const scrollToSel=(grid,sm)=>{ const sel=grid.querySelector('.tile.selected'); if(!sel) return; const cr=grid.getBoundingClientRect(), sr=sel.getBoundingClientRect(); grid.scrollTo({left:grid.scrollLeft+(sr.left-cr.left)-(grid.clientWidth-sel.offsetWidth)/2,behavior:sm?'smooth':'auto'}); };
  document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{ const tiles=[...document.getElementById(b.dataset.grid).querySelectorAll('.tile')]; let i=tiles.findIndex(t=>t.classList.contains('selected'));
    const ni=clamp((i<0?0:i)+(+b.dataset.dir),0,tiles.length-1); if(ni!==i){ tiles[ni].click(); requestAnimationFrame(()=>scrollToSel(document.getElementById(b.dataset.grid),true)); } }));
  const bg=document.getElementById('ballGrid');
  for(const b of BALL_TYPES){ const t=document.createElement('div'); t.className='tile'; t.dataset.key=b.id; t.innerHTML=`<img class="ball3d" alt="" src="${ballThumb(b.id)}"><div class="label">${b.label}</div>`;
    t.addEventListener('click',()=>{ applyBall(b.id); highlightBall(); }); bg.appendChild(t); }
  const highlightBall=()=>document.querySelectorAll('#ballGrid .tile').forEach(t=>t.classList.toggle('selected',t.dataset.key===settings.ball)); highlightBall();
  _muted=!!settings.muted; const muteBtn=document.getElementById('mute'), viewBtn=document.getElementById('view');
  muteBtn.innerHTML=muteIcon(_muted); muteBtn.title=_muted?'Unmute':'Mute'; muteBtn.addEventListener('click',()=>{ getAC(); applyMute(!_muted); if(ambient) ambient.g.gain.value=_muted?0:0.045; });
  viewBtn.addEventListener('click',()=>{ viewOn=!viewOn; viewBtn.classList.toggle('on',viewOn); });
  const placeCtrls=()=>{ const hud=document.getElementById('hud'), top=(hud?hud.offsetHeight:0)+10; document.getElementById('cog').style.top=top+'px'; muteBtn.style.top=top+'px'; viewBtn.style.top=(top+muteBtn.offsetHeight+14)+'px';
    document.getElementById('info').style.top=(top+document.getElementById('cog').offsetHeight+16)+'px'; document.getElementById('map').style.top=(top+muteBtn.offsetHeight*2+34)+'px'; };
  placeCtrls(); requestAnimationFrame(placeCtrls); window.addEventListener('resize',placeCtrls); window.addEventListener('orientationchange',()=>setTimeout(placeCtrls,120));
  const modal=document.getElementById('settings');
  document.getElementById('cog').addEventListener('click',()=>{ refreshStats(); modal.classList.add('open'); requestAnimationFrame(()=>scrollToSel(bg,false)); });
  document.getElementById('settingsClose').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('open'); });
  const guideBtn=document.getElementById('setGuide'), optBtn=document.getElementById('setOpt'), drawBtn=document.getElementById('setDraw');
  const refresh=()=>{ guideBtn.classList.toggle('on',settings.guide); guideBtn.textContent='Aim guide & landing ring: '+(settings.guide?'On':'Off'); optBtn.classList.toggle('on',settings.optimized); optBtn.textContent='Low graphics: '+(settings.optimized?'On':'Off'); drawBtn.classList.toggle('on',settings.drawSwing); drawBtn.textContent='Draw-to-swing (experimental): '+(settings.drawSwing?'On':'Off'); };
  refresh();
  guideBtn.addEventListener('click',()=>{ settings.guide=!settings.guide; saveSettings(); refresh(); });
  drawBtn.addEventListener('click',()=>{ settings.drawSwing=!settings.drawSwing; saveSettings(); refresh(); if(H) updateUI(); });
  optBtn.addEventListener('click',()=>{ settings.optimized=!settings.optimized; saveSettings(); try{ sessionStorage.setItem('lowgfxReload','1'); }catch(e){} location.reload(); });
  const pick=(name,key)=>{ const rs=[...document.querySelectorAll(`input[name="${name}"]`)], vals=rs.map(r=>+r.value); settings[key]=vals.reduce((a,b)=>Math.abs(b-settings[key])<Math.abs(a-settings[key])?b:a,vals[0]);
    rs.forEach(r=>{ r.checked=(+r.value===settings[key]); r.addEventListener('change',()=>{ if(r.checked){ settings[key]=+r.value; saveSettings(); } }); }); };
  pick('sens','power'); pick('msp','meter');
  document.getElementById('sensLbl').textContent='Putting sensitivity';
  document.getElementById('newGameBtn').addEventListener('click',()=>{ getAC(); initSfx(); modal.classList.remove('open'); document.getElementById('ov').classList.remove('show'); newGame(); });
}
document.getElementById('startbtn').addEventListener('click',()=>{ document.getElementById('ov').classList.remove('show'); getAC(); initSfx(); startAmbient(); resize(); newGame(); });
function boot(){
  setupSettings();
  document.querySelector('#ov p').innerHTML='<b>Drag sideways to aim</b>, then tap <b>SWING</b> three times: once to start, once to set power, and once on the white zone for a straight shot (early hooks, late slices). Pick clubs with ‹ ›; the ring shows where a full shot lands.<br>On the green, <b>pull back &amp; release</b> to putt. Watch the wind, the water and the bunkers.';
  initScene(); bindInput();
  H=HOLES[0]; buildHole(); ball.p.set(H.tee[0],hAt(H.tee[0],H.tee[1])+BALL_R,H.tee[1]); aimAtPin(); phase='menu'; camMode='aim';
  try{ if(sessionStorage.getItem('lowgfxReload')){ sessionStorage.removeItem('lowgfxReload'); document.getElementById('ov').classList.remove('show'); newGame(); document.getElementById('settings').classList.add('open'); } }catch(e){}
  buildHUD(); drawMap(true);
  requestAnimationFrame(t=>{ lastT=t; loop(t); });
}
try{ boot(); }catch(err){ showFatal(err); }
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
