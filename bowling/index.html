<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Just Bowl</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100dvw;height:100dvh;background:#070a10;font-family:'Segoe UI',Arial,sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;}
#hud{width:100%;flex-shrink:0;background:rgba(0,0,0,.6);padding:4px 6px;overflow-x:auto;z-index:6;}
#board{display:flex;gap:2px;min-width:min-content;justify-content:center;}
.fr{border:1px solid #2b3550;border-radius:3px;min-width:38px;background:#111826;}
.fr .fh{font-size:.6rem;text-align:center;color:#7d8db0;border-bottom:1px solid #2b3550;padding:1px 0;}
.fr .rw{display:flex;height:16px;}
.fr .rb{flex:1;font-size:.72rem;text-align:center;line-height:16px;border-left:1px solid #2b3550;color:#ffd54a;}
.fr .rb:first-child{border-left:none;}
.fr.f10{min-width:52px;}
.fr .tot{text-align:center;font-size:.82rem;font-weight:700;line-height:18px;color:#fff;}
.fr.cur{border-color:#ffd54a;box-shadow:0 0 8px rgba(255,213,74,.4);}
@media (max-width:520px){    /* shrink the scoreboard so all 10 frames (incl. the 10th's 3rd box) fit */
  #hud{padding:4px 3px;} #board{gap:1px;}
  .fr{min-width:28px;} .fr.f10{min-width:40px;}
  .fr .fh{font-size:.5rem;} .fr .rw{height:14px;} .fr .rb{font-size:.62rem;line-height:14px;} .fr .tot{font-size:.7rem;line-height:16px;}
}
#msg{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:clamp(1.6rem,6vw,2.6rem);font-weight:800;color:#ffd54a;
  text-shadow:0 2px 14px #000;pointer-events:none;letter-spacing:1px;z-index:5;}
#celebrate{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:15;pointer-events:none;opacity:0;
  font-weight:900;letter-spacing:5px;font-size:clamp(2.6rem,13vw,6.5rem);}
#celebrate.show{animation:celebpop 1.8s cubic-bezier(.2,.8,.3,1) forwards;}
#celebrate.strike{color:#ffd54a;text-shadow:0 0 34px rgba(255,170,0,.85),0 5px 0 #9a5600;}
#celebrate.spare{color:#66d9ff;text-shadow:0 0 34px rgba(60,160,255,.85),0 5px 0 #06507a;}
@keyframes celebpop{
  0%{opacity:0;transform:scale(.3) rotate(-9deg);}
  14%{opacity:1;transform:scale(1.18) rotate(3deg);}
  28%{transform:scale(1) rotate(0);}
  72%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(1.12);}
}
#stage{flex:1;width:100%;position:relative;cursor:grab;min-height:0;overflow:hidden;}
#stage.throwing{cursor:grabbing;}
#stage canvas{display:block;width:100%;height:100%;}
#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, rgba(4,7,14,.25) 0%, rgba(4,7,14,.6) 100%);gap:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;padding:20px;}
#ov.show{opacity:1;pointer-events:auto;}
#ov h2{font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:2px;color:#ffd54a;text-shadow:0 0 20px rgba(255,170,0,.5);}
#ov p{color:#cfd8ea;font-size:clamp(.82rem,2.4vw,1rem);line-height:1.6;max-width:390px;}
#startbtn{margin-top:6px;padding:11px 34px;background:#ffd54a;color:#181000;border:none;border-radius:8px;
  font-size:clamp(.95rem,2.6vw,1.15rem);font-weight:800;cursor:pointer;letter-spacing:1px;}
#startbtn:hover{background:#ffe27a;}
a.back{color:#67769c;font-size:.8rem;text-decoration:none;margin-top:8px;}
a.back:hover{color:#9fb0d8;}
#cog{position:fixed;left:12px;top:6vh;z-index:25;border:none;background:none;color:#cfd8ea;
  display:flex;align-items:center;justify-content:center;height:1em;font-size:4em;line-height:1;padding:0;
  opacity:0.9;cursor:pointer;transition:transform .15s,opacity .15s;}
#cog:hover{opacity:1;transform:rotate(45deg);}
#mute{position:fixed;right:12px;top:6vh;z-index:25;border:none;background:none;color:#cfd8ea;
  display:flex;align-items:center;justify-content:center;height:1em;font-size:4em;line-height:1;padding:0;
  opacity:0.9;cursor:pointer;transition:opacity .15s;}
#mute:hover{opacity:1;}
#mute svg,#cog svg{width:0.8em;height:0.8em;display:block;}
#settings{position:fixed;inset:0;z-index:26;display:none;align-items:center;justify-content:center;
  background:rgba(2,4,8,.62);}
#settings.open{display:flex;}
.modal-card{width:min(94vw,480px);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:16px;
  background:rgba(14,18,28,.98);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);}
.modal-head{display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{color:#ffd54a;font-size:1.2rem;letter-spacing:1px;}
#settingsClose{background:none;border:none;color:#9fb0d8;font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer;}
#settingsClose:hover{color:#fff;}
.sec-label{color:#9fb0d8;font-size:.8rem;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
.grid{display:flex;flex-wrap:nowrap;gap:9px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.tile{flex:0 0 62px;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:6px 4px;text-align:center;
  background:rgba(255,255,255,.05);transition:background .12s,border-color .12s;}
.grid.mural .tile{flex:0 0 120px;}
.tile:hover{background:rgba(255,255,255,.11);}
.tile.selected{border-color:#ffd54a;background:rgba(255,213,74,.14);}
.tile .thumb{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;display:block;background:#0c0f16;}
.tile .thumb.sphere{position:relative;background-size:cover;background-position:center;overflow:hidden;}
.tile .thumb.sphere::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 33% 27%, rgba(255,255,255,.6), rgba(255,255,255,0) 42%);
  box-shadow:inset -7px -9px 16px rgba(0,0,0,.6), inset 5px 5px 10px rgba(255,255,255,.12);}
.tile.glowtile .thumb{box-shadow:0 0 10px #1dff5a;}
.tile.mtile .thumb{aspect-ratio:16/6;border-radius:6px;}
.tile .label{font-size:.68rem;color:#cfd8ea;margin-top:5px;}
.toggle{width:100%;padding:11px;border:1px solid #33405a;border-radius:9px;background:#1a2130;color:#cfd8ea;
  font-size:.9rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .12s;}
.toggle:hover{border-color:#5a6a90;}
.toggle.on{background:#ffd54a;color:#181000;border-color:#ffd54a;}
#settings label{color:#cfd8ea;font-size:.82rem;display:flex;flex-direction:column;gap:4px;}
#settings label.chk{flex-direction:row;align-items:center;gap:8px;cursor:pointer;}
#settings select{background:#1a2130;color:#fff;border:1px solid #33405a;border-radius:6px;padding:5px 6px;font-size:.82rem;}
#settings input[type=checkbox]{width:16px;height:16px;accent-color:#ffd54a;cursor:pointer;}
</style>
</head>
<body>
<div id="hud"><div id="board"></div></div>
<div id="msg"></div>
<div id="celebrate"></div>

<button id="cog" title="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94a7.6 7.6 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.61-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 00-.61.22L2.68 8.84a.5.5 0 00.12.64l2.03 1.58a7.6 7.6 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32a.5.5 0 00.61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 00.5.42h3.84a.5.5 0 00.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 00.61-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg></button>
<button id="mute" title="Mute"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<div id="settings">
  <div class="modal-card">
    <div class="modal-head"><h3>Settings</h3><button id="settingsClose" aria-label="Close">✕</button></div>
    <div class="sec"><div class="sec-label">Ball</div><div id="ballGrid" class="grid"></div></div>
    <div class="sec"><div class="sec-label">Theme</div><div id="muralGrid" class="grid mural"></div></div>
    <button class="toggle" id="setBumpers"></button>
    <button class="toggle" id="setOpt"></button>
    <button class="toggle" id="newGameBtn">New Game</button>
  </div>
</div>
<div id="stage"></div>

<div id="ov" class="show">
  <h2>🎳 JUST BOWL</h2>
  <p></p>
  <button id="startbtn">START</button>
</div>

<script src="lib/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  REGULATION DIMENSIONS (inches) — courtdimensions.net / USBC
// ═══════════════════════════════════════════════════════
const LANE_LEN=760;              // foul line → past pin deck (head pin at 720" = 60 ft)
const PLAY=20.75, GUT=30.0;      // playable half-width (41.5" lane) / gutter outer
const BALL_R=4.25, PIN_R=2.383;  // ball Ø8.5" ; pin waist Ø4.766"
const PIN_H=15.0;
const COLGAP=12.0, ROWGAP=10.392, PIN_BASE=720;   // 12" centers; rows 12·sin60° deep; head pin 60 ft
const LANE_PITCH=2*GUT+16;                         // center-to-center spacing to neighbor lanes
const NEIGH_LANES=2;                               // decorative lanes on EACH side (fewer = better perf)

// asset folders (served over http:// — run serve.command)
const IMG='images/', TEX='textures/', SFX='sfx/';

// selectable balls (id, label, texture file, optional always-on emissive glow color)
const BALL_TEXTURES=[
  {id:'black', label:'Black', file:'black.png'},
  {id:'silver',label:'Silver',file:'silver.png'},
  {id:'white', label:'White', file:'white.png'},
  {id:'blue',  label:'Blue',  file:'blue.png'},
  {id:'green', label:'Green', file:'green.png'},
  {id:'pink',  label:'Pink',  file:'pink.png'},
  {id:'red',   label:'Red',   file:'red.png'},
  {id:'yellow',label:'Yellow',file:'yellow.png'},
  {id:'nebula',label:'Nebula',file:'nebula.png'},
  {id:'earth', label:'Earth', file:'earth.png'},
  {id:'lightning',label:'Lightning',file:'lightning.png'},
  {id:'fire',  label:'Fire',  file:'fire.png'},
  {id:'skull', label:'Skull', file:'skull.png'},
  {id:'checkered',label:'Checkered',file:'checkered.png'},
  {id:'glow',  label:'Glow',  file:'white.png', glow:0x1dff5a},   // subtle neon-green glow
];
function ballEntry(id){ return BALL_TEXTURES.find(b=>b.id===id)||BALL_TEXTURES[0]; }
// decade themes: wood palette (3 gradient stops), room background, and light moods.
// hemi:[sky,ground,intensity]  key:[color,intensity]  fill:[color,intensity]  pin:intensity
const THEMES=[
  {id:'classic',  label:'Classic', mural:'default.png', wood:['#b57a34','#cf9147','#a06a2a'], wall:0x6b6f76,
    bg:0x090c13, hemi:[0xbfd4ff,0x39302a,0.90], key:[0xfff2d8,0.50], fill:[0x88aaff,0.35], pin:0.30,
    ret:{body:0xc7ccd2, accent:0x1fb6c6, rough:0.40, metal:0.55}, sep:{base:0x24272f,speckle:[0x3a3f4a,0x565d6b]}, stripes:[0xefb241,0x054f9b,0xcc4c33]},
  {id:'cosmic',   label:'Cosmic',  mural:'cosmic.png', wood:['#39476a','#495f8c','#2d3b58'], wall:0x181d2a, wallTex:'cosmic-walls.jpg', wallRepeat:[2,0.67], wallEmissive:0.35, cosmic:true,
    bg:0x000208, hemi:[0x3a4a80,0x101830,0.0], key:[0x223060,0.0], fill:[0x223060,0.0], pin:0.0,
    ret:{body:0x141824, accent:0x2bff77, rough:0.5, metal:0.2, emissive:0x2bff77}, sep:{base:0x05060e,speckle:[0x2bff77,0x18d0ff,0xd020ff]}, stripes:[0x2bff77,0x18d0ff,0xd020ff]},
  {id:'halloween',label:'Halloween',mural:'halloween.jpg', wood:['#5a3d24','#6f4a2c','#43301c'], wall:0x1f3e59, pinGlowColor:0x33dd55,   // spooky night: dark-navy walls, orange trim, eerie green-glow pins
    bg:0x08060f, hemi:[0x9a7bd0,0x120a1e,0.70], key:[0xffb060,0.50], fill:[0x6a4a9a,0.25], pin:0.30,
    sep:{base:0xf57f20,speckle:[0x5e336e,0xb76f2a,0x8ad08a]}, stripes:[]},
  {id:'aughts',   label:'2000s',   mural:'2000s.jpg',  wood:['#7f6b50','#927e62','#68543c'], wall:0x9b9a9f,   // Y2K: silver-grey walls, teal trim (sampled)
    bg:0x121316, hemi:[0xe8ecf2,0x2c2e33,0.95], key:[0xf2f6ff,0.50], fill:[0xc9d2de,0.30], pin:0.30,
    sep:{base:0x3da493,speckle:[0x4181c9,0x6626ae,0xcfd2d6]}, stripes:[0x4181c9,0x6626ae,0x3da493]},   // Y2K blue/purple/teal
  {id:'nineties', label:'1990s',   mural:'1990s.jpg',  wood:['#8b6b41','#9c7d4e','#74562f'], wall:0x78c7c1,   // teal walls, lavender trim (sampled)
    bg:0x14181a, hemi:[0xeaf2f0,0x2e3634,0.95], key:[0xfff4e6,0.55], fill:[0xdfeae8,0.32], pin:0.30,
    sep:{base:0xb39bcb,speckle:[0x9ce3ab,0x8f6fb0,0xe1d0b8]}, stripes:[0xb39bcb,0x9ce3ab,0xe1d0b8]},   // memphis lavender/green/cream
  {id:'eighties', label:'1980s',   mural:'1980s.png',  wood:['#c2915a','#d8ab73','#a87c4c'], wall:0xf6e7b5,
    bg:0x0a0e16, hemi:[0xd6e6ff,0x363b46,0.72], key:[0xeef4ff,0.42], fill:[0x9fb8ff,0.30], pin:0.30,
    ret:{body:0x1b1f2a, accent:0xff2bd0, rough:0.50, metal:0.20, emissive:0xff2bd0}, sep:{base:0x0c0f16,speckle:[0xff2bd0,0x18d0ff,0x2bff77,0xffe11a]}, stripes:[0xff2bd0,0x18d0ff,0x2bff77]},
  {id:'seventies',label:'1970s',   mural:'1970s.png',  wood:['#7f562a','#9b6931','#654321'], wall:0x7d8a3c,
    bg:0x130f0a, hemi:[0xfaebd0,0x2b2116,0.90], key:[0xf9e5c8,0.74], fill:[0xf5cfa4,0.32], pin:0.35,
    ret:{body:0x6f4420, accent:0xd79a20, rough:0.70, metal:0.05}, sep:{base:0x5c1e24,speckle:[0x7a2c33,0x431319,0xc0912e,0x8a4a1e]}, stripes:[0xd79a20,0x8a3a1e,0x5c1e24]},
  // ── no stripes on the mid-century themes (doesn't fit the aesthetic) ──
  {id:'sixties',  label:'1960s',   mural:'1960s.png',  wood:['#b5813e','#d29a52','#976a2f'], wall:0xc8caa9,   // mod: honey oak, soft sage walls, teal trim
    bg:0x15140f, hemi:[0xf1eee6,0x2e2a24,0.95], key:[0xfff3df,0.60], fill:[0xefe6d2,0.32], pin:0.30,
    sep:{base:0x216371,speckle:[0x2c7a88,0x184a55,0x0f3b44]}, stripes:[]},
  {id:'fifties',  label:'1950s',   mural:'1950s.png',  wood:['#8b6c42','#9d8154','#765930'], wall:0xffecb4,   // diner: deeper maple, banner-beige walls, cherry-red trim
    bg:0x1a1712, hemi:[0xf4f0e8,0x35322c,1.00], key:[0xfff6ec,0.60], fill:[0xf0e6d2,0.34], pin:0.32,
    sep:{base:0xc5301c,speckle:[0xd6483a,0x8f2115,0xe8e8ea]}, stripes:[]},
  {id:'forties',  label:'1940s',   mural:'1940s.png',  wood:['#7a5326','#96682f','#5f4020'], wall:0xcdb489,   // classic: walnut + aged-tan walls, oxblood trim, warm dim light
    bg:0x150f0a, hemi:[0xf0e2c8,0x2a2016,0.85], key:[0xf6e6c8,0.62], fill:[0xe6cfa8,0.30], pin:0.34,
    sep:{base:0x5e2a24,speckle:[0x743630,0x40201c,0x7a5a2e]}, stripes:[]},
];
function themeById(id){ return THEMES.find(t=>t.id===id)||THEMES[0]; }

// live settings
const settings={ ball:'blue', theme:'classic', mural:'default.png', bumpers:false, cosmic:false, muted:false, optimized:false };

// TUNING
const POWER_MIN=260, POWER_MAX=440;   // release speed in/s (~15–25 mph)
const CURVE_ENABLED=false;            // false = no hook; ball travels straight along the release vector
const CURVE_GAIN=7.0;                 // spin → lateral accel (in/s²)
const CURVE_VREF=350;                 // curve gain is nominal at this speed; slower = more hook, faster = less
const VY_FRICTION=0.085;             // more lane friction → ball slows toward pins so the hook builds at the back end
const PIN_DAMP=7.0, REST=0.42;

// throw input mode: 'pull' (golf-style click & pull) or 'flick' (original drag-to-throw)
const THROW_MODE='flick';
const MAXPULL=260;   // pixels of pull-back for full power

// CAMERA — tweak to taste
const CAM_FOV=55;
// horizontal field of view (degrees) held constant across aspect ratios,
// so the gutters reach the screen edges even on a narrow mobile screen
const HFOV=18;
// overview (aim) pose: low player-ish view with room on the approach to make the throw
const OV_Y=84, OV_Z=-185, OV_LY=-40, OV_LZ=300;
// chase (after release) pose: trails behind & just above the ball
const CHASE_UP=20, CHASE_BACK=115, CHASE_AHEAD=320;
const CHASE_PULL=110, CHASE_RISE=55;   // near the pins, the cam pulls back & rises to frame the deck
const CHASE_STOP=PIN_BASE-40;   // camera stops advancing once the ball reaches the pins
// how far the ball may be positioned before release (inches) — kept behind the foul line
const AIM_X=30, AIM_Y_MIN=-110, AIM_Y_MAX=0;   // throwable area (lateral out to the gutter / back-of-approach / foul line)
const POS_X=46;                                  // how far the ball may be dragged laterally (includes the return at x≈-38)

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let pins=[], ball=null, phase='menu';
let frame=0, ballInFrame=0, rolls=[], standing=[];
let msgT=0, settleT=0, rumble=null, clattered=false;
let dragging=false, samples=[];
let pulling=false, pStart=null, pPower=0, pLat=0;   // golf-style pull state

function pinLayout(){ const P=[]; let id=0;
  for(let r=0;r<4;r++) for(let j=0;j<=r;j++) P.push({id:id++, ox:(j-r/2)*COLGAP, oy:PIN_BASE+r*ROWGAP});
  return P; }

// ═══════════════════════════════════════════════════════
//  THREE.JS SCENE
// ═══════════════════════════════════════════════════════
let renderer,scene,camera,ballMesh,pinMeshes=[],aimLine,raycaster,groundPlane,WOOD=null,fx,fxctx;
let returnBall=null,ret=null,rackBodyMat=null,fromRack=false;  // surface ball-return: animated ball + anim state + themeable rack body + "ball waiting in cradle" flag
const RET_CH=-38;                               // player's return runs on the player's RIGHT (screen-right = world -X)
const PAD_TOP=6, PAD_CZ=-31, PAD_LEN=34, PAD_W=13, RAMP_RUN=22;   // pad: top height, center z, length, width; ramp horizontal run
const RACK_Y=PAD_TOP+BALL_R;                     // ball-center rest height on the pad
const RACK_RZ=PAD_CZ-PAD_LEN/2+5;                // rest z, tucked against the back (bowler-side) ledge
let lastW=0,lastH=0;
let ballMat=null,muralMat=null,bumperGroup=null,ballLight=null,returnLight=null; // referenced by settings
let muralPlane=null,muralWallW=0,muralH0=145;   // back-wall mural: visible width, and the max (previous) tile height
let hemiLight,keyLight,fillLight,pinLight,cosmicLights=null; // lighting refs
let laneGlow=[],pinGlow=[];                                  // materials that glow in cosmic mode
let laneMats=[],appMat=null,appRepeat=[1,1],sepMat=null,stripeMats=[],stripeMeshes=[],wallMat=null;   // wood/carpet + walls + wall stripes (live re-theming)
const HEMI0=0.9,KEY0=0.5,FILL0=0.35,PIN0=0.3;               // base light intensities
const stage=document.getElementById('stage');

// Performance mode: cheaper Lambert shading instead of PBR Standard (big win on old GPUs)
let PERF=false;
function mkMat(p){
  if(PERF){ const q=Object.assign({},p); delete q.roughness; delete q.metalness; return new THREE.MeshLambertMaterial(q); }
  return new THREE.MeshStandardMaterial(p);
}
function initScene(){
  PERF=!!settings.optimized;
  renderer=new THREE.WebGLRenderer({antialias:!PERF, precision:PERF?'mediump':'highp'});   // no MSAA + mediump in perf
  applyQuality();                                                     // pixel ratio per quality setting
  stage.appendChild(renderer.domElement);
  // 2D overlay for the drag-vector preview
  fx=document.createElement('canvas'); fx.style.cssText='position:absolute;inset:0;pointer-events:none;'; stage.appendChild(fx); fxctx=fx.getContext('2d');

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x090c13);
  scene.fog=new THREE.Fog(0x090c13, 700, 2000);

  camera=new THREE.PerspectiveCamera(CAM_FOV,1,1,4000);
  camera.position.set(0,OV_Y,OV_Z);
  camera.lookAt(0,OV_LY,OV_LZ);

  // lights
  hemiLight=new THREE.HemisphereLight(0xbfd4ff,0x39302a,HEMI0); scene.add(hemiLight);   // soft ambient fill
  keyLight=new THREE.DirectionalLight(0xfff2d8,KEY0);
  keyLight.position.set(120,440,280); scene.add(keyLight);      // high/far → smaller near hotspot
  fillLight=new THREE.DirectionalLight(0x88aaff,FILL0); fillLight.position.set(-120,160,-160);
  pinLight=new THREE.PointLight(0xffffff,PIN0,1100); pinLight.position.set(0,230,PIN_BASE+20);
  if(!PERF){ scene.add(fillLight); scene.add(pinLight); }   // perf: fewer real-time lights

  buildLane();
  buildBallMesh();
  buildPinMeshes();
  if(!PERF) buildReturns();                       // surface ball-returns (dropped in low graphics; returnBall stays null → return anim skipped)
  buildBumpers();
  applyThemeLights(themeById(settings.theme));   // base wood/lights per theme
  applyCosmic();                                 // then apply cosmic override if enabled

  // aim guide line
  const lg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,BALL_R,30),new THREE.Vector3(0,BALL_R,520)]);
  aimLine=new THREE.Line(lg,new THREE.LineDashedMaterial({color:0xffffff,transparent:true,opacity:0.35,dashSize:10,gapSize:10}));
  aimLine.computeLineDistances(); scene.add(aimLine);

  raycaster=new THREE.Raycaster();
  groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
  resize();
  // re-size/render whenever the stage actually gets (or changes) its dimensions
  if(window.ResizeObserver){ new ResizeObserver(()=>resize()).observe(stage); }
  // and a couple of deferred passes in case layout settles after the click
  requestAnimationFrame(resize);
  setTimeout(resize,120);
}

// shared texture loader — applies NPOT-safe settings (works with any image size on WebGL1)
function loadTex(url,onload){
  const t=new THREE.TextureLoader().load(url, tx=>{ if(onload) onload(tx); });
  t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
  t.generateMipmaps=false; t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  return t;
}
// load a tileable texture: draw onto a power-of-two canvas so WebGL1 can RepeatWrap + mipmap
// it even when the source image is NPOT (e.g. brick.png at 513×408).
function loadTiledTex(url,repeat,cb){
  const cap=PERF?512:1024;
  const np2=v=>{ let p=1; while(p<v) p*=2; const lo=p/2; return Math.min(cap,(v-lo<p-v)?lo:p); };
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=np2(img.width); c.height=np2(img.height);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const tx=new THREE.CanvasTexture(c);
    tx.wrapS=tx.wrapT=THREE.RepeatWrapping; tx.repeat.set(repeat[0],repeat[1]);
    tx.minFilter=THREE.LinearMipmapLinearFilter; tx.magFilter=THREE.LinearFilter; tx.generateMipmaps=true;
    cb(tx);
  };
  img.onerror=()=>{};
  img.src=url;
}

function woodTexture(pal){
  pal=pal||['#a86a2a','#c2843a','#9c5f24'];
  const c=document.createElement('canvas'); c.width=PERF?128:256; c.height=PERF?512:1024; const g=c.getContext('2d');
  const grad=g.createLinearGradient(0,0,c.width,0);
  grad.addColorStop(0,pal[0]); grad.addColorStop(.5,pal[1]); grad.addColorStop(1,pal[2]);
  g.fillStyle=grad; g.fillRect(0,0,c.width,c.height);
  // 39 board seams across width
  g.strokeStyle='rgba(70,42,15,.5)'; g.lineWidth=1;
  for(let b=0;b<=39;b++){ const x=b/39*c.width; g.beginPath(); g.moveTo(x,0); g.lineTo(x,c.height); g.stroke(); }
  // faint grain streaks along length
  g.strokeStyle='rgba(120,80,35,.18)';
  for(let i=0;i<60;i++){ const x=Math.random()*c.width; g.beginPath(); g.moveTo(x,0); g.lineTo(x+(Math.random()*8-4),c.height); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,LANE_LEN/120); return t;
}

// subtle fine-grain noise texture for the space between lanes
function carpetTexture(cfg){
  const S=PERF?64:128, c=document.createElement('canvas'); c.width=S; c.height=S; const g=c.getContext('2d');
  const img=g.createImageData(S,S), d=img.data;
  const br=(cfg.base>>16)&255, bg=(cfg.base>>8)&255, bb=cfg.base&255, spk=cfg.speckle||[];
  for(let i=0;i<S*S;i++){
    const n=(Math.random()*2-1)*12;                 // gentle luminance grain
    let r=br+n, gg=bg+n, b=bb+n;
    if(spk.length && Math.random()<0.02){            // very sparse, faint fleck
      const s=spk[(Math.random()*spk.length)|0], a=0.2+Math.random()*0.2;
      r=r*(1-a)+((s>>16)&255)*a; gg=gg*(1-a)+((s>>8)&255)*a; b=b*(1-a)+(s&255)*a;
    }
    const j=i*4; d[j]=Math.max(0,Math.min(255,r)); d[j+1]=Math.max(0,Math.min(255,gg)); d[j+2]=Math.max(0,Math.min(255,b)); d[j+3]=255;
  }
  g.putImageData(img,0,0);
  // repeat far more along the length than across so the grain stays square, not stretched
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,130); return t;
}
function regenSep(cfg){ if(sepMat){ sepMat.map=carpetTexture(cfg); sepMat.needsUpdate=true; } }
// walls are normally lit; a theme can set `wallUnlit:true` to show its exact `wall`
// color via the emissive channel (self-lit), so scene lighting can't tint or darken it.
function applyWallMat(t){
  if(!wallMat) return;
  const c=(t.wall!=null?t.wall:0x6b6f76);
  if(t.wallTex && !PERF){
    // tiled image on the walls: lit via `map` (so the cosmic accent lights play across it),
    // with a low `emissiveMap` floor so it never sinks to full black under the dark lighting.
    if(wallMat._texKey!==t.wallTex){
      wallMat._texKey=t.wallTex;
      loadTiledTex(IMG+t.wallTex, t.wallRepeat||[6,2], tx=>{ wallMat.map=tx; wallMat.emissiveMap=tx; wallMat.needsUpdate=true; });
    }
    wallMat.color.setHex(0xffffff); wallMat.emissive.setHex(0xffffff);
    wallMat.emissiveIntensity=(t.wallEmissive!=null?t.wallEmissive:0.35);
  } else {
    wallMat._texKey=null; wallMat.map=null; wallMat.emissiveMap=null;
    if(t.wallUnlit){ wallMat.color.setHex(0x000000); wallMat.emissive.setHex(c); wallMat.emissiveIntensity=1; }
    else { wallMat.color.setHex(c); wallMat.emissive.setHex(0x000000); wallMat.emissiveIntensity=0; }
  }
  wallMat.needsUpdate=true;
}

function buildLane(){
  WOOD=woodTexture(themeById(settings.theme).wood);
  addLaneStrip(0,false);                                   // main lane
  for(let k=-NEIGH_LANES;k<=NEIGH_LANES;k++){ if(k!==0) addLaneStrip(k*LANE_PITCH,true); }  // neighbor lanes

  // themed carpet filling the space between adjacent lanes
  sepMat=mkMat({map:carpetTexture(themeById(settings.theme).sep),roughness:0.92});
  const gapW=LANE_PITCH-2*(GUT+1.5)-1;   // only the strip between the two raised rails
  const carpLen=LANE_LEN+20;             // foul line → past the pins (matches the rails)
  for(let k=-NEIGH_LANES;k<NEIGH_LANES;k++){
    const d=new THREE.Mesh(new THREE.BoxGeometry(gapW,4,carpLen),sepMat);
    d.position.set((k+0.5)*LANE_PITCH,-2,carpLen/2); scene.add(d);
  }

  const spanHalf=NEIGH_LANES*LANE_PITCH+GUT;                // to outer edge of farthest lane
  // approach floor behind the foul line, spanning all lanes — wood, board scale matched to the lanes
  const appW=2*spanHalf+60, appD=360;
  appRepeat=[appW/(2*PLAY), appD*(LANE_LEN/120)/(LANE_LEN+80)];
  const appTex=WOOD.clone(); appTex.wrapS=appTex.wrapT=THREE.RepeatWrapping;
  appTex.repeat.set(appRepeat[0],appRepeat[1]); appTex.needsUpdate=true;
  appMat=mkMat({map:appTex,roughness:0.72}); laneGlow.push(appMat);
  const approach=new THREE.Mesh(new THREE.BoxGeometry(appW,4,appD),appMat);
  approach.position.set(0,-2.05,-180); scene.add(approach);
  const wallW=2*spanHalf+160;
  // ball & pin collection pit — kept blank/dark, behind and at the base of the pins
  const pitMat=mkMat({color:0x05070c,roughness:1});
  const pit=new THREE.Mesh(new THREE.BoxGeometry(wallW,70,20),pitMat);
  pit.position.set(0,-15,LANE_LEN+30); scene.add(pit);        // spans y ≈ -50..20
  // mural on the back wall, above the collection area.
  // Loaded from the file over http:// (run the local server); starts dark, swaps in on load.
  // single mural plane spanning the wall; height follows the image's real aspect (no squish),
  // rotated to face the camera so it isn't mirrored.
  muralMat=new THREE.MeshBasicMaterial({color:0x05070c,side:(PERF?THREE.FrontSide:THREE.DoubleSide)});
  muralWallW=2*(spanHalf+40)-8;   // width between the side walls, so the mural isn't cropped behind them
  muralPlane=new THREE.Mesh(new THREE.PlaneGeometry(1,1),muralMat);
  muralPlane.rotation.y=Math.PI;
  const naspect=1671/462, tileW0=wallW/Math.max(2,Math.round(wallW/(120*naspect)));
  const muralH=tileW0/naspect;   // original stripe-band height (restores the previous stripe size/position)
  muralH0=muralWallW/5.569;      // banner-area height = the 1960s banner's height (narrower banners tile to fill)
  muralPlane.position.set(0,20,LANE_LEN+29.8); muralPlane.scale.set(muralWallW,muralH0,1); scene.add(muralPlane);
  loadTex(IMG+settings.mural, t=>{ muralMat.map=t; muralMat.color.set(0xffffff); muralMat.needsUpdate=true; fitMural(t); });

  // enclosing room so the lanes don't float in the void
  const roomMat=mkMat({color:0x10151d,roughness:0.95});   // floor/ceiling (dark)
  wallMat=mkMat({roughness:0.9});   // themed walls (color/emissive set by applyWallMat)
  applyWallMat(themeById(settings.theme));
  const spanX=spanHalf+40, zA=-220, zB=LANE_LEN+50, roomLen=zB-zA, roomCz=(zA+zB)/2;
  const floor=new THREE.Mesh(new THREE.BoxGeometry(2*spanX+40,4,roomLen),roomMat);
  floor.position.set(0,-8,roomCz); scene.add(floor);                       // floor under everything
  for(const s of [-1,1]){
    const wall=new THREE.Mesh(new THREE.BoxGeometry(8,240,roomLen),wallMat);
    wall.position.set(s*spanX,110,roomCz); scene.add(wall);                // side walls just beyond the outer lanes
  }
  const back=new THREE.Mesh(new THREE.BoxGeometry(2*spanX,240,8),wallMat);
  back.position.set(0,110,LANE_LEN+40); scene.add(back);                   // solid wall behind the mural
  const ceil=new THREE.Mesh(new THREE.BoxGeometry(2*spanX,6,roomLen),roomMat);
  ceil.position.set(0,215,roomCz); scene.add(ceil);                        // ceiling
  // themed horizontal stripes on the side walls, at the mural's level, full wall length (skipped in low graphics)
  stripeMats=[]; stripeMeshes=[];
  if(!PERF){
    const th0=themeById(settings.theme);
    const stripeCols=(th0.stripes&&th0.stripes.length)?th0.stripes:[0xefb241,0x054f9b,0xcc4c33];  // always build 3 (toggled per theme)
    stripeMats=stripeCols.map(c=>mkMat({color:c,roughness:0.7}));
    const sh=muralH/stripeMats.length;
    for(const s of [-1,1]){
      for(let i=0;i<stripeMats.length;i++){
        const st=new THREE.Mesh(new THREE.PlaneGeometry(roomLen,sh*0.9),stripeMats[i]);
        st.rotation.y = s>0 ? -Math.PI/2 : Math.PI/2;         // flat on the wall, facing the lanes
        st.position.set(s*(spanX-4.02), 20+sh*(i+0.5), roomCz); scene.add(st); stripeMeshes.push(st);
      }
    }
    const hs=(th0.stripes&&th0.stripes.length); stripeMeshes.forEach(m=>m.visible=!!hs && !settings.cosmic);   // hide when a theme has no stripes (or cosmic)
  }
}

// One lane strip: wood bed (extends under the pins), gutters, rails, and — for
// neighbor lanes — a static full rack of decorative pins.
function addLaneStrip(xoff,deco){
  const laneMat=mkMat({map:WOOD,roughness:0.72,metalness:0.0}); // rougher → no harsh glare
  laneGlow.push(laneMat); laneMats.push(laneMat);
  const lane=new THREE.Mesh(new THREE.BoxGeometry(2*PLAY,4,LANE_LEN+80),laneMat);
  lane.position.set(xoff,-2,LANE_LEN/2-20); scene.add(lane);

  const sepLen=LANE_LEN+20, sepZ=sepLen/2;   // gutters/rails run from the foul line (z=0) to past the pins
  const gutMat=mkMat({color:0x11161f,roughness:0.6});
  const gw=GUT-PLAY;
  for(const s of [-1,1]){
    const gutter=new THREE.Mesh(new THREE.BoxGeometry(gw,6,sepLen),gutMat);
    gutter.position.set(xoff+s*(PLAY+gw/2),-5,sepZ); scene.add(gutter);
  }
  const railMat=mkMat({color:0x1b2231,roughness:0.5});
  for(const s of [-1,1]){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(3,10,sepLen),railMat);
    rail.position.set(xoff+s*(GUT+1.5),-1,sepZ); scene.add(rail);
  }
  // aiming arrows + approach dots + foul line (on every lane)
  const markMat=mkMat({color:0x3a230c,roughness:0.75});
  for(let a=-3;a<=3;a++){
    const sh=new THREE.Shape(); sh.moveTo(0,4); sh.lineTo(-2.4,-3); sh.lineTo(2.4,-3); sh.closePath();
    const arw=new THREE.Mesh(new THREE.ShapeGeometry(sh),markMat);
    arw.rotation.x=-Math.PI/2; arw.position.set(xoff+a*5.06,0.1,180+Math.abs(a)*14); arw.scale.set(2,2,2); scene.add(arw);
    const dot=new THREE.Mesh(new THREE.CircleGeometry(1.6,16),markMat);
    dot.rotation.x=-Math.PI/2; dot.position.set(xoff+a*5.06,0.1,84); scene.add(dot);
  }
  const flMat=mkMat({color:0xf2f2f2,roughness:0.6});
  const fl=new THREE.Mesh(new THREE.BoxGeometry(2*PLAY,0.3,1.5),flMat);
  fl.position.set(xoff,0.15,2); scene.add(fl);

  if(deco && !PERF){ for(const p of pinLayout()){ const m=makePinObject(true); m.position.set(p.ox+xoff,0,p.oy); scene.add(m); } }  // no decorative neighbor pins in low graphics
}


function makePinObject(deco){
  // lathe profile: Vector2(radius, height) bottom→top (inches)
  const pts=[
    [1.05,0.0],[1.12,0.5],[1.30,1.2],[1.65,2.2],[2.02,3.3],[2.28,4.2],[2.383,4.9],
    [2.34,5.6],[2.15,6.5],[1.80,7.6],[1.45,8.6],[1.15,9.5],[0.98,10.2],[0.92,10.7],
    [0.98,11.3],[1.12,12.1],[1.22,12.9],[1.16,13.5],[0.95,14.0],[0.68,14.4],
    [0.40,14.72],[0.16,14.92],[0.0,15.0]
  ].map(p=>new THREE.Vector2(p[0],p[1]));
  const bodyMat=mkMat({color:0xffffff,roughness:0.45,metalness:0.02,side:(PERF?THREE.FrontSide:THREE.DoubleSide)});
  pinGlow.push(bodyMat);
  const body=new THREE.Mesh(new THREE.LatheGeometry(pts, (deco||PERF)?12:24),bodyMat);   // fewer segments for distant/decorative pins (and all pins in perf)
  const grp=new THREE.Group(); grp.add(body);
  // red neck rings — only on the playable pins (decorative ones skip them to cut draw calls)
  if(!deco){
    const ringMat=mkMat({color:0xe23b30,roughness:0.45});
    for(const y of [10.3,11.1]){
      const ring=new THREE.Mesh(new THREE.TorusGeometry(0.98,0.16,8,18),ringMat);
      ring.rotation.x=Math.PI/2; ring.position.y=y; grp.add(ring);
    }
  }
  return grp;
}
function buildPinMeshes(){
  pinMeshes=[]; for(let i=0;i<10;i++){ const m=makePinObject(); scene.add(m); pinMeshes.push(m); }
}

function buildBallMesh(){
  const grp=new THREE.Group();
  ballMat=mkMat({color:0xffffff,roughness:0.28,metalness:0.15});
  const be=ballEntry(settings.ball);
  ballMat.map=loadTex(TEX+be.file, ()=>{ ballMat.needsUpdate=true; });
  ballLight=new THREE.PointLight(0x1dff5a,0,170,1.6);   // travels with the ball; lit only for the Glow ball
  grp.add(ballLight);
  if(be.glow){ ballMat.emissive.set(be.glow); ballMat.emissiveIntensity=1.3; ballLight.color.set(be.glow); ballLight.intensity=1.8; }
  const sphere=new THREE.Mesh(new THREE.SphereGeometry(BALL_R,PERF?20:48,PERF?14:36),ballMat);
  grp.add(sphere);
  ballMesh=grp; scene.add(grp);
}

// ── surface ball return: a small ramp up to a flat carpeted pad, with a low ledge on 3 sides ──
// (hood + legs to come later; the pin-facing side stays open where the ramp feeds in)
function buildReturnUnit(cx){
  const padMat=sepMat;                             // flat top like the between-lane carpet
  const pinEdge=PAD_CZ+PAD_LEN/2, backEdge=PAD_CZ-PAD_LEN/2;
  // flat holding pad, raised a little off the channel floor
  const pad=new THREE.Mesh(new THREE.BoxGeometry(PAD_W,PAD_TOP,PAD_LEN),padMat); pad.position.set(cx,PAD_TOP/2,PAD_CZ); scene.add(pad);
  // small ramp from the channel floor up onto the pad (pin side); angle set so it meets the floor at the new height
  const rampHyp=Math.hypot(PAD_TOP,RAMP_RUN);
  const ramp=new THREE.Mesh(new THREE.BoxGeometry(PAD_W,1.4,rampHyp),padMat);
  ramp.position.set(cx,PAD_TOP/2,pinEdge+RAMP_RUN/2); ramp.rotation.x=Math.atan2(PAD_TOP,RAMP_RUN); scene.add(ramp);
  // low ledge surrounding left, right, and back (bowler side); pin side left open for the ramp
  const LEDGE_H=5, LEDGE_T=1.4;
  for(const s of [-1,1]){
    const w=new THREE.Mesh(new THREE.BoxGeometry(LEDGE_T,LEDGE_H,PAD_LEN),rackBodyMat);
    w.position.set(cx+s*(PAD_W/2-LEDGE_T/2),PAD_TOP+LEDGE_H/2,PAD_CZ); scene.add(w);
  }
  const back=new THREE.Mesh(new THREE.BoxGeometry(PAD_W,LEDGE_H,LEDGE_T),rackBodyMat);
  back.position.set(cx,PAD_TOP+LEDGE_H/2,backEdge+LEDGE_T/2); scene.add(back);
}
function buildReturns(){
  const chans=[-190,-114,-38,38,114];            // right-side channel of each of the 5 lanes
  const railMat=mkMat({color:0x2a2e36,roughness:0.7,metalness:0.3});
  const trayMat=mkMat({color:0x3a3f49,roughness:0.6,metalness:0.35});
  rackBodyMat=mkMat({color:themeById(settings.theme).sep.base,roughness:0.6});   // match the between-lane color
  const railLen=LANE_LEN+20;
  for(const cx of chans){
    for(const s of [-1,1]){                       // two rails ~just wider than the ball → narrows the channel
      const r=new THREE.Mesh(new THREE.BoxGeometry(1.4,5,railLen),railMat);
      r.position.set(cx+s*5.0,0.5,railLen/2-20); scene.add(r);
    }
    const ramp=new THREE.Mesh(new THREE.BoxGeometry(11,1.2,64),trayMat);   // lifts the ball out of the pit
    ramp.position.set(cx,-2,752); ramp.rotation.x=-0.18; scene.add(ramp);
    buildReturnUnit(cx);
  }
  returnBall=new THREE.Mesh(new THREE.SphereGeometry(BALL_R,PERF?16:32,PERF?12:24),ballMat); returnBall.visible=false; scene.add(returnBall);   // only the player's ball rides back
  returnLight=new THREE.PointLight(0x1dff5a,0,170,1.6); returnBall.add(returnLight);   // glow travels with the return ball too
  { const e=ballEntry(settings.ball); returnLight.color.set(e.glow||0xffffff); returnLight.intensity=e.glow?1.8:0; }
}
// after a throw settles: ball rides back up the channel, up the ramp onto the pad, holds, then feeds to center.
function startReturn(){
  if(!returnBall){ resetBall(); phase='aim'; return; }
  ballMesh.visible=false; returnBall.visible=true;
  const X=RET_CH, Y=BALL_R, padPin=PAD_CZ+PAD_LEN/2, rampFoot=padPin+RAMP_RUN;
  ret={ i:0, t:0, onEnd:finishFeed,
    segs:[
      {from:[X,-6,785],         to:[X,Y,728],            d:0.5},   // emerge up the pit ramp
      {from:[X,Y,728],          to:[X,Y,rampFoot],       d:1.2},   // roll back down the channel to the ramp foot
      {from:[X,Y,rampFoot],     to:[X,RACK_Y,padPin],    d:0.5},   // up the ramp onto the pad
      {from:[X,RACK_Y,padPin],  to:[X,RACK_Y,RACK_RZ],   d:0.6},   // across the pad to rest against the back ledge
      {from:[X,RACK_Y,RACK_RZ], to:[X,RACK_Y,RACK_RZ],   d:0.5},   // hold half a second in the return
      {from:[X,RACK_Y,RACK_RZ], to:[X,RACK_Y+6,RACK_RZ], d:0.3},   // lift up over the ledge
      {from:[X,RACK_Y+6,RACK_RZ], to:[0,Y,-6],           d:0.7},   // then glide to the middle-of-lane start
    ]};
  phase='returning';
}
// hand off to the playable ball at the middle-of-lane ready position
function finishFeed(){ resetBall(); if(ballMesh)ballMesh.visible=true; if(returnBall)returnBall.visible=false; phase='aim'; }
function stepReturn(dt){
  if(!ret){ return; }
  ret.t+=dt; let s=ret.segs[ret.i];
  while(s && ret.t>=s.d){ ret.t-=s.d; ret.i++; s=ret.segs[ret.i]; }
  if(!s){ const cb=ret.onEnd; ret=null; if(cb) cb(); return; }
  let u=s.d>0?ret.t/s.d:1; u=u<0?0:u>1?1:u; const e=u*u*(3-2*u);   // smoothstep
  const x=s.from[0]+(s.to[0]-s.from[0])*e, y=s.from[1]+(s.to[1]-s.from[1])*e, z=s.from[2]+(s.to[2]-s.from[2])*e;
  returnBall.position.set(x,y,z);
  returnBall.rotation.x += ((s.to[2]-s.from[2])/Math.max(0.001,s.d))*dt/BALL_R;   // roll while it travels
}

function resize(){
  if(!renderer || !camera) return;   // camera may not exist during early init

  if(w===lastW && h===lastH) return;   // no real change — avoids a ResizeObserver feedback loop
  lastW=w; lastH=h;
  renderer.setSize(w,h,false);         // CSS keeps the canvas at 100% of the stage (see stylesheet)
  if(fx){ fx.width=w; fx.height=h; }
  const aspect=w/h;
  // derive vertical FOV from a fixed horizontal FOV so lane width fills the frame width
  let vfov=2*Math.atan(Math.tan(HFOV*Math.PI/360)/aspect)*180/Math.PI;
  vfov=Math.max(32,Math.min(64,vfov));   // keep sane on very wide/tall screens

// All SFX go through the Web Audio API (not <audio> elements). On iOS an
// HTMLMediaElement seizes the exclusive "playback" audio session and stops the
// user's background music; Web Audio uses a mixable session, and we explicitly
// request the "ambient" session so background audio (Spotify, podcasts…) keeps playing.
let _ac=null, master=null, rollSrc=null, rollGain=null, _muted=false, _sfxInit=false;
const BUFFERS={};

function newCtx(){

  _ac=new AC({latencyHint:'interactive'});             // low output latency → less audible lag on mobile
  master=_ac.createGain(); master.gain.value=_muted?0:1; master.connect(_ac.destination);
  try{ if(navigator.audioSession) navigator.audioSession.type='ambient'; }catch(e){}   // mix with background audio
  if(_ac.addEventListener) _ac.addEventListener('statechange',()=>{ if(_ac && _ac.state!=='running' && _ac.state!=='closed' && _ac.resume) _ac.resume().catch(()=>{}); });
  rollSrc=null; rollGain=null;

}
function getAC(){

  if(!_ac || _ac.state==='closed' || _ac.state==='interrupted'){ try{ if(_ac) _ac.close(); }catch(e){} newCtx(); }
  else if(_ac.state!=='running' && _ac.resume){ _ac.resume().catch(()=>{}); }

}
// any interaction (or returning to the tab) recovers the context — resume, or rebuild if interrupted
function resumeAudio(){ if(_ac) getAC(); }

function initSfx(){
  if(_sfxInit) return; _sfxInit=true;
  const ac=_ac||getAC();
  for(const name in SFX_FILES){
    fetch(SFX+SFX_FILES[name])
      .then(r=>r.ok?r.arrayBuffer():Promise.reject())
      .then(b=>ac.decodeAudioData(b))

}

function resumeGame(s){

  standing=(Array.isArray(s.standing)&&s.standing.length===10)?s.standing.slice():Array(10).fill(true);
  pins=pinLayout().map((p,i)=>({id:p.id,ox:p.ox,oy:p.oy,x:p.ox,y:p.oy,vx:0,vy:0,down:false,fall:0,fdx:1,fdz:0,racked:!!standing[i]}));

function rackFull(){ pins=pinLayout().map(p=>({id:p.id,ox:p.ox,oy:p.oy,x:p.ox,y:p.oy,vx:0,vy:0,down:false,fall:0,fdx:1,fdz:0,racked:true})); standing=pins.map(()=>true); }

function launch(vyPix,vxPix){

  const remaining=standing.filter(Boolean).length;

  const isStrike=(downed===10 && standingBefore===10);
  const isSpare =(!isStrike && remaining===0 && standingBefore>0);
  if(isStrike) celebrate('STRIKE'); else if(isSpare) celebrate('SPARE');

    if(ballInFrame===0 && downed===10) frameOver=true;
    else if(ballInFrame===0){ ballInFrame=1; rerack=true; }
    else frameOver=true;
  } else {
    if(ballInFrame===0){ if(downed===10){ ballInFrame=1; rackFull(); } else { ballInFrame=1; rerack=true; } }

function calcTotals(){
  const out=[]; let i=0,cum=0;
  for(let f=0;f<10;f++){
    if(i>=rolls.length){ out.push({rolls:[],score:null}); continue; }
    let fr={rolls:[],score:null};
    if(f<9){
      if(rolls[i]===10){ fr.rolls=[10]; if(rolls[i+1]!==undefined&&rolls[i+2]!==undefined){cum+=10+rolls[i+1]+rolls[i+2];fr.score=cum;} i+=1; }
      else if(rolls[i]!==undefined&&rolls[i+1]!==undefined){ const a=rolls[i],b=rolls[i+1]; fr.rolls=[a,b];
        if(a+b===10){ if(rolls[i+2]!==undefined){cum+=10+rolls[i+2];fr.score=cum;} } else {cum+=a+b;fr.score=cum;} i+=2; }
      else { fr.rolls=[rolls[i]]; i=rolls.length; }
    } else {

    if(f<9){ let a='',b='';
      if(r.length){ if(r[0]===10){ a=''; b='X'; } else { a=cell(r[0]); b=(r[1]!==undefined?cell(r[1],r[0]):''); } }
      boxes=`<div class="rb">${a}</div><div class="rb">${b}</div>`;
    } else { let s=['','',''],prev;
      for(let k=0;k<r.length;k++){ const v=r[k];
        if(v===10) s[k]='X'; else if(k>0&&prev!==undefined&&prev!==10&&prev+v===10) s[k]='/'; else s[k]=(v===0?'-':v);
        prev=(v===10?undefined:v); }

const _rollAxis=new THREE.Vector3(), _tmp=new THREE.Vector3();
let lastBallY=30;
function sync(dt){
  // ball

  const ds=(ball.y-lastBallY); lastBallY=ball.y;
  if(phase==='rolling' && Math.abs(ds)>1e-4){
    // roll about horizontal axis perpendicular to travel direction
    _rollAxis.set(ball.vy,0,-ball.vx); if(_rollAxis.lengthSq()<1e-6)_rollAxis.set(1,0,0); _rollAxis.normalize();

  }
  aimLine.visible=(phase==='aim' && !fromRack);
  if(phase==='aim' && !fromRack && !pulling){       // during a pull, the move handler drives the aim line
    const p=aimLine.geometry.attributes.position;
    p.setXYZ(0,ball.x,BALL_R,ball.y); p.setXYZ(1,ball.x,BALL_R,520); p.needsUpdate=true;
    aimLine.computeLineDistances();

    m.visible=p.racked; if(!p.racked) continue;
    if(p.down && p.fall>0){

      m.position.set(p.x, (PIN_R+0.5)*Math.sin(ang), p.y); // lift as it tips so it rests on the lane

}

  const spd=(_fkeys.shift?1400:520)*dt, fwd=_fcDir(), right=new THREE.Vector3(-fwd.z,0,fwd.x).normalize(), mv=new THREE.Vector3();
  if(_fkeys.w) mv.add(fwd); if(_fkeys.s) mv.sub(fwd);
  if(_fkeys.d) mv.add(right); if(_fkeys.a) mv.sub(right);
  if(_fkeys.e) mv.y+=1; if(_fkeys.q) mv.y-=1;
  if(mv.lengthSq()>0) freecam.pos.add(mv.normalize().multiplyScalar(spd));
  camera.position.copy(freecam.pos); camera.lookAt(freecam.pos.clone().add(_fcDir()));
}
function updateCamera(dt){
  if(freecam) return;   // free-cam drives the camera itself
  const target=(phase==='rolling')?1:0;
  camBlend += (target-camBlend)*(1-Math.exp(-dt*5));   // smooth ease
  const cy=Math.min(ball.y, CHASE_STOP);               // freeze forward advance at the pins
  const near=Math.max(0,Math.min(1,(ball.y-(PIN_BASE-120))/120)); // hold behind the ball, then pull back only in the last stretch
  const back=CHASE_BACK + near*CHASE_PULL;             // ease back a little near the end
  const up  =CHASE_UP + near*CHASE_RISE;               // and rise to see the pin deck
  _cPos.set(ball.x*0.45, up, cy-back);
  _cLook.set(ball.x*0.30, -10, cy+CHASE_AHEAD);   // aim lower so less blank wall shows
  _pPos.lerpVectors(_ovPos,_cPos,camBlend);
  _pLook.lerpVectors(_ovLook,_cLook,camBlend);
  camera.position.copy(_pPos); camera.lookAt(_pLook);
}
let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000,0.033); lastT=t;
  if(phase==='rolling'){ const n=6; for(let k=0;k<n;k++) step(dt/n); }
  else if(phase==='returning'){ stepReturn(dt); }
  if(msgT>0){ msgT-=dt; if(msgT<=0) document.getElementById('msg').textContent=''; }
  if(renderer && ball){ sync(dt); if(freecam) updateFreecam(dt); else updateCamera(dt); renderer.render(scene,camera); }   // render even in the menu (lanes behind the title)
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  INPUT — drag to throw (aim by raycast, flick for power/spin)
// ═══════════════════════════════════════════════════════
function ndc(e){ const r=renderer.domElement.getBoundingClientRect();
  const s=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return { x:((s.clientX-r.left)/r.width)*2-1, y:-((s.clientY-r.top)/r.height)*2+1, px:s.clientX, py:s.clientY }; }
const _hit=new THREE.Vector3();
function aimTo(n){
  raycaster.setFromCamera({x:n.x,y:n.y},camera);
  if(raycaster.ray.intersectPlane(groundPlane,_hit)){
    ball.x=Math.max(-POS_X,Math.min(POS_X,_hit.x));        // free lateral positioning (out to the return)
    ball.y=Math.max(AIM_Y_MIN,Math.min(AIM_Y_MAX,_hit.z)); // forward/back on the approach
  }
}
// a throw only counts if the ball is within the lane's throwable area
function canThrow(){ return Math.abs(ball.x)<=AIM_X; }
function down(e){ if(freecam) return; if(phase!=='aim') return; e.preventDefault(); getAC();
  dragging=true; samples=[]; stage.classList.add('throwing');
  const n=ndc(e); samples.push({px:n.px,py:n.py,t:performance.now()}); aimTo(n); }
function move(e){ if(!dragging) return; e.preventDefault();
  const n=ndc(e); samples.push({px:n.px,py:n.py,t:performance.now()}); if(samples.length>8) samples.shift(); aimTo(n); }
function up(e){ if(!dragging) return; e.preventDefault(); dragging=false; stage.classList.remove('throwing');
  const n=ndc(e); const now=performance.now(); samples.push({px:n.px,py:n.py,t:now});
  let ref=samples[0]; for(let i=samples.length-1;i>=0;i--){ if(now-samples[i].t>=110){ ref=samples[i]; break; } if(i===0) ref=samples[0]; }
  const dtv=Math.max(0.03,(now-ref.t)/1000);
  const vyPix=(n.py-ref.py)/dtv, vxPix=(n.px-ref.px)/dtv;
  if(-vyPix<180){ flash('Flick forward to roll'); return; }
  if(!canThrow()){ flash('Bring the ball onto the lane'); return; }
  launch(vyPix,vxPix);
}
// ── golf-style click & pull ──
function drawDrag(cur){
  if(!fxctx||!pStart) return;
  const r=renderer.domElement.getBoundingClientRect();
  const x0=pStart.px-r.left, y0=pStart.py-r.top, x1=cur.px-r.left, y1=cur.py-r.top;
  fxctx.clearRect(0,0,fx.width,fx.height);
  const col=pPower>0.75?'#ff5a4a':pPower>0.4?'#ffb52a':'#5ad46a';
  fxctx.setLineDash([9,7]); fxctx.lineWidth=3; fxctx.strokeStyle=col;
  fxctx.beginPath(); fxctx.moveTo(x0,y0); fxctx.lineTo(x1,y1); fxctx.stroke();
  fxctx.setLineDash([]); fxctx.fillStyle=col;
  fxctx.beginPath(); fxctx.arc(x0,y0,5,0,Math.PI*2); fxctx.fill();   // anchor
  fxctx.beginPath(); fxctx.arc(x1,y1,8,0,Math.PI*2); fxctx.fill();   // handle
}
function clearDrag(){ if(fxctx&&fx) fxctx.clearRect(0,0,fx.width,fx.height); }

function pDown(e){ if(freecam) return; if(phase!=='aim') return; e.preventDefault(); getAC();
  pulling=true; pPower=0; pLat=0; const n=ndc(e); pStart={px:n.px,py:n.py}; clearDrag(); }
function pMove(e){ if(!pulling) return; e.preventDefault();
  const n=ndc(e); const dx=n.px-pStart.px, dy=n.py-pStart.py;   // pull DOWN (dy>0) = power
  pPower=Math.max(0,Math.min(1,Math.max(0,dy)/MAXPULL));
  pLat=Math.max(-1,Math.min(1,dx/MAXPULL));
  // preview aim line: launches in the direction of the pull
  const ex=ball.x+pLat*90, p=aimLine.geometry.attributes.position;
  p.setXYZ(0,ball.x,BALL_R,ball.y); p.setXYZ(1,ex,BALL_R,520); p.needsUpdate=true; aimLine.computeLineDistances();
  document.getElementById('msg').textContent='Power '+Math.round(pPower*100)+'%'; msgT=1;
  drawDrag(n);
}
function pUp(e){ if(!pulling) return; e.preventDefault(); pulling=false; clearDrag();
  if(pPower<0.08){ flash('Pull back to roll'); return; }
  if(!canThrow()){ flash('Bring the ball onto the lane'); return; }
  launchPull(pPower,pLat);
}

function bindInput(){
  const el=renderer.domElement;
  if(THROW_MODE==='pull'){
    el.addEventListener('mousedown',pDown); el.addEventListener('mousemove',pMove); window.addEventListener('mouseup',pUp);
    el.addEventListener('touchstart',pDown,{passive:false}); el.addEventListener('touchmove',pMove,{passive:false}); el.addEventListener('touchend',pUp,{passive:false});
  } else {
    el.addEventListener('mousedown',down); el.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
    el.addEventListener('touchstart',down,{passive:false}); el.addEventListener('touchmove',move,{passive:false}); el.addEventListener('touchend',up,{passive:false});
  }
  // free-cam drag-to-look (only active while freecam is on)
  let flook=false,flx=0,fly=0;
  const pos=e=>(e.touches&&e.touches[0])||e;
  const fdown=e=>{ if(!freecam)return; flook=true; const s=pos(e); flx=s.clientX; fly=s.clientY; };
  const fmove=e=>{ if(!freecam||!flook)return; const s=pos(e); freecam.yaw-=(s.clientX-flx)*0.005; freecam.pitch=Math.max(-1.45,Math.min(1.45,freecam.pitch-(s.clientY-fly)*0.005)); flx=s.clientX; fly=s.clientY; e.preventDefault(); };
  const fup=()=>{ flook=false; };
  el.addEventListener('mousedown',fdown); window.addEventListener('mousemove',fmove); window.addEventListener('mouseup',fup);
  el.addEventListener('touchstart',fdown,{passive:true}); window.addEventListener('touchmove',fmove,{passive:false}); window.addEventListener('touchend',fup);
  // keyboard: F toggles free-cam; WASD/QE fly while it's on
  const code=e=>({KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',KeyQ:'q',KeyE:'e',ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'})[e.code];
  window.addEventListener('keydown',e=>{
    if(e.code==='KeyF'){ toggleFreecam(); return; }
    if(!freecam) return;
    _fkeys.shift=e.shiftKey; const k=code(e); if(k){ _fkeys[k]=true; e.preventDefault(); }
  });
  window.addEventListener('keyup',e=>{ _fkeys.shift=e.shiftKey; const k=code(e); if(k) _fkeys[k]=false; });
}

// ═══════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════
function buildBumpers(){
  bumperGroup=new THREE.Group();
  const mat=mkMat({color:0xff4488,roughness:0.95,metalness:0.0,emissive:0x330011,emissiveIntensity:0.25});
  const r=(GUT-PLAY)/2;                               // fills the gutter width exactly, no wider
  const len=PIN_BASE;                                 // run the full length to the pin deck
  for(const s of [-1,1]){
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,PERF?8:16),mat);
    tube.rotation.x=Math.PI/2;                        // lie along the lane
    tube.position.set(s*(PLAY+r),3,len/2);            // centered in the gutter (inner edge ≈ PLAY, outer ≈ GUT)
    bumperGroup.add(tube);
  }
  bumperGroup.visible=settings.bumpers; scene.add(bumperGroup);
}
// apply a theme's light mood + room color (the non-cosmic look)
function applyThemeLights(t){
  if(!hemiLight) return;
  hemiLight.color.setHex(t.hemi[0]); hemiLight.groundColor.setHex(t.hemi[1]); hemiLight.intensity=t.hemi[2];
  keyLight.color.setHex(t.key[0]); keyLight.intensity=t.key[1];
  fillLight.color.setHex(t.fill[0]); fillLight.intensity=t.fill[1];
  pinLight.intensity=t.pin;
  if(scene){ scene.background.setHex(t.bg); if(scene.fog) scene.fog.color.setHex(t.bg); }
}
// re-tint the wood (lanes + approach) live for a theme palette
function regenWood(pal){
  WOOD=woodTexture(pal);
  for(const m of laneMats){ m.map=WOOD; m.needsUpdate=true; }
  if(appMat){ const at=WOOD.clone(); at.wrapS=at.wrapT=THREE.RepeatWrapping; at.repeat.set(appRepeat[0],appRepeat[1]); at.needsUpdate=true; appMat.map=at; appMat.needsUpdate=true; }
}
function applyTheme(id){
  const wasCosmic=settings.cosmic;
  settings.theme=id; const t=themeById(id); settings.cosmic=!!t.cosmic;
  if(laneMats.length){ regenWood(t.wood); regenSep(t.sep);      // live re-tint if the scene is built
    (t.stripes||[]).forEach((c,i)=>{ if(stripeMats[i]){ stripeMats[i].color.setHex(c); stripeMats[i].needsUpdate=true; } });
    applyWallMat(t);
    { const hs=(t.stripes&&t.stripes.length); stripeMeshes.forEach(m=>m.visible=!!hs && !settings.cosmic); } }
  if(settings.cosmic && !wasCosmic){ settings._ballBefore=settings.ball; applyBall('glow'); }   // cosmic → glow ball
  else if(!settings.cosmic && wasCosmic){ applyBall(settings._ballBefore||'blue'); }            // leaving cosmic → restore
  applyMural(settings.cosmic?'cosmic.png':t.mural);
  applyCosmic();                                         // lights/glows/mural-tint based on settings.cosmic
  highlightBall(); highlightTheme();
  saveSettings();
}
function applyCosmic(){
  if(!scene) return;
  const on=settings.cosmic;
  if(!on){ applyThemeLights(themeById(settings.theme)); if(scene.fog){ scene.fog.near=700; scene.fog.far=2000; } }
  else {
    scene.background.set(0x000208);
    if(scene.fog){ scene.fog.color.set(0x000208); scene.fog.near=350; scene.fog.far=1700; }
    hemiLight.intensity=0; keyLight.intensity=0; fillLight.intensity=0; pinLight.intensity=0;
  }
  if(on && !cosmicLights){
    cosmicLights=new THREE.Group();
    if(!PERF){   // perf: drop the extra point lights (biggest cosmic cost), keep the neon strips below
      // low, side-grazing accents (kept low so they don't flood the lane like an overhead light)
      const mag =new THREE.PointLight(0xd020ff,0.8,900); mag.position.set(-160,45,260);   // magenta accent
      const cyan=new THREE.PointLight(0x18d0ff,0.8,900); cyan.position.set(160,45,540);    // cyan accent
      // (4) blacklight aimed at the mural (up at the wall, not over the lane)
      const uv  =new THREE.PointLight(0x8a4bff,1.4,1500); uv.position.set(0,120,LANE_LEN+8);
      cosmicLights.add(mag,cyan,uv);
    }
    // (5) long thin green light strips running along the border rails of every lane
    const stripMat=new THREE.MeshBasicMaterial({color:0x2bff77});
    const stripLen=PIN_BASE-40, stripGeo=new THREE.BoxGeometry(1.6,1.2,stripLen);
    for(let k=-NEIGH_LANES;k<=NEIGH_LANES;k++){ const xc=k*LANE_PITCH;
      for(const s of [-1,1]){
        const strip=new THREE.Mesh(stripGeo,stripMat);
        strip.position.set(xc+s*(GUT+1.5),6,stripLen/2+20);   // on the rail top, along the lane
        cosmicLights.add(strip);
      }
    }
    scene.add(cosmicLights);
  }
  if(cosmicLights) cosmicLights.visible=on;
  // glows: lanes deep blue, (3) pins inner green, (2) ball inner blue
  for(const m of laneGlow){ if(m&&m.emissive){ m.emissive.set(on?0x0a1e5a:0x000000); m.emissiveIntensity=on?0.7:1; m.needsUpdate=true; } }
  // pins: green in cosmic, or a per-theme pin glow (e.g. Halloween) when not cosmic
  const pg = on ? 0x1a9e46 : (themeById(settings.theme).pinGlowColor||0x000000);
  for(const m of pinGlow ){ if(m&&m.emissive){ m.emissive.set(pg); m.emissiveIntensity=(pg?0.9:1); m.needsUpdate=true; } }
  // (4) blacklight tint on the mural (MeshBasic ignores lights, so tint its color)
  if(muralMat) muralMat.color.set(on?0x8f9cff:0xffffff);
}
function applyBall(id){ settings.ball=id; saveSettings(); if(!ballMat) return; const e=ballEntry(id);
  ballMat.color.set(0xffffff); ballMat.map=loadTex(TEX+e.file,()=>{ballMat.needsUpdate=true;});
  ballMat.emissive.set(e.glow||0x000000); ballMat.emissiveIntensity=e.glow?1.3:1; ballMat.needsUpdate=true;
  if(ballLight){ ballLight.color.set(e.glow||0xffffff); ballLight.intensity=e.glow?1.8:0; }
  if(returnLight){ returnLight.color.set(e.glow||0xffffff); returnLight.intensity=e.glow?1.8:0; } }
// size the mural plane to the loaded image's aspect (keeps its base at y≈20, no vertical squish)
function fitMural(tex){
  if(!muralPlane) return;
  const img=tex&&tex.image, asp=(img&&img.width&&img.height)?img.width/img.height:5.569;
  const VW=muralWallW, h=muralH0;              // fixed banner height (= 1960s banner height)
  const r=VW/(h*asp);                          // horizontal repeats to fill the wall at that height (no squish)
  muralPlane.scale.set(VW,h,1); muralPlane.position.y=20+h/2;
  const m=muralMat.map; if(m){ m.wrapS=THREE.RepeatWrapping; m.repeat.set(r,1); m.offset.x=-((r-1)/2); m.needsUpdate=true; }  // center so any partial tiles split evenly
}
function applyMural(file){ settings.mural=file; saveSettings(); if(muralMat){ loadTex(IMG+file,t=>{muralMat.map=t;muralMat.color.set(settings.cosmic?0x8f9cff:0xffffff);muralMat.needsUpdate=true;fitMural(t);}); } }
function setBumpers(on){ settings.bumpers=on; saveSettings(); if(bumperGroup) bumperGroup.visible=on; }
// optimized-quality mode: lower the retina pixel ratio (big win on older tablets like a 2020 iPad)
function applyQuality(){
  if(!renderer) return;
  const dpr=window.devicePixelRatio||1;
  renderer.setPixelRatio(settings.optimized ? Math.min(1.0,dpr) : Math.min(1.5,dpr));
  lastW=lastH=0; resize();                 // force the size to re-apply at the new pixel ratio
}
function setOptimized(on){ settings.optimized=on; saveSettings(); saveGame();
  try{ if(phase!=='menu') sessionStorage.setItem('justbowl_resume','1'); sessionStorage.setItem('justbowl_opensettings','1'); }catch(e){}   // skip title + reopen settings on reload
  location.reload(); }  // rebuild the scene with perf settings (game resumes from session)
// persist selections
function saveSettings(){ try{ localStorage.setItem('flickbowling',JSON.stringify({ball:settings.ball,theme:settings.theme,bumpers:settings.bumpers,cosmic:settings.cosmic,muted:settings.muted,optimized:settings.optimized,_ballBefore:settings._ballBefore})); }catch(e){} }
function loadSettings(){ try{ Object.assign(settings, JSON.parse(localStorage.getItem('flickbowling')||'{}')); }catch(e){} }
function highlightBall(){ document.querySelectorAll('#ballGrid .tile').forEach(t=>t.classList.toggle('selected',t.dataset.key===settings.ball)); }
function highlightTheme(){ document.querySelectorAll('#muralGrid .tile').forEach(t=>t.classList.toggle('selected',t.dataset.key===settings.theme)); }
// center each horizontal strip on its currently-selected tile (call after the modal is visible)
function scrollToSelections(){
  for(const id of ['ballGrid','muralGrid']){
    const c=document.getElementById(id); if(!c) continue;
    const sel=c.querySelector('.tile.selected'); if(!sel) continue;
    const cr=c.getBoundingClientRect(), sr=sel.getBoundingClientRect();
    c.scrollLeft += (sr.left-cr.left) - (c.clientWidth-sel.offsetWidth)/2;
  }
}
function setupSettings(){
  loadSettings();
  settings.cosmic = !!themeById(settings.theme).cosmic;                                 // cosmic is now a theme
  settings.mural  = settings.cosmic ? 'cosmic.png' : themeById(settings.theme).mural;   // keep mural in sync with theme
  const bg=document.getElementById('ballGrid'), mg=document.getElementById('muralGrid');
  for(const b of BALL_TEXTURES){
    const t=document.createElement('div'); t.className='tile'+(b.glow?' glowtile':''); t.dataset.key=b.id;
    t.innerHTML=`<div class="thumb sphere" style="background-image:url('${TEX+b.file}')"></div><div class="label">${b.label}</div>`;
    t.addEventListener('click',()=>{ applyBall(b.id); highlightBall(); }); bg.appendChild(t);
  }
  for(const th of THEMES){
    const t=document.createElement('div'); t.className='tile mtile'; t.dataset.key=th.id;
    t.innerHTML=`<img class="thumb" src="${IMG+th.mural}" alt=""><div class="label">${th.label}</div>`;
    t.addEventListener('click',()=>{ applyTheme(th.id); highlightTheme(); }); mg.appendChild(t);
  }
  highlightBall(); highlightTheme();
  // mute switch (mirrors the cog on the right); restore saved state
  _muted=!!settings.muted;
  const muteBtn=document.getElementById('mute');
  muteBtn.innerHTML=muteIcon(_muted); muteBtn.title=_muted?'Unmute':'Mute';
  muteBtn.addEventListener('click',()=>applyMute(!_muted));
  // sit the cog + mute just below the score bar, aligned at the same height
  const placeCtrls=()=>{ document.getElementById('cog').style.top='6vh'; muteBtn.style.top='6vh'; };
  placeCtrls(); window.addEventListener('resize',placeCtrls);
  const modal=document.getElementById('settings');
  document.getElementById('cog').addEventListener('click',()=>{ modal.classList.add('open'); requestAnimationFrame(scrollToSelections); });
  document.getElementById('settingsClose').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('open'); });   // click backdrop to close
  const bumpBtn=document.getElementById('setBumpers');
  const optBtn=document.getElementById('setOpt');
  function refreshToggles(){
    bumpBtn.classList.toggle('on',settings.bumpers); bumpBtn.textContent='Bumpers: '+(settings.bumpers?'On':'Off');
    optBtn.classList.toggle('on',settings.optimized); optBtn.textContent='Low graphics: '+(settings.optimized?'On':'Off');
  }
  refreshToggles();
  bumpBtn.addEventListener('click',()=>{ setBumpers(!settings.bumpers); refreshToggles(); });
  optBtn.addEventListener('click',()=>{ setOptimized(!settings.optimized); refreshToggles(); });
  // free-cam is still available for debugging via the F key (toggleFreecam)
  document.getElementById('newGameBtn').addEventListener('click',()=>{
    clearGame(); getAC(); initSfx(); newGame(); phase='aim';
    document.getElementById('ov').classList.remove('show');   // dismiss the title overlay
    modal.classList.remove('open');
  });
}

document.getElementById('startbtn').addEventListener('click',()=>{
  document.getElementById('ov').classList.remove('show');
  getAC(); initSfx(); resize();
  if(phase==='over') newGame();     // PLAY AGAIN → fresh game
  phase='aim';                       // begin play (state was set up on load)
});
buildBoard();
setupSettings();
// build the scene, set up the game state (resume this session's game if any), then start rendering
initScene(); bindInput();
const sg=loadGame();
if(sg && Array.isArray(sg.rolls) && (sg.frame|0)<10) resumeGame(sg); else newGame();
phase='menu';                        // gate input until START (overlay shown over the lanes)
// if we just reloaded to apply a settings change, skip the title and drop straight back into play
if(sessionStorage.getItem('justbowl_resume')){ sessionStorage.removeItem('justbowl_resume');
  document.getElementById('ov').classList.remove('show'); phase='aim'; }
if(sessionStorage.getItem('justbowl_opensettings')){ sessionStorage.removeItem('justbowl_opensettings');
  document.getElementById('settings').classList.add('open'); requestAnimationFrame(scrollToSelections); }   // reopen settings after a low-graphics reload
requestAnimationFrame(t=>{lastT=t;loop(t);});
</script>
