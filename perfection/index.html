<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Perfection</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100dvw;height:100dvh;
  background:#12101e;
  font-family:'Segoe UI',Arial,sans-serif;
  user-select:none;-webkit-user-select:none;
  touch-action:none;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
}
#hud{
  width:100%;flex-shrink:0;
  background:rgba(0,0,0,.85);
  display:flex;align-items:center;gap:10px;
  padding:5px 12px;
}
#tbar-wrap{
  flex:1;height:11px;background:#222;border-radius:6px;overflow:hidden;
  border:1px solid #333;
}
#tbar{height:100%;width:100%;border-radius:6px;transition:background .4s;}
.stat{color:#fff;font-size:clamp(.75rem,2vw,.9rem);white-space:nowrap}
.stat b{color:#ff0;margin-left:2px}
canvas{display:block;flex-shrink:0;cursor:pointer;}
/* Overlay */
#ov{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,8,20,.88);color:#ff0;gap:10px;text-align:center;
  pointer-events:none;opacity:0;transition:opacity .25s;
}
#ov.show{opacity:1;pointer-events:auto}
#ov h2{font-size:clamp(1.4rem,5vw,2.2rem);letter-spacing:3px;text-shadow:0 0 18px #fa0}
#ov p{color:#ccc;font-size:clamp(.8rem,2vw,1rem);line-height:1.5;max-width:340px;}
#diffrow{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap;justify-content:center;}
#diffrow button{
  padding:5px 13px;border:1.5px solid #444;border-radius:5px;
  background:#1c1c2e;color:#aaa;cursor:pointer;font-size:.82rem;
  transition:all .12s;
}
#diffrow button.active{border-color:#ff0;color:#ff0;background:#2a2a10;}
#diffrow button:hover{border-color:#888;}
#startbtn{
  margin-top:4px;padding:10px 32px;
  background:#ff0;color:#12101e;
  border:none;border-radius:7px;
  font-size:clamp(.9rem,2.5vw,1.15rem);font-weight:700;cursor:pointer;
}
#startbtn:hover{background:#ffd000;}
</style>
</head>
<body>

<div id="hud">
  <span class="stat">⏱<b id="hTime">60</b>s</span>
  <div id="tbar-wrap"><div id="tbar" style="background:#0f0"></div></div>
  <span class="stat"><b id="hDone">0</b>/25 placed</span>
</div>
<canvas id="gc"></canvas>

<div id="ov" class="show">
  <h2 id="ovTitle">PERFECTION</h2>
  <p id="ovMsg">Match every piece to its hole<br>before the timer runs out!</p>
  <div id="diffrow">
    <button class="active" onclick="setDiff(0)">Normal · 60s</button>
    <button onclick="setDiff(1)">Hard · 45s</button>
    <button onclick="setDiff(2)">Expert · 30s</button>
  </div>
  <button id="startbtn" onclick="startGame()">START</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  SHAPES
// ═══════════════════════════════════════════════════════
const SID=[
  'circle','oval','semicircle','quarter','crescent',
  'square','roundsquare','rectangle','diamond','trapezoid',
  'parallelogram','zshape','triangle','rtriangle','chevron',
  'pentagon','hexagon','octagon','star4','star6',
  'cross','xstar','tshape','lshape','arrowR'
];

const SCOL=[
  '#FF4040','#FF8800','#FFD000','#AACC00','#22CC55',
  '#00BBAA','#0099FF','#5566FF','#9944FF','#CC44FF',
  '#FF44AA','#FF5533','#FF2277','#CCAA00','#44BB44',
  '#2299CC','#AA44CC','#FF9900','#00AABB','#CC5500',
  '#FF6600','#88CC00','#00CCBB','#8844EE','#FF3366',
];
const YELLOW='#FFCC00';
function col(){ return YELLOW; }

// Fill current path with a 3-D plastic look: radial gradient + specular blob
function fillPiece3D(ctx, sz, alpha){
  if(alpha===undefined) alpha=1;
  const r=sz*0.37;
  // Radial gradient: bright top-left → base yellow → deep shadow
  const g=ctx.createRadialGradient(-r*.32,-r*.42,r*.04, r*.18,r*.22,r*1.55);
  g.addColorStop(0,   '#FFF8D0');   // specular centre
  g.addColorStop(0.18,'#FFD700');   // bright yellow
  g.addColorStop(0.6, '#C89600');   // mid shadow
  g.addColorStop(1,   '#6B4000');   // deep shadow edge
  ctx.globalAlpha=alpha;
  ctx.fillStyle=g;
  ctx.fill();
  // Specular highlight blob
  const s=ctx.createRadialGradient(-r*.28,-r*.40,0, -r*.28,-r*.40,r*.54);
  s.addColorStop(0,  'rgba(255,255,255,.72)');
  s.addColorStop(.42,'rgba(255,255,255,.16)');
  s.addColorStop(1,  'rgba(255,255,255,0)');
  ctx.fillStyle=s;
  ctx.fill();
  ctx.globalAlpha=1;
}

// Draw shape path centered at 0,0 for a cell of given size
function shapePath(ctx,id,sz){
  const r=sz*0.37;
  ctx.beginPath();
  switch(id){
    // ── Round shapes ──────────────────────────────────────
    case 'circle':
      ctx.arc(0,0,r,0,Math.PI*2); break;
    case 'oval':
      ctx.ellipse(0,0,r*1.22,r*0.72,0,0,Math.PI*2); break;
    case 'semicircle':
      ctx.arc(0,r*0.12,r*0.96,Math.PI,0,false); ctx.closePath(); break;
    case 'quarter':{
      const qr=r*1.18, qx=-qr*.2, qy=qr*.2;
      ctx.moveTo(qx,qy); ctx.arc(qx,qy,qr,-Math.PI/2,0,false); ctx.closePath(); break;}
    case 'crescent':{
      const ca=Math.PI*.36;
      ctx.arc(0,0,r, ca,-ca,false);
      ctx.arc(0,0,r*.48,-ca, ca,false);
      ctx.closePath(); break;}
    // ── Quadrilaterals ────────────────────────────────────
    case 'square':{
      const h=r*0.9; ctx.rect(-h,-h,h*2,h*2); break;}
    case 'roundsquare':{
      const s=r*.88,cr=r*.36;
      ctx.moveTo(-s+cr,-s); ctx.lineTo(s-cr,-s); ctx.arcTo(s,-s,s,-s+cr,cr);
      ctx.lineTo(s,s-cr);   ctx.arcTo(s,s,s-cr,s,cr);
      ctx.lineTo(-s+cr,s);  ctx.arcTo(-s,s,-s,s-cr,cr);
      ctx.lineTo(-s,-s+cr); ctx.arcTo(-s,-s,-s+cr,-s,cr);
      ctx.closePath(); break;}
    case 'rectangle':{
      const rw=r*1.2,rh=r*.66; ctx.rect(-rw,-rh,rw*2,rh*2); break;}
    case 'diamond':
      ctx.moveTo(0,-r*1.2); ctx.lineTo(r*.72,0);
      ctx.lineTo(0,r*1.2);  ctx.lineTo(-r*.72,0); ctx.closePath(); break;
    case 'trapezoid':
      ctx.moveTo(-r*.52,-r*.72); ctx.lineTo(r*.52,-r*.72);
      ctx.lineTo(r*.95,r*.72);   ctx.lineTo(-r*.95,r*.72); ctx.closePath(); break;
    case 'parallelogram':
      ctx.moveTo(-r*.22,-r*.72); ctx.lineTo(r*.78,-r*.72);
      ctx.lineTo(r*.22,r*.72);   ctx.lineTo(-r*.78,r*.72); ctx.closePath(); break;
    case 'zshape':{
      const sz=r*.52;
      ctx.moveTo(-sz*1.5,-sz); ctx.lineTo(sz*.5,-sz);
      ctx.lineTo(sz*.5,0);     ctx.lineTo(sz*1.5,0);
      ctx.lineTo(sz*1.5,sz);   ctx.lineTo(-sz*.5,sz);
      ctx.lineTo(-sz*.5,0);    ctx.lineTo(-sz*1.5,0);
      ctx.closePath(); break;}
    // ── Triangles & chevron ───────────────────────────────
    case 'triangle':
      ctx.moveTo(0,-r*1.1); ctx.lineTo(r*.96,r*.55); ctx.lineTo(-r*.96,r*.55);
      ctx.closePath(); break;
    case 'rtriangle':
      ctx.moveTo(-r*.9,-r*.9); ctx.lineTo(r*.9,r*.9); ctx.lineTo(-r*.9,r*.9);
      ctx.closePath(); break;
    case 'chevron':
      ctx.moveTo(-r,   -r*.22); ctx.lineTo(0, r*.88); ctx.lineTo(r,-r*.22);
      ctx.lineTo(r*.58,-r*.22); ctx.lineTo(0, r*.22); ctx.lineTo(-r*.58,-r*.22);
      ctx.closePath(); break;
    // ── Polygons ──────────────────────────────────────────
    case 'pentagon':
      for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
      ctx.closePath(); break;
    case 'hexagon':
      for(let i=0;i<6;i++){const a=i*Math.PI/3;
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
      ctx.closePath(); break;
    case 'octagon':
      for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
      ctx.closePath(); break;
    // ── Stars ─────────────────────────────────────────────
    case 'star4':
      for(let i=0;i<4;i++){const a=-Math.PI/2+i*Math.PI/2,b=a+Math.PI/4;
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
        ctx.lineTo(Math.cos(b)*r*.22,Math.sin(b)*r*.22);}
      ctx.closePath(); break;
    case 'star6':
      for(let i=0;i<12;i++){const a=i*Math.PI/6-Math.PI/2,rad=i%2===0?r:r*.45;
        i===0?ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);}
      ctx.closePath(); break;
    // ── Cross shapes ──────────────────────────────────────
    case 'cross':{
      const t=r*.32,l=r*.9;
      ctx.moveTo(-t,-l);ctx.lineTo(t,-l);ctx.lineTo(t,-t);ctx.lineTo(l,-t);
      ctx.lineTo(l,t);ctx.lineTo(t,t);ctx.lineTo(t,l);ctx.lineTo(-t,l);
      ctx.lineTo(-t,t);ctx.lineTo(-l,t);ctx.lineTo(-l,-t);ctx.lineTo(-t,-t);
      ctx.closePath(); break;}
    case 'xstar':{
      const t=r*.32,l=r*.9,c=Math.cos(Math.PI/4),s=Math.sin(Math.PI/4);
      const pts=[[-t,-l],[t,-l],[t,-t],[l,-t],[l,t],[t,t],[t,l],[-t,l],[-t,t],[-l,t],[-l,-t],[-t,-t]];
      ctx.moveTo(pts[0][0]*c-pts[0][1]*s,pts[0][0]*s+pts[0][1]*c);
      for(let i=1;i<12;i++) ctx.lineTo(pts[i][0]*c-pts[i][1]*s,pts[i][0]*s+pts[i][1]*c);
      ctx.closePath(); break;}
    case 'tshape':{
      const t=r*.34,w=r,h=r*.86;
      ctx.moveTo(-w,-h);ctx.lineTo(w,-h);ctx.lineTo(w,-h+t*2);ctx.lineTo(t,-h+t*2);
      ctx.lineTo(t,h);ctx.lineTo(-t,h);ctx.lineTo(-t,-h+t*2);ctx.lineTo(-w,-h+t*2);
      ctx.closePath(); break;}
    case 'lshape':{
      const t=r*.36,w=r*.9,h=r;
      ctx.moveTo(-t,-h);ctx.lineTo(t,-h);ctx.lineTo(t,h-t*2);
      ctx.lineTo(w,h-t*2);ctx.lineTo(w,h);ctx.lineTo(-t,h);
      ctx.closePath(); break;}
    case 'arrowR':
      ctx.moveTo(-r*.9,-r*.36);ctx.lineTo(r*.18,-r*.36);ctx.lineTo(r*.18,-r*.82);
      ctx.lineTo(r*.95,0);ctx.lineTo(r*.18,r*.82);ctx.lineTo(r*.18,r*.36);
      ctx.lineTo(-r*.9,r*.36);ctx.closePath(); break;
  }
}

// ═══════════════════════════════════════════════════════
//  CONSTANTS & STATE
// ═══════════════════════════════════════════════════════
const NCOLS=5, NROWS=5, NSHAPES=25;
let CELL=80;        // board/tray cell size in px

// ═══════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════
let _ac=null, _tickInterval=null;
function getAC(){
  if(!_ac) _ac=new(window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==='suspended') _ac.resume();
  return _ac;
}

// Lookahead scheduler — immune to setInterval jitter.
// The JS timer fires every 25ms just to check; actual audio is
// pre-scheduled on the AudioContext's sample-accurate clock.
const TICK_INTERVAL=0.5;   // seconds between ticks
const TICK_LOOKAHEAD=0.12; // schedule this far ahead (s)
const TICK_SCHED_MS=25;    // how often the scheduler polls (ms)
let _nextTickTime=0;

function _scheduleTick(t){
  try{
    const ac=getAC();
    const len=Math.floor(ac.sampleRate*0.012);
    const buf=ac.createBuffer(1,len,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=ac.createBufferSource(); src.buffer=buf;
    const bp=ac.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=3200; bp.Q.value=1.8;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.9,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.012);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(t); src.stop(t+0.015);
  }catch(e){}
}

function _tickScheduler(){
  try{
    const ac=getAC();
    while(_nextTickTime < ac.currentTime+TICK_LOOKAHEAD){
      _scheduleTick(_nextTickTime);
      _nextTickTime+=TICK_INTERVAL;
    }
  }catch(e){}
}

function startTick(){
  stopTick();
  _nextTickTime=getAC().currentTime+0.1;
  _tickInterval=setInterval(_tickScheduler,TICK_SCHED_MS);
}

function stopTick(){
  if(_tickInterval){ clearInterval(_tickInterval); _tickInterval=null; }
}

function playPop(){
  try{
    const ac=getAC(), t=ac.currentTime;

    // ── Distortion waveshaper (shared) ──────────────────
    const ws=ac.createWaveShaper();
    const curve=new Float32Array(512);
    for(let i=0;i<512;i++){
      const x=i*2/512-1;
      curve[i]=((Math.PI+200)*x)/(Math.PI+200*Math.abs(x));
    }
    ws.curve=curve; ws.oversample='4x';
    ws.connect(ac.destination);

    // ── Sharp initial crack (short highpass noise) ──────
    const crBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.06),ac.sampleRate);
    const crData=crBuf.getChannelData(0);
    for(let i=0;i<crData.length;i++) crData[i]=(Math.random()*2-1)*(1-i/crData.length);
    const cr=ac.createBufferSource(); cr.buffer=crBuf;
    const hpf=ac.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.value=1800;
    const crG=ac.createGain();
    crG.gain.setValueAtTime(5,t);
    crG.gain.exponentialRampToValueAtTime(.001,t+.06);
    cr.connect(hpf); hpf.connect(crG); crG.connect(ws);
    cr.start(t); cr.stop(t+.06);

    // ── Noise body (lowpass, decaying) ──────────────────
    const nBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.55),ac.sampleRate);
    const nData=nBuf.getChannelData(0);
    for(let i=0;i<nData.length;i++) nData[i]=Math.random()*2-1;
    const ns=ac.createBufferSource(); ns.buffer=nBuf;
    const lpf=ac.createBiquadFilter(); lpf.type='lowpass';
    lpf.frequency.setValueAtTime(2800,t);
    lpf.frequency.exponentialRampToValueAtTime(180,t+.5);
    const nG=ac.createGain();
    nG.gain.setValueAtTime(2.8,t);
    nG.gain.exponentialRampToValueAtTime(.001,t+.5);
    ns.connect(lpf); lpf.connect(nG); nG.connect(ws);
    ns.start(t); ns.stop(t+.55);

    // ── Low thump (pitch-dropping sine) ─────────────────
    const osc=ac.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(110,t);
    osc.frequency.exponentialRampToValueAtTime(22,t+.28);
    const oG=ac.createGain();
    oG.gain.setValueAtTime(4,t);
    oG.gain.exponentialRampToValueAtTime(.001,t+.3);
    osc.connect(oG); oG.connect(ac.destination); // thump direct (no distort)
    osc.start(t); osc.stop(t+.35);

    // Disconnect the waveshaper once all sources have ended —
    // iOS Safari generates noise from orphaned connected nodes
    setTimeout(()=>{
      try{ ws.disconnect(); crG.disconnect(); nG.disconnect(); }catch(e){}
    }, 700);

  }catch(e){}
}
let BX,BY,TX,TY;   // board origin, tray origin
let portrait=false;

const TIMELIMITS=[60,45,30];
let diff=0, timeLimit=60;

let holes, pieces;  // game objects
let selected=-1;    // index into pieces[]
let timer=0, placed=0;
let phase='menu';   // menu|playing|popping|win|lose
let popParts=[];    // flying pieces during pop
let flashHole=-1, flashT=0; // wrong-placement feedback
let lastT=0;

const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');

// ═══════════════════════════════════════════════════════
//  LAYOUT
// ═══════════════════════════════════════════════════════
function resize(){
  const hudH=document.getElementById('hud').offsetHeight||40;
  const aw=window.innerWidth, ah=window.innerHeight-hudH;
  canvas.width=aw; canvas.height=ah;
  portrait=aw<ah;

  if(portrait){
    // Board top, tray bottom — each panel stacks vertically
    // Total vertical: NROWS*CELL + gap + NROWS*CELL = (2*NROWS+0.4)*CELL
    CELL=Math.max(28,Math.min(88,Math.floor(aw/NCOLS),Math.floor(ah/(NROWS*2+0.4))));
    const totalH=NROWS*CELL*2+Math.floor(CELL*0.4);
    const oy=Math.floor((ah-totalH)/2);
    BX=Math.floor((aw-NCOLS*CELL)/2); BY=oy;
    TX=BX; TY=oy+NROWS*CELL+Math.floor(CELL*0.4);
  } else {
    // Board left, tray right — side by side
    CELL=Math.max(28,Math.min(88,Math.floor(ah/NROWS),Math.floor(aw/10.4)));
    const totalW=NCOLS*CELL*2+Math.floor(CELL*0.4);
    const ox=Math.floor((aw-totalW)/2);
    BX=ox; BY=Math.floor((ah-NROWS*CELL)/2);
    TX=ox+NCOLS*CELL+Math.floor(CELL*0.4); TY=BY;
  }
}

// ═══════════════════════════════════════════════════════
//  GENERATE
// ═══════════════════════════════════════════════════════
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
}

function generateGame(){
  const hi=[...Array(NSHAPES).keys()]; shuffle(hi);
  holes=hi.map((si,i)=>({si,col:i%NCOLS,row:Math.floor(i/NCOLS),filled:false}));

  const pi=[...Array(NSHAPES).keys()]; shuffle(pi);
  pieces=pi.map((si,tp)=>({si,tp,placed:false}));

  selected=-1; placed=0;
  timer=timeLimit; flashHole=-1;
  popParts=[];
}

// ═══════════════════════════════════════════════════════
//  CENTRES (pixel coords of cell centre)
// ═══════════════════════════════════════════════════════
function hc(h){return {x:BX+(h.col+.5)*CELL, y:BY+(h.row+.5)*CELL};}
function pc(p){return {x:TX+(p.tp%NCOLS+.5)*CELL, y:TY+(Math.floor(p.tp/NCOLS)+.5)*CELL};}

// ═══════════════════════════════════════════════════════
//  HIT TESTING
// ═══════════════════════════════════════════════════════
function hitHole(x,y){
  for(let i=0;i<holes.length;i++){
    const c=hc(holes[i]);
    if(Math.abs(x-c.x)<CELL*.5&&Math.abs(y-c.y)<CELL*.5) return i;
  }
  return -1;
}
function hitPiece(x,y){
  for(let i=0;i<pieces.length;i++){
    if(pieces[i].placed) continue;
    const c=pc(pieces[i]);
    if(Math.abs(x-c.x)<CELL*.5&&Math.abs(y-c.y)<CELL*.5) return i;
  }
  return -1;
}

// ═══════════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════════
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function drawHole(h,i){
  const{x,y}=hc(h);
  ctx.save(); ctx.translate(x,y);
  const flash=(i===flashHole&&flashT>0);
  const rcl=CELL*.44, rad=CELL*.06;

  // ── Well background (recessed gradient) ────────────
  if(flash){
    ctx.fillStyle='#3a0808';
  } else {
    const bg=ctx.createLinearGradient(-rcl,-rcl,rcl,rcl);
    bg.addColorStop(0,  '#1e1e32');   // lighter top-left (ambient)
    bg.addColorStop(.5, '#0c0c1c');
    bg.addColorStop(1,  '#030306');   // deep shadow bottom-right
    ctx.fillStyle=bg;
  }
  rrect(-rcl,-rcl,rcl*2,rcl*2,rad);
  ctx.fill();

  // ── Bevel rim: shadow bottom-right, highlight top-left ─
  ctx.lineWidth=1.5;
  ctx.save(); ctx.translate(1,1);
  ctx.strokeStyle=flash?'#880000':'rgba(0,0,0,.75)';
  rrect(-rcl,-rcl,rcl*2,rcl*2,rad); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(-0.6,-0.6);
  ctx.strokeStyle=flash?'#ff6666':'rgba(255,255,255,.16)';
  rrect(-rcl,-rcl,rcl*2,rcl*2,rad); ctx.stroke();
  ctx.restore();

  if(h.filled){
    // Piece snapped in: 3-D gradient, slightly dimmed
    shapePath(ctx,SID[h.si],CELL*0.88);
    fillPiece3D(ctx,CELL*0.88,0.82);
    // Check mark
    ctx.strokeStyle='rgba(255,255,255,.5)';
    ctx.lineWidth=CELL*.05;
    ctx.beginPath();
    ctx.moveTo(-CELL*.12,CELL*.04);
    ctx.lineTo(-CELL*.02,CELL*.14);
    ctx.lineTo(CELL*.15,-CELL*.1);
    ctx.stroke();
  } else {
    // Empty — ghost outline
    shapePath(ctx,SID[h.si],CELL*0.82);
    ctx.fillStyle=col()+'18';
    ctx.fill();
    ctx.strokeStyle=col()+(flash?'cc':'44');
    ctx.lineWidth=flash?2:1.2;
    ctx.stroke();
  }

  ctx.restore();
}

function drawPiece(p,i){
  if(p.placed) return;
  const{x,y}=pc(p);
  const isSel=(i===selected);
  ctx.save(); ctx.translate(x,y);
  const rcl=CELL*.44, rad=CELL*.06;

  // Slot background — subtle gradient for depth
  const sb=ctx.createLinearGradient(-rcl,-rcl,rcl,rcl);
  sb.addColorStop(0, isSel?'#363620':'#1e1e2e');
  sb.addColorStop(1, isSel?'#1a1a10':'#0e0e18');
  ctx.fillStyle=sb;
  rrect(-rcl,-rcl,rcl*2,rcl*2,rad); ctx.fill();

  // Bevel rim
  ctx.lineWidth=1.5;
  ctx.save(); ctx.translate(0.8,0.8);
  ctx.strokeStyle='rgba(0,0,0,.6)';
  rrect(-rcl,-rcl,rcl*2,rcl*2,rad); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(-0.4,-0.4);
  ctx.strokeStyle='rgba(255,255,255,.14)';
  rrect(-rcl,-rcl,rcl*2,rcl*2,rad); ctx.stroke();
  ctx.restore();

  // Drop shadow on piece
  ctx.shadowColor='rgba(0,0,0,.55)';
  ctx.shadowBlur=isSel?16:7;
  ctx.shadowOffsetX=isSel?0:2;
  ctx.shadowOffsetY=isSel?0:4;

  // Piece body — 3D gradient + specular
  shapePath(ctx,SID[p.si],CELL*.82);
  ctx.shadowColor='transparent';
  fillPiece3D(ctx,CELL*.82);

  if(isSel){
    const pulse=0.7+0.3*Math.sin(Date.now()*.006);
    ctx.strokeStyle=`rgba(255,255,180,${pulse})`;
    ctx.lineWidth=3;
    shapePath(ctx,SID[p.si],CELL*.9); ctx.stroke();
    ctx.strokeStyle='rgba(255,204,0,.45)';
    ctx.lineWidth=7;
    shapePath(ctx,SID[p.si],CELL*.9); ctx.stroke();
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  MAIN DRAW
// ═══════════════════════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(phase==='menu') return;

  const bw=NCOLS*CELL, bh=NROWS*CELL;

  // ── Board panel ─────────────────────────────────────
  ctx.fillStyle='#0a0a18';
  rrect(BX-8,BY-8,bw+16,bh+16,10);
  ctx.fill();
  ctx.strokeStyle='#2a2a44';
  ctx.lineWidth=1.5;
  rrect(BX-8,BY-8,bw+16,bh+16,10);
  ctx.stroke();
  ctx.fillStyle='#33334a';
  ctx.font=`${CELL*.14}px sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('BOARD',BX+bw*.5,BY-10);

  // Holes
  for(let i=0;i<holes.length;i++) drawHole(holes[i],i);

  // ── Tray panel ──────────────────────────────────────
  ctx.fillStyle='#0a0a18';
  rrect(TX-8,TY-8,bw+16,bh+16,10);
  ctx.fill();
  ctx.strokeStyle='#2a2a44';
  ctx.lineWidth=1.5;
  rrect(TX-8,TY-8,bw+16,bh+16,10);
  ctx.stroke();
  ctx.fillStyle='#33334a';
  ctx.fillText('PIECES',TX+bw*.5,TY-10);

  // Pieces
  for(let i=0;i<pieces.length;i++) drawPiece(pieces[i],i);

  // Hovering a hole while a piece is selected: highlight matching/wrong
  if(selected>=0&&hoverHole>=0&&!holes[hoverHole].filled){
    const{x,y}=hc(holes[hoverHole]);
    const match=pieces[selected].si===holes[hoverHole].si;
    ctx.save(); ctx.translate(x,y);
    ctx.strokeStyle=match?'rgba(80,255,80,.7)':'rgba(255,80,80,.5)';
    ctx.lineWidth=3;
    rrect(-CELL*.44,-CELL*.44,CELL*.88,CELL*.88,CELL*.06);
    ctx.stroke();
    ctx.restore();
  }

  // ── Pop particles ────────────────────────────────────
  for(const pp of popParts){
    ctx.save();
    ctx.translate(pp.x,pp.y);
    ctx.rotate(pp.angle);
    shapePath(ctx,SID[pp.si],CELL*.75);
    fillPiece3D(ctx,CELL*.75,Math.min(1,Math.max(0,pp.life)));
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════
let hoverHole=-1;

function update(dt){
  timer=Math.max(0,timer-dt);
  if(flashT>0) flashT-=dt;

  // Update HUD
  document.getElementById('hTime').textContent=Math.ceil(timer);
  document.getElementById('hDone').textContent=placed;
  const frac=timer/timeLimit;
  document.getElementById('tbar').style.width=(frac*100)+'%';
  document.getElementById('tbar').style.background=
    frac>0.5?'#0f0':frac>0.25?'#fa0':'#f44';

  if(timer<=0) triggerPop();
}

function updatePop(dt){
  for(const pp of popParts){
    pp.x+=pp.vx*dt; pp.y+=pp.vy*dt;
    pp.vy+=380*dt;  // gravity
    pp.vx*=0.995;
    pp.angle+=pp.spin*dt;
    pp.life-=dt*0.7;
    // Bounce off top so board pieces don't vanish immediately on portrait mobile
    if(pp.y<0){ pp.y=0; pp.vy=Math.abs(pp.vy)*0.7; }
    // Cull once off the sides or bottom
    if(pp.x<-CELL*2||pp.x>canvas.width+CELL*2||pp.y>canvas.height+CELL*2) pp.life=0;
  }
  popParts=popParts.filter(p=>p.life>0);
}

// ═══════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════
function loop(t){
  const dt=Math.min((t-lastT)/1000,.1);
  lastT=t;
  if(phase==='playing') update(dt);
  else if(phase==='popping') updatePop(dt);
  draw();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  POP ANIMATION
// ═══════════════════════════════════════════════════════
function triggerPop(){
  if(phase==='popping'||phase==='lose') return;
  phase='popping';
  stopTick();
  playPop();

  function scatter(x,y,si){
    const spd=380+Math.random()*480;
    const ang=(Math.random()-0.5)*Math.PI*2;
    popParts.push({
      x,y,
      vx:Math.cos(ang)*spd*(0.5+Math.random()),
      vy:Math.sin(ang)*spd-120,
      si,
      angle:Math.random()*Math.PI*2,
      spin:(Math.random()-0.5)*10,
      life:1.4,
    });
  }

  // Scatter unplaced pieces from tray
  for(const p of pieces){
    if(p.placed) continue;
    const c=pc(p);
    scatter(c.x,c.y,p.si);
    p.placed=true;
  }
  // Also scatter already-placed pieces from their holes
  for(const h of holes){
    if(!h.filled) continue;
    const c=hc(h);
    scatter(c.x,c.y,h.si);
    h.filled=false;
  }
  setTimeout(()=>{
    phase='lose';
    document.getElementById('ovTitle').textContent='⏰ TIME\'S UP!';
    document.getElementById('ovMsg').textContent=
      `You placed ${placed} of 25 pieces.`;
    document.getElementById('startbtn').textContent='TRY AGAIN';
    showOv();
  }, 1600);
}

// ═══════════════════════════════════════════════════════
//  CLICK / TOUCH
// ═══════════════════════════════════════════════════════
function getXY(e){
  const rect=canvas.getBoundingClientRect();
  const src=(e.changedTouches&&e.changedTouches[0])||(e.touches&&e.touches[0])||e;
  return {x:src.clientX-rect.left, y:src.clientY-rect.top};
}

canvas.addEventListener('mousemove',e=>{
  if(phase!=='playing') return;
  const{x,y}=getXY(e);
  hoverHole=hitHole(x,y);
});
canvas.addEventListener('mouseleave',()=>{hoverHole=-1;});

canvas.addEventListener('click',e=>{handleInput(getXY(e));});
canvas.addEventListener('touchend',e=>{e.preventDefault();handleInput(getXY(e));},{passive:false});

function handleInput({x,y}){
  if(phase!=='playing') return;

  const hi=hitHole(x,y);
  const pi=hitPiece(x,y);

  if(selected>=0){
    if(hi>=0&&!holes[hi].filled){
      // Try to place
      if(pieces[selected].si===holes[hi].si){
        // ✓ Correct!
        pieces[selected].placed=true;
        holes[hi].filled=true;
        placed++;
        selected=-1;
        if(placed===NSHAPES) winGame();
      } else {
        // ✗ Wrong hole — flash it
        flashHole=hi; flashT=0.5;
        selected=-1;
      }
    } else if(pi>=0&&pi!==selected){
      selected=pi; // switch selection
    } else {
      selected=-1; // deselect
    }
  } else {
    if(pi>=0) selected=pi;
  }
}

// ═══════════════════════════════════════════════════════
//  WIN
// ═══════════════════════════════════════════════════════
function winGame(){
  phase='win';
  stopTick();
  document.getElementById('ovTitle').textContent='🎉 PERFECT!';
  document.getElementById('ovMsg').textContent=
    `All 25 pieces placed with ${Math.ceil(timer)}s to spare!`;
  document.getElementById('startbtn').textContent='PLAY AGAIN';
  showOv();
}

// ═══════════════════════════════════════════════════════
//  GAME MANAGEMENT
// ═══════════════════════════════════════════════════════
function startGame(){
  hideOv();
  getAC();          // unlock AudioContext on user gesture
  generateGame();
  phase='playing';
  startTick();
  resize();
}

function setDiff(d){
  diff=d; timeLimit=TIMELIMITS[d];
  document.querySelectorAll('#diffrow button').forEach((b,i)=>b.classList.toggle('active',i===d));
}

function showOv(){document.getElementById('ov').classList.add('show');}
function hideOv(){document.getElementById('ov').classList.remove('show');}

// ═══════════════════════════════════════════════════════
//  RESIZE & BOOT
// ═══════════════════════════════════════════════════════
window.addEventListener('resize',()=>{resize();});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&selected>=0){selected=-1;}
});

resize();
requestAnimationFrame(t=>{lastT=t;loop(t);});
</script>
