<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100dvw;height:100dvh;background:#08060e;font-family:'Segoe UI',Arial,sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;}
#hud{width:100%;flex-shrink:0;background:rgba(0,0,0,.6);padding:4px 6px;overflow-x:auto;z-index:6;}
#board{display:flex;gap:2px;min-width:min-content;justify-content:center;}
.fr{border:1px solid #3a2d50;border-radius:3px;min-width:46px;background:#151022;}
.fr .fh{font-size:.72rem;text-align:center;color:#a08cc0;border-bottom:1px solid #3a2d50;padding:1px 0;}
.fr .fh small{color:#6f5f8c;margin-left:3px;}
.fr .tot{text-align:center;font-size:1.2rem;font-weight:800;line-height:28px;color:#ffd54a;font-variant-numeric:tabular-nums;}
.fr.ftot{min-width:62px;} .fr.ftot .tot{color:#fff;}
.fr.fbest{min-width:56px;} .fr.fbest .tot{color:#8fe3ff;}
.fr.cur{border-color:#ffd54a;box-shadow:0 0 8px rgba(255,213,74,.4);}
.fr .tot.under{color:#5dff9a;} .fr .tot.over{color:#ff8a6a;} .fr .tot.ace{color:#ff7ad9;}
@media (orientation:portrait){
  #hud{padding-left:0;padding-right:0;}
  #board{width:100vw;gap:1px;}
  .fr{flex:1 1 0;min-width:0;} .fr.ftot{flex:1.3 1 0;} .fr.fbest{flex:1.3 1 0;}
}
@media (max-width:420px){ .fr .fh{font-size:.58rem;} .fr .tot{font-size:.95rem;line-height:22px;} }
#msg{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:clamp(1.3rem,5.5vw,2.3rem);font-weight:800;color:#ffd54a;
  text-shadow:0 2px 14px #000;pointer-events:none;letter-spacing:1px;z-index:5;line-height:1.3;}
#msg small{display:block;font-size:.55em;color:#e8dcff;letter-spacing:2px;}
#celebrate{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:15;pointer-events:none;opacity:0;
  font-weight:900;letter-spacing:5px;font-size:clamp(2.4rem,12vw,6rem);}
#celebrate.show{animation:celebpop 1.8s cubic-bezier(.2,.8,.3,1) forwards;}
#celebrate.gold{color:#ffd54a;text-shadow:0 0 34px rgba(255,170,0,.85),0 5px 0 #9a5600;}
#celebrate.pink{color:#ff7ad9;text-shadow:0 0 34px rgba(255,60,200,.85),0 5px 0 #7a0650;}
#celebrate.green{color:#5dff9a;text-shadow:0 0 30px rgba(40,255,140,.75),0 5px 0 #0a6a30;}
@keyframes celebpop{ 0%{opacity:0;transform:scale(.3) rotate(-9deg);} 14%{opacity:1;transform:scale(1.18) rotate(3deg);} 28%{transform:scale(1) rotate(0);} 72%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(1.12);} }
#stage{flex:1;width:100%;position:relative;cursor:grab;min-height:0;overflow:hidden;}
#stage.aiming{cursor:grabbing;}
#stage canvas{display:block;width:100%;height:100%;}
#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, rgba(6,4,12,.3) 0%, rgba(6,4,12,.75) 100%);gap:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;padding:20px;}
#ov.show{opacity:1;pointer-events:auto;}
#ov h2{font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:2px;color:#ffd54a;text-shadow:0 0 20px rgba(255,170,0,.5);}
#ov p{color:#ddd3ee;font-size:clamp(.82rem,2.4vw,1rem);line-height:1.6;max-width:420px;text-shadow:0 1px 6px #000;}
#ov table{border-collapse:collapse;font-size:.9rem;color:#ddd3ee;}
#ov td,#ov th{border:1px solid #3a2d50;padding:3px 9px;text-align:center;} #ov th{color:#a08cc0;font-weight:600;}
#startbtn{margin-top:6px;padding:11px 34px;background:#ffd54a;color:#181000;border:none;border-radius:8px;
  font-size:clamp(.95rem,2.6vw,1.15rem);font-weight:800;cursor:pointer;letter-spacing:1px;}
#startbtn:hover{background:#ffe27a;}
.iconbtn{position:fixed;top:6vh;z-index:25;border:none;background:none;color:#ddd3ee;display:flex;align-items:center;justify-content:center;
  height:1em;font-size:4em;line-height:1;padding:0;opacity:0.9;cursor:pointer;transition:transform .15s,opacity .15s;}
.iconbtn:hover{opacity:1;}
#cog{left:12px;} #cog:hover{transform:rotate(45deg);}
#mute{right:12px;}
#view{right:12px;}
.iconbtn svg{width:0.8em;height:0.8em;display:block;overflow:visible;
  filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000) drop-shadow(0 0 3px rgba(0,0,0,.55));}
#view.on{color:#ffd54a;}
#settings{position:fixed;inset:0;z-index:26;display:none;align-items:center;justify-content:center;background:rgba(2,2,8,.62);}
#settings.open{display:flex;}
.modal-card{width:min(94vw,480px);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:16px;
  background:rgba(18,14,28,.98);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);}
@media (max-width:520px){ .modal-card{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:none;} }
.app-title{text-align:center;color:#ffd54a;font-size:1.6rem;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px rgba(255,170,0,.45);margin-bottom:-4px;}
.app-title .emoji{text-shadow:none;}
.modal-head{display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{color:#ffd54a;font-size:1.2rem;letter-spacing:1px;}
#settingsClose{background:none;border:none;color:#b7a6d6;font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer;}
#settingsClose:hover{color:#fff;}
.sec-label{color:#b7a6d6;font-size:.8rem;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
.grid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
.picker{display:flex;align-items:center;gap:6px;}
.picker .grid{flex:1 1 auto;min-width:0;}
.grid.scroll{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scroll-snap-type:x mandatory;touch-action:pan-x;}
.grid.scroll .tile{scroll-snap-align:center;}
.navbtn{flex:0 0 auto;width:30px;align-self:stretch;min-height:46px;border:1px solid #3d3058;border-radius:8px;background:#1d1630;color:#ddd3ee;font-size:1.4rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s;}
.navbtn:hover{border-color:#6a5a90;color:#fff;} .navbtn:active{background:#2a2040;}
.tile{flex:0 0 62px;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:6px 4px;text-align:center;background:rgba(255,255,255,.05);transition:background .12s,border-color .12s;}
.tile:hover{background:rgba(255,255,255,.11);}
.tile.selected{border-color:#ffd54a;background:rgba(255,213,74,.14);}
.tile img.ball3d{width:100%;aspect-ratio:1;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));}
.tile .label{font-size:.68rem;color:#ddd3ee;margin-top:5px;}
.toggle{width:100%;padding:11px;border:1px solid #3d3058;border-radius:9px;background:#1d1630;color:#ddd3ee;font-size:.9rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .12s;}
.toggle:hover{border-color:#6a5a90;}
.toggle.on{background:#ffd54a;color:#181000;border-color:#ffd54a;}
.seg{display:flex;border:1px solid #3d3058;border-radius:9px;overflow:hidden;}
.seg label{flex:1;cursor:pointer;}
.seg input{position:absolute;opacity:0;pointer-events:none;}
.seg span{display:block;padding:9px 4px;text-align:center;background:#1d1630;color:#ddd3ee;font-size:.88rem;font-weight:700;border-left:1px solid #3d3058;transition:all .12s;}
.seg label:first-child span{border-left:none;}
.seg span small{display:block;font-size:.68rem;font-weight:600;opacity:.75;}
.seg input:checked+span{background:#ffd54a;color:#181000;}
.stats{display:flex;justify-content:space-around;color:#ddd3ee;font-size:.85rem;}
.stats b{display:block;font-size:1.25rem;color:#ffd54a;text-align:center;}
</style>

<!-- "Having trouble?" hint: shown after 3 scoreless throws in a row (once per visit; can be switched off) -->
<style>
#hintModal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(2,2,8,.55);}
#hintModal.open{display:flex;}
#hintModal .hint-card{width:min(88vw,360px);background:rgba(18,14,28,.98);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px 20px 16px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);text-align:center;color:#ece6f8;font-family:'Segoe UI',Arial,sans-serif;animation:hintpop .25s ease-out;}
@keyframes hintpop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#hintModal h3{color:#ffd54a;font-size:1.25rem;letter-spacing:.5px;margin:0 0 8px;}
#hintModal p{font-size:.95rem;line-height:1.5;margin:0 0 16px;color:#ddd3ee;}
#hintModal .hint-btns{display:flex;gap:10px;justify-content:center;}

#hintModal button.primary{background:#ffd54a;border-color:#ffd54a;color:#181000;}

<div id="hintModal" role="dialog" aria-modal="true" aria-labelledby="hintTitle">
  <div class="hint-card">
    <h3 id="hintTitle">Having trouble?</h3>
    <p id="hintText"></p>
    <div class="hint-btns"><button class="primary" id="hintSettings">Open Settings</button><button id="hintOk">Got it</button></div>
    <label><input type="checkbox" id="hintNever"> Don't show this again</label>
  </div>
</div>
<script>
// missHint: "Having trouble?" tips. note(ok,kind,need,text) — `need` misses in a row of that kind shows `text`;
// count(kind,need,text) — shows after `need` occurrences (not necessarily in a row). Each tip shows once per visit.
window.missHint=(function(){
  let key='hint', defText='', runs={}, shown={};
  const el=()=>document.getElementById('hintModal'), off=()=>{ try{ return localStorage.getItem(key+'_hint_off')==='1'; }catch(e){ return false; } };
  function close(){ const m=el(); if(!m) return; if(document.getElementById('hintNever').checked){ try{ localStorage.setItem(key+'_hint_off','1'); }catch(e){} } m.classList.remove('open'); }
  function show(kind,text){ if(shown[kind]||off()) return; shown[kind]=true; setTimeout(()=>{ const m=el(); if(!m||m.classList.contains('open')) return;
    document.getElementById('hintText').innerHTML=text; document.getElementById('hintNever').checked=false; m.classList.add('open'); },900); }
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('hintOk').addEventListener('click',close);
    document.getElementById('hintSettings').addEventListener('click',()=>{ close(); const c=document.getElementById('cog'); if(c) c.click(); });
    el().addEventListener('click',e=>{ if(e.target===el()) close(); });
  });
  return {
    setup(k,t){ key=k; defText=t||''; },
    note(ok,kind,need,text){ kind=kind||'main'; if(ok){ runs[kind]=0; return; } runs[kind]=(runs[kind]||0)+1; if(runs[kind]>=(need||3)) show(kind,text||defText); },
    count(kind,need,text){ runs[kind]=(runs[kind]||0)+1; if(runs[kind]>=need) show(kind,text); },
    reset(kind){ if(kind) runs[kind]=0; else runs={}; },
    isOpen(){ const m=el(); return !!m&&m.classList.contains('open'); },
  };
})();
</script>
<script>missHint.setup('justputt');</script>
<script src="lib/three.min.js"></script>
<script>
let _fatalShown=false;
function showFatal(err){
  try{ console.error(err); }catch(e){}
  if(_fatalShown) return; _fatalShown=true;
  try{ const ov=document.getElementById('ov'); if(ov){ ov.classList.add('show');
    const p=ov.querySelector('p'); if(p) p.textContent='⚠ '+((err&&(err.message||err))+'').slice(0,200); } }catch(e){}
}
window.addEventListener('error',e=>showFatal(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showFatal(e.reason));

let PERF=false, ANISO=4;
const NZ=(function(){
  let s=1337; const rnd=()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; };
  const P=new Uint16Array(512), V=new Float32Array(256), perm=[...Array(256).keys()];
  for(let i=255;i>0;i--){ const j=(rnd()*(i+1))|0; const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  for(let i=0;i<512;i++) P[i]=perm[i&255]; for(let i=0;i<256;i++) V[i]=rnd();
  function n2(x,y,px,py){
    let xi=Math.floor(x), yi=Math.floor(y); const xf=x-xi, yf=y-yi; let x1=xi+1, y1=yi+1;
    if(px){ xi=((xi%px)+px)%px; x1=((x1%px)+px)%px; } if(py){ yi=((yi%py)+py)%py; y1=((y1%py)+py)%py; }
    xi&=255; x1&=255; yi&=255; y1&=255;
    const a=V[P[P[xi]+yi]], b=V[P[P[x1]+yi]], c=V[P[P[xi]+y1]], d=V[P[P[x1]+y1]];
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  }
  function fbm(x,y,oct,px,py){ let sum=0,amp=0.5,norm=0,f=1;
    for(let i=0;i<oct;i++){ sum+=amp*n2(x*f,y*f,px?px*f:0,py?py*f:0); norm+=amp; amp*=0.5; f*=2; } return sum/norm; }
  return {n2,fbm,rnd};
})();
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function toTex(c,o){ o=o||{}; const t=new THREE.CanvasTexture(c);
  if(o.srgb!==false) t.encoding=THREE.sRGBEncoding;
  if(o.repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(o.repeat[0],o.repeat[1]); }
  if(o.offset) t.offset.set(o.offset[0],o.offset[1]);
  t.anisotropy=ANISO; return t; }
// run a per-pixel shader: fn(x,y) → [r,g,b,bump]; returns {color, bump} canvases
function shade(W,H,fn,withBump){
  const c=mkCanvas(W,H), g=c.getContext('2d'), img=g.createImageData(W,H), d=img.data;
  let bc=null,bd=null,bimg=null,bg=null;
  if(withBump){ bc=mkCanvas(W,H); bg=bc.getContext('2d'); bimg=bg.createImageData(W,H); bd=bimg.data; }
  const out=[0,0,0,128];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ fn(x,y,out); const i=(y*W+x)*4;
    d[i]=out[0]; d[i+1]=out[1]; d[i+2]=out[2]; d[i+3]=255;
    if(bd){ bd[i]=bd[i+1]=bd[i+2]=out[3]; bd[i+3]=255; } }
  g.putImageData(img,0,0); if(bg) bg.putImageData(bimg,0,0);
  return {color:c,bump:bc};
}
const mix=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
function oakTex(){
  const W=PERF?512:1024, H=PERF?256:512, LEAF=10.4;   // spans the whole 152"×104" side panel
  const leafTone=[]; for(let i=0;i<12;i++) leafTone.push(0.9+NZ.rnd()*0.18);
  return shade(W,H,(x,y,o)=>{
    const wz=x/W*152, wy=y/H*104, leaf=Math.floor(wy/LEAF), ly=wy-leaf*LEAF, lz=(leaf&1)?152-wz:wz;
    // streaky long grain: high frequency across the leaf, very low along it
    const streak=NZ.fbm(lz*0.018+leaf*11,ly*1.7,4);
    const fine=NZ.n2(lz*0.09+leaf*3,ly*6.5);
    // soft cathedral arches (growth rings cut at a shallow angle)
    const c=ly*0.55+4.5*NZ.fbm(lz*0.01+leaf*5,ly*0.12,3)-0.0016*(lz-70-leaf*13)*(lz-70-leaf*13);
    const f=c*0.9-Math.floor(c*0.9), arch=sstep(0.55,0.9,f)*(1-sstep(0.9,1,f));
    let t=clamp(0.25+streak*0.5+fine*0.18+arch*0.22,0,1);
    const k=leafTone[leaf%12];
    let r=mix(132,74,t)*k, g=mix(86,46,t)*k, b=mix(50,24,t)*k;
    const pore=NZ.n2(lz*0.6+leaf*9,ly*14); if(pore>0.84){ r*=0.85; g*=0.83; b*=0.82; }
    if(ly<0.1||ly>LEAF-0.1){ r*=0.82; g*=0.82; b*=0.82; }        // veneer seam
    o[0]=r; o[1]=g; o[2]=b; o[3]=140-t*60-(pore>0.84?25:0);
  },true);
}

function loopPoint(L,th,out){ return (out||new THREE.Vector3()).set(L.x0+L.shift*th/(2*Math.PI),BASE_Y+hAt(L.x0,L.z0)+L.R*(1-Math.cos(th)),L.z0+L.R*Math.sin(th)); }
function buildLoop(o,add){

  const N=120, W=6.5, pos=[], idx=[], P=V3();
  for(let i=0;i<=N;i++){ const th=i/N*Math.PI*2; loopPoint(LOOP,th,P); const nY=Math.cos(th), nZ=-Math.sin(th);   // inward normal (0,nY,nZ)
    pos.push(P.x-W/2,P.y-nY*0.25,P.z-nZ*0.25, P.x+W/2,P.y-nY*0.25,P.z-nZ*0.25); }
  for(let i=0;i<N;i++){ const a=i*2; idx.push(a,a+2,a+1,a+1,a+2,a+3); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  const track=add(g,M.track); track.userData.occ=false;

    add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),N,0.45,8,false),M.trackRail); }

}
function stepLoop(dt){

//  RENDER LOOP
// ═══════════════════════════════════════════════════════
const _d=new THREE.Vector3(), _ax=new THREE.Vector3(), _prevB=new THREE.Vector3();
let lastT=0;
const onTee=()=>H&&Math.abs(ball.x-H.tee[0])<TEE_W/2&&Math.abs(ball.z-H.tee[1])<TEE_D/2;
const liftAt=(x,z)=>{ for(const L of LIFTS) if(inShape(L,x,z)) return L.h; return 0; };
function syncBall(){
  const h=hAt(ball.x,ball.z)+(onTee()?TEE_T:0)+liftAt(ball.x,ball.z), dc=Math.hypot(ball.x-H.cup[0],ball.z-H.cup[1]), sag=dc<CUP_R?(CUP_R-dc)*0.35:0;
  let y=BASE_Y+h+BALL_R-sag-ball.sink, bx=ball.x, bz=ball.z;
  if(LOOP&&LOOP.active){ const P=loopPoint(LOOP,LOOP.th); bx=P.x; bz=P.z+(-Math.sin(LOOP.th))*BALL_R; y=P.y+Math.cos(LOOP.th)*BALL_R; }
  _d.set(bx,y,bz).add(OFF).sub(ballMesh.position); const dist=_d.length();
  if(dist>1e-5&&dist<20){ _ax.set(_d.z,0,-_d.x); if(_ax.lengthSq()<1e-10) _ax.set(1,0,0); _ax.normalize(); ballMesh.rotateOnWorldAxis(_ax,dist/BALL_R); }
  ballMesh.position.set(bx,y,bz).add(OFF); ballMesh.visible=ball.visible;
  shadowDisc.position.set(ball.x,BASE_Y+h+0.03,ball.z).add(OFF); shadowDisc.visible=ball.visible&&ball.sink<0.5&&!(LOOP&&LOOP.active);
  const hidden=ball.visible&&ball.sink<0.5&&camMode!=='intro'&&ballHidden(V3(camera.position.x-OFF.x,camera.position.y,camera.position.z-OFF.z),BASE_Y+h-BALL_R);
  locator.visible=hidden; if(hidden) locator.position.set(ball.x,y+0.2,ball.z).add(OFF);              // ring shows through whatever hides the ball
  if(phase==='roll'){ const sp=Math.hypot(ball.vx,ball.vz); setRoll(clamp(sp/260,0,0.32),0.75+sp/320); }
}
function loop(t){
  try{
    const dt=Math.min((t-lastT)/1000,0.033); lastT=t; clock+=dt;
    if(renderer&&(lastW<2||lastH<2)) resize();
    if(H){
      const n=Math.max(1,Math.ceil(dt*1000)); for(let k=0;k<n;k++) physStep(dt/n);
      if(BLADES) BLADES.g.rotation.z=BLADES.ang;
      if(SPIN) SPIN.mesh.rotation.z-=SPIN.w*dt;
      for(const A of ANIMS3D){ if(A.tex){ A.tex.offset.x+=A.vx*dt; A.tex.offset.y+=A.vz*dt; } if(A.spin) A.spin.rotation.y+=A.rate*dt; }
      for(const C of CIRCLES) if(C.mesh){ C.flash=Math.max(0,(C.flash||0)-dt); C.mesh.scale.setScalar(1+C.flash*0.8); }
      if(M.pano) M.pano.position.set(camera.position.x,PANO_H/2-PANO_H*(24/1024),camera.position.z);   // tree line sits on the ground
      if(phase==='intro'){ introT+=dt; if(introT>2.4){ phase='aim'; camMode=viewOn?'overview':'aim'; } }
      if(flagCloth){ const p=flagCloth.geometry.attributes.position, b=flagCloth.userData.base; for(let i=0;i<p.count;i++){ const x=b[i*3]; p.setZ(i,Math.sin(clock*3.2+x*0.55)*0.35*(x/11)); } p.needsUpdate=true; }
      stepAnims(dt);
      if(msgT>0){ msgT-=dt; if(msgT<=0) document.getElementById('msg').innerHTML=''; }
      if(renderer){ syncBall(); updateCamera(dt); syncAim(); }
    }
    if(renderer) renderer.render(scene,camera);
  }catch(err){ showFatal(err); }
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════
function saveSettings(){ try{ localStorage.setItem('justputt',JSON.stringify(settings)); }catch(e){} }
function loadSettings(){ try{ Object.assign(settings,JSON.parse(localStorage.getItem('justputt')||'{}')); }catch(e){} if(!BALL_TYPES.some(b=>b.id===settings.ball)) settings.ball='white'; }
function saveStats(){ try{ localStorage.setItem('justputt_stats',JSON.stringify(stats)); }catch(e){} }
function loadStats(){ try{ Object.assign(stats,JSON.parse(localStorage.getItem('justputt_stats')||'{}')); }catch(e){} }
function refreshStats(){ document.getElementById('stBest').textContent=stats.best||'–'; document.getElementById('stGames').textContent=stats.games; document.getElementById('stAces').textContent=stats.aces; document.getElementById('stTix').textContent=stats.tickets; }
function setupSettings(){
  loadSettings(); loadStats();
  const scrollToSel=(grid,sm)=>{ const sel=grid.querySelector('.tile.selected'); if(!sel) return; const cr=grid.getBoundingClientRect(), sr=sel.getBoundingClientRect(); grid.scrollTo({left:grid.scrollLeft+(sr.left-cr.left)-(grid.clientWidth-sel.offsetWidth)/2,behavior:sm?'smooth':'auto'}); };
  document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{
    const tiles=[...document.getElementById(b.dataset.grid).querySelectorAll('.tile')]; let i=tiles.findIndex(t=>t.classList.contains('selected'));
    const ni=clamp((i<0?0:i)+(+b.dataset.dir),0,tiles.length-1); if(ni!==i){ tiles[ni].click(); requestAnimationFrame(()=>scrollToSel(document.getElementById(b.dataset.grid),true)); } }));
  const bg=document.getElementById('ballGrid');
  for(const b of BALL_TYPES){ const t=document.createElement('div'); t.className='tile'; t.dataset.key=b.id;
    t.innerHTML=`<img class="ball3d" alt="" src="${ballThumb(b.id)}"><div class="label">${b.label}</div>`;
    t.addEventListener('click',()=>{ applyBall(b.id); highlightBall(); }); bg.appendChild(t); }
  const highlightBall=()=>document.querySelectorAll('#ballGrid .tile').forEach(t=>t.classList.toggle('selected',t.dataset.key===settings.ball));
  highlightBall();
  _muted=!!settings.muted; const muteBtn=document.getElementById('mute'), viewBtn=document.getElementById('view');
  muteBtn.innerHTML=muteIcon(_muted); muteBtn.title=_muted?'Unmute':'Mute';
  muteBtn.addEventListener('click',()=>{ getAC(); applyMute(!_muted); });
  viewBtn.addEventListener('click',()=>{ viewOn=!viewOn; viewBtn.classList.toggle('on',viewOn); if(phase==='aim'||phase==='intro'){ camMode=viewOn?'overview':'aim'; if(phase==='intro') phase='aim'; } });
  const placeCtrls=()=>{ const hud=document.getElementById('hud'), top=(hud?hud.offsetHeight:0)+10; document.getElementById('cog').style.top=top+'px'; muteBtn.style.top=top+'px'; viewBtn.style.top=(top+muteBtn.offsetHeight+14)+'px'; };
  placeCtrls(); requestAnimationFrame(placeCtrls); window.addEventListener('resize',placeCtrls); window.addEventListener('orientationchange',()=>setTimeout(placeCtrls,120));
  const modal=document.getElementById('settings');
  document.getElementById('cog').addEventListener('click',()=>{ refreshStats(); modal.classList.add('open'); requestAnimationFrame(()=>scrollToSel(bg,false)); });
  document.getElementById('settingsClose').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('open'); });
  const guideBtn=document.getElementById('setGuide'), optBtn=document.getElementById('setOpt');
  const refresh=()=>{ guideBtn.classList.toggle('on',settings.guide); guideBtn.textContent='Aim guide line: '+(settings.guide?'On':'Off');
    optBtn.classList.toggle('on',settings.optimized); optBtn.textContent='Low graphics: '+(settings.optimized?'On':'Off'); };
  refresh();
  guideBtn.addEventListener('click',()=>{ settings.guide=!settings.guide; saveSettings(); refresh(); });
  optBtn.addEventListener('click',()=>{ settings.optimized=!settings.optimized; saveSettings(); try{ sessionStorage.setItem('lowgfxReload','1'); }catch(e){} location.reload(); });
  const sens=[...document.querySelectorAll('input[name="sens"]')], SENS=sens.map(r=>+r.value);
  settings.power=SENS.reduce((a,b)=>Math.abs(b-settings.power)<Math.abs(a-settings.power)?b:a,SENS[0]);
  sens.forEach(r=>{ r.checked=(+r.value===settings.power); r.addEventListener('change',()=>{ if(r.checked){ settings.power=+r.value; saveSettings(); } }); });
  const cr=[...document.querySelectorAll('input[name="course"]')];
  cr.forEach(r=>{ r.checked=(r.value===settings.course); r.addEventListener('change',()=>{ if(r.checked){ settings.course=r.value; saveSettings(); if(phase!=='menu'&&phase!=='over') showMsg('Takes effect next round',1.4); } }); });
  document.getElementById('newGameBtn').addEventListener('click',()=>{ getAC(); initSfx(); modal.classList.remove('open'); document.getElementById('ov').classList.remove('show'); newGame(); });
}
document.getElementById('startbtn').addEventListener('click',()=>{ document.getElementById('ov').classList.remove('show'); getAC(); initSfx(); resize(); newGame(); });
function boot(){
  setupSettings();
  document.querySelector('#ov p').innerHTML='<b>Pull back &amp; release.</b> Drag back anywhere on the screen to aim — the arrow shows direction and power — then let go to putt. Before your first putt, tap the dark tee mat to set your ball where you like.<br>'
    +HOLES.length+' holes, par '+HOLES.reduce((a,h)=>a+h.par,0)+' — or play the front or back nine (Settings) · max '+MAX_STROKES+' strokes a hole. Water costs a stroke. The map button shows the whole hole.';
  initScene(); bindInput();
  H=HOLES[0]; buildHole(); ball.x=H.tee[0]; ball.z=H.tee[1]; phase='menu'; camMode='overview';
  try{ if(sessionStorage.getItem('lowgfxReload')){ sessionStorage.removeItem('lowgfxReload'); document.getElementById('ov').classList.remove('show'); newGame(); document.getElementById('settings').classList.add('open'); } }catch(e){}
  buildHUD();
  requestAnimationFrame(t=>{ lastT=t; loop(t); });
}
try{ boot(); }catch(err){ showFatal(err); }
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
