<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Just Putt</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08060e">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Just Putt">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100dvw;height:100dvh;background:#08060e;font-family:'Segoe UI',Arial,sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;}
#hud{width:100%;flex-shrink:0;background:rgba(0,0,0,.6);padding:4px 6px;overflow-x:auto;z-index:6;}
#board{display:flex;gap:2px;min-width:min-content;justify-content:center;}
.fr{border:1px solid #3a2d50;border-radius:3px;min-width:46px;background:#151022;}
.fr .fh{font-size:.72rem;text-align:center;color:#a08cc0;border-bottom:1px solid #3a2d50;padding:1px 0;}
.fr .fh small{color:#6f5f8c;margin-left:3px;}
.fr .tot{text-align:center;font-size:1.2rem;font-weight:800;line-height:28px;color:#ffd54a;font-variant-numeric:tabular-nums;}
.fr.ftot{min-width:62px;} .fr.ftot .tot{color:#fff;}
.fr.fbest{min-width:56px;} .fr.fbest .tot{color:#8fe3ff;}
.fr.cur{border-color:#ffd54a;box-shadow:0 0 8px rgba(255,213,74,.4);}
.fr .tot.under{color:#5dff9a;} .fr .tot.over{color:#ff8a6a;} .fr .tot.ace{color:#ff7ad9;}
@media (orientation:portrait){
  #hud{padding-left:0;padding-right:0;}
  #board{width:100vw;gap:1px;}
  .fr{flex:1 1 0;min-width:0;} .fr.ftot{flex:1.3 1 0;} .fr.fbest{flex:1.3 1 0;}
}
@media (max-width:420px){ .fr .fh{font-size:.58rem;} .fr .tot{font-size:.95rem;line-height:22px;} }
#msg{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:clamp(1.3rem,5.5vw,2.3rem);font-weight:800;color:#ffd54a;
  text-shadow:0 2px 14px #000;pointer-events:none;letter-spacing:1px;z-index:5;line-height:1.3;}
#msg small{display:block;font-size:.55em;color:#e8dcff;letter-spacing:2px;}
#celebrate{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:15;pointer-events:none;opacity:0;
  font-weight:900;letter-spacing:5px;font-size:clamp(2.4rem,12vw,6rem);}
#celebrate.show{animation:celebpop 1.8s cubic-bezier(.2,.8,.3,1) forwards;}
#celebrate.gold{color:#ffd54a;text-shadow:0 0 34px rgba(255,170,0,.85),0 5px 0 #9a5600;}
#celebrate.pink{color:#ff7ad9;text-shadow:0 0 34px rgba(255,60,200,.85),0 5px 0 #7a0650;}
#celebrate.green{color:#5dff9a;text-shadow:0 0 30px rgba(40,255,140,.75),0 5px 0 #0a6a30;}
@keyframes celebpop{ 0%{opacity:0;transform:scale(.3) rotate(-9deg);} 14%{opacity:1;transform:scale(1.18) rotate(3deg);} 28%{transform:scale(1) rotate(0);} 72%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(1.12);} }
#stage{flex:1;width:100%;position:relative;cursor:grab;min-height:0;overflow:hidden;}
#stage.aiming{cursor:grabbing;}
#stage canvas{display:block;width:100%;height:100%;}
#loader{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(ellipse at center,#1d2a3a 0%,#06040c 100%);transition:opacity .45s;}
#loader.done{opacity:0;pointer-events:none;}
#fps{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:20;display:none;font:600 11px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#eafff0;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:6px;pointer-events:none;white-space:pre;text-align:center;}
#gfxNote{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:35;max-width:86vw;font:600 .85rem 'Segoe UI',Arial,sans-serif;color:#fff;background:rgba(20,14,34,.88);border:1px solid #3d3058;padding:9px 14px;border-radius:9px;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;}
#gfxNote.show{opacity:1;}
#busy{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(6,4,12,.72);opacity:0;pointer-events:none;transition:opacity .2s;}
#busy.show{opacity:1;pointer-events:auto;}
#busy .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd54a;animation:ldspin .8s linear infinite;}
#busy small{color:#e6dcf5;font:600 .8rem 'Segoe UI',Arial,sans-serif;letter-spacing:2px;}
#loader h1{margin:0;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:3px;color:#ffd54a;text-shadow:0 0 24px rgba(255,170,0,.5);font-family:'Segoe UI',Arial,sans-serif;}
#loader .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd54a;animation:ldspin .8s linear infinite;}
#loader small{color:#a99bc6;font:600 .8rem 'Segoe UI',Arial,sans-serif;letter-spacing:2px;}
@keyframes ldspin{to{transform:rotate(360deg)}}
#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, rgba(6,4,12,.3) 0%, rgba(6,4,12,.75) 100%);gap:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;padding:20px;}
#ov.show{opacity:1;pointer-events:auto;}
#ov h2{font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:2px;color:#ffd54a;text-shadow:0 0 20px rgba(255,170,0,.5);}
#ov p{color:#ddd3ee;font-size:clamp(.82rem,2.4vw,1rem);line-height:1.6;max-width:420px;text-shadow:0 1px 6px #000;}
#ov table{border-collapse:collapse;font-size:.9rem;color:#ddd3ee;table-layout:fixed;width:min(92vw,440px);margin:0 auto 6px;}   /* every nine's card is the same grid */
#ov table th:first-child{width:3.4em;}
#ov td,#ov th{border:1px solid #3a2d50;padding:3px 2px;text-align:center;} #ov th{color:#a08cc0;font-weight:600;}
#coursePick{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px;}
#coursePick .cp-label,#histPanel .cp-label{color:#a08cc0;font-size:.78rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
#coursePick .cp-row,#histPanel .cp-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
#coursePick button,#histPanel .cp-row button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:10px 14px;border-radius:9px;border:1px solid #ffd54a;background:rgba(29,22,48,.9);color:#f2ecff;font-weight:800;font-size:.95rem;cursor:pointer;}
#coursePick button small,#histPanel .cp-row button small{font-weight:600;font-size:.68rem;color:#bfb2d8;}
#coursePick .cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(88vw,340px);}
#coursePick .cp-grid .wide{grid-column:1/-1;}
#cpLabel:empty{display:none;}
.mini{padding:8px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:rgba(29,22,48,.9);color:#f2ecff;font-weight:800;cursor:pointer;}
#tour{position:fixed;inset:0;z-index:30;display:none;}
#tour.open{display:block;}
#tour svg{position:absolute;inset:0;width:100%;height:100%;}
.tour-ring{position:absolute;border:2px solid #ffd54a;border-radius:14px;box-shadow:0 0 16px rgba(255,213,74,.7);pointer-events:none;}
#tourCard{position:absolute;box-sizing:border-box;background:rgba(18,14,28,.98);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 16px 12px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);color:#ece6f8;font-family:'Segoe UI',Arial,sans-serif;text-align:left;}
#tourCard .tour-n{font-size:.7rem;letter-spacing:1px;color:#a99bc6;text-transform:uppercase;margin-bottom:2px;}
#tourCard h3{color:#ffd54a;font-size:1.1rem;margin:0 0 6px;}
#tourCard p,#tourCard li{font-size:.88rem;line-height:1.45;color:#ddd3ee;margin:0 0 7px;}
#tourCard ul{margin:0 0 4px;padding-left:18px;}
#tourCard .yl{color:#ffd54a;}
#tourCard label{display:flex;align-items:center;gap:7px;font-size:.78rem;color:#a99bc6;cursor:pointer;margin:4px 0 10px;}
#tourCard input{accent-color:#ffd54a;}
.tour-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tour-dots{display:flex;gap:5px;}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:#4a3d66;}
.tour-dots i.on{background:#ffd54a;}
.tour-btns{display:flex;gap:8px;}
#tourCard button{padding:8px 13px;border-radius:9px;font-weight:800;font-size:.85rem;cursor:pointer;border:1px solid #3d3058;background:#1d1630;color:#ddd3ee;}
#tourCard button.primary{background:#ffd54a;border-color:#ffd54a;color:#181000;}
#ver{font-size:.7rem;color:#a99bc6;opacity:.75;letter-spacing:.5px;text-shadow:0 1px 4px #000;}
#histPanel{display:none;flex-direction:column;align-items:center;gap:8px;width:min(94vw,460px);max-height:calc(100dvh - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
#histPanel.open{display:flex;}
.hist-open .iconbtn{visibility:hidden;} .hist-open #ov{background:rgba(6,4,12,.88);}   /* the calendar is wide: nothing peeks over or through it */
#histList{width:100%;display:flex;flex-direction:column;gap:6px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;width:100%;}
#calTitle{font-weight:800;color:#f2ecff;font-size:1.05rem;}
.cal-head .mini:disabled{opacity:.3;cursor:default;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;}
.cal-dow{color:#a08cc0;font-size:.68rem;font-weight:700;text-align:center;padding-bottom:2px;}
.cal-day{aspect-ratio:1;border-radius:8px;background:rgba(29,22,48,.75);border:1px solid #3a2d50;color:#9b8cb8;font:600 .72rem 'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:3px 0 0;position:relative;}
.cal-day.blank{visibility:hidden;}
.cal-day.has{cursor:pointer;color:#f2ecff;border-color:#5d4c82;}
.cal-day img{width:50%;margin:auto 0 14%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}
.cal-day .cnt{position:absolute;right:3px;bottom:1px;font-size:.62rem;color:#ffd54a;font-weight:800;}
.cal-day.today{box-shadow:inset 0 0 0 1px rgba(255,213,74,.45);}
.cal-day.sel{background:rgba(255,213,74,.18);border-color:#ffd54a;}
.cal-sum{color:#ddd3ee;font-size:.85rem;min-height:1.2em;}
.cal-sum button{margin-left:6px;}
#histList .hdel{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:6px;color:#ddd3ee;font-size:.8rem;}
#histList .hrow{border:1px solid #3a2d50;border-radius:9px;background:rgba(29,22,48,.9);text-align:left;}
#histList .hhead{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:none;border:0;color:#f2ecff;cursor:pointer;text-align:left;font:inherit;}
#histList .hhead .hwhen{color:#a08cc0;font-size:.75rem;font-weight:700;}
#histList .hhead .hname{font-weight:800;}
#histList .hhead .hopt{color:#a08cc0;font-size:.75rem;}
#histList .hhead .hscore{margin-left:auto;font-weight:800;font-size:1.05rem;white-space:nowrap;}
#histList .hcard{display:none;padding:2px 8px 10px;} #histList .hrow.open .hcard{display:block;}
#histList table{width:100%;}
#histList .hempty{color:#a08cc0;padding:14px;text-align:center;}
#startbtn{margin-top:6px;padding:11px 34px;background:#ffd54a;color:#181000;border:none;border-radius:8px;
  font-size:clamp(.95rem,2.6vw,1.15rem);font-weight:800;cursor:pointer;letter-spacing:1px;}
#startbtn:hover{background:#ffe27a;}
.iconbtn{position:fixed;top:6vh;z-index:25;border:none;background:none;color:#ddd3ee;display:flex;align-items:center;justify-content:center;
  height:1em;font-size:4em;line-height:1;padding:0;opacity:0.9;cursor:pointer;transition:transform .15s,opacity .15s;}
.iconbtn:hover{opacity:1;}
#cog{left:12px;} #cog:hover{transform:rotate(45deg);}
#mute{right:12px;}
#view{right:12px;}
.iconbtn svg{width:0.8em;height:0.8em;display:block;overflow:visible;
  filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000) drop-shadow(0 0 3px rgba(0,0,0,.55));}
#view.on{color:#ffd54a;}
#settings{position:fixed;inset:0;z-index:26;display:none;align-items:center;justify-content:center;background:rgba(2,2,8,.62);}
#settings.open{display:flex;}
.modal-card{width:min(94vw,480px);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:16px;
  background:rgba(18,14,28,.98);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);}
@media (max-width:520px){ .modal-card{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:none;} }
.app-title{text-align:center;color:#ffd54a;font-size:1.6rem;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px rgba(255,170,0,.45);margin-bottom:-4px;}
.app-title .emoji{text-shadow:none;}
.modal-top{position:sticky;top:-22px;z-index:3;margin:-22px -22px 0;padding:22px 22px 12px;background:inherit;display:flex;flex-direction:column;gap:16px;border-bottom:1px solid rgba(255,255,255,.08);}
.modal-head{display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{color:#ffd54a;font-size:1.2rem;letter-spacing:1px;}
#settingsClose{background:none;border:none;color:#b7a6d6;font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer;}
#settingsClose:hover{color:#fff;}
.sec-label{color:#b7a6d6;font-size:.8rem;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
.grid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
.picker{display:flex;align-items:center;gap:6px;}
.picker .grid{flex:1 1 auto;min-width:0;}
.grid.scroll{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scroll-snap-type:x mandatory;touch-action:pan-x;}
.grid.scroll .tile{scroll-snap-align:center;}
.navbtn{flex:0 0 auto;width:30px;align-self:stretch;min-height:46px;border:1px solid #3d3058;border-radius:8px;background:#1d1630;color:#ddd3ee;font-size:1.4rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s;}
.navbtn:hover{border-color:#6a5a90;color:#fff;} .navbtn:active{background:#2a2040;}
.tile{flex:0 0 62px;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:6px 4px;text-align:center;background:rgba(255,255,255,.05);transition:background .12s,border-color .12s;}
.tile:hover{background:rgba(255,255,255,.11);}
.tile.selected{border-color:#ffd54a;background:rgba(255,213,74,.14);}
.tile img.ball3d{width:100%;aspect-ratio:1;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));}
.tile .label{font-size:.68rem;color:#ddd3ee;margin-top:5px;}
.toggle{width:100%;padding:11px;border:1px solid #3d3058;border-radius:9px;background:#1d1630;color:#ddd3ee;font-size:.9rem;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .12s;}
.toggle:hover{border-color:#6a5a90;}
.toggle.on{background:#ffd54a;color:#181000;border-color:#ffd54a;}
.seg{display:flex;border:1px solid #3d3058;border-radius:9px;overflow:hidden;}
.seg label{flex:1;cursor:pointer;display:flex;}
.seg input{position:absolute;opacity:0;pointer-events:none;}
.seg span{flex:1;display:flex;flex-direction:column;justify-content:center;padding:9px 4px;text-align:center;background:#1d1630;color:#ddd3ee;font-size:.88rem;font-weight:700;border-left:1px solid #3d3058;transition:all .12s;}
.seg label:first-child span{border-left:none;}
.seg span small{display:block;font-size:.68rem;font-weight:600;opacity:.75;}
.seg input:checked+span{background:#ffd54a;color:#181000;}
</style>
</head>
<body>
<div id="hud"><div id="board"></div></div>
<div id="msg"></div>
<div id="celebrate"></div>
<button id="cog" class="iconbtn" title="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94a7.6 7.6 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.61-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 00-.61.22L2.68 8.84a.5.5 0 00.12.64l2.03 1.58a7.6 7.6 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32a.5.5 0 00.61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 00.5.42h3.84a.5.5 0 00.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 00.61-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg></button>
<button id="mute" class="iconbtn" title="Mute"></button>
<button id="view" class="iconbtn" title="Overview"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3L3 5.5v15.5l6-2.5 6 2.5 6-2.5V3l-6 2.5L9 3zm0 2.2l6 2.5v11.1l-6-2.5V5.2z"/></svg></button>
<div id="settings">
  <div class="modal-card">
    <div class="modal-top">
      <div class="app-title">Just Putt <span class="emoji">⛳</span></div>
      <div class="modal-head"><h3>Settings</h3><button id="settingsClose" aria-label="Close">✕</button></div>
    </div>
    <div class="sec"><div class="sec-label">Ball</div>
      <div class="picker"><button class="navbtn" data-grid="ballGrid" data-dir="-1" aria-label="Previous ball">‹</button><div id="ballGrid" class="grid scroll"></div><button class="navbtn" data-grid="ballGrid" data-dir="1" aria-label="Next ball">›</button></div>
    </div>
    <div class="sec"><div class="sec-label" id="maxLbl">Max over par</div>
      <div class="seg" role="radiogroup" aria-labelledby="maxLbl">
        <label><input type="radio" name="maxover" value="4"><span>+4</span></label>
        <label><input type="radio" name="maxover" value="8"><span>+8</span></label>
        <label><input type="radio" name="maxover" value="0"><span>No limit</span></label>
      </div>
    </div>
    <div class="sec"><div class="sec-label" id="todLbl">Time of day</div>
      <div class="seg" role="radiogroup" aria-labelledby="todLbl">
        <label><input type="radio" name="tod" value="0"><span>Morning</span></label>
        <label><input type="radio" name="tod" value="1"><span>Midday</span></label>
        <label><input type="radio" name="tod" value="2"><span>Golden hour</span></label>
        <label><input type="radio" name="tod" value="3"><span>Night</span></label>
      </div>
    </div>
    <button class="toggle" id="setGuide"></button>
    <div class="sec"><div class="sec-label" id="gfxLbl">Graphics</div>
      <div class="seg" role="radiogroup" aria-labelledby="gfxLbl">
        <label><input type="radio" name="gfx" value="auto"><span>Auto<small id="gfxAutoLbl"></small></span></label>
        <label><input type="radio" name="gfx" value="high"><span>High</span></label>
        <label><input type="radio" name="gfx" value="medium"><span>Medium</span></label>
        <label><input type="radio" name="gfx" value="low"><span>Low</span></label>
      </div>
    </div>
    <button class="toggle" id="setTour"></button>
    <button class="toggle" id="setFps"></button>
    <button class="toggle" id="newGameBtn">New Game</button>
  </div>
</div>
<div id="stage"></div>
<div id="fps"></div><div id="gfxNote"></div><div id="busy"><div class="spin"></div><small>LOADING</small></div>
<div id="loader"><h1>⛳ JUST PUTT</h1><div class="spin"></div><small>LOADING</small></div>
<div id="ov">
  <h2>⛳ JUST PUTT</h2>
  <p></p>
  <div id="coursePick"><div class="cp-label" id="cpLabel"></div>
    <div class="cp-grid"><button data-c="front">Front 9</button><button data-c="back">Back 9</button><button data-c="all">All 18</button><button data-c="hist" class="wide">History</button></div></div>
  <div id="histPanel"><div class="cp-label">History</div>
    <div class="cal-head"><button class="mini" id="calPrev" aria-label="Previous month">‹</button><span id="calTitle"></span><button class="mini" id="calNext" aria-label="Next month">›</button></div>

function envStep(dt,windX,windZ,strength){

  w.x+=(windX/l*s-w.x)*Math.min(1,dt*2); w.y+=(windZ/l*s-w.y)*Math.min(1,dt*2);
  ENV.cloudOff.value.x-=windX/l*dt*(0.004+s*0.006); ENV.cloudOff.value.y-=windZ/l*dt*(0.004+s*0.006);
  for(let i=ENV.parts.length-1;i>=0;i--){ const P=ENV.parts[i]; P.t+=dt; const u=P.t/P.life;
    if(u>=1||!P.obj.parent){ if(P.obj.parent) P.obj.parent.remove(P.obj); P.obj.geometry.dispose(); P.obj.material.dispose(); ENV.parts.splice(i,1); continue; }
    if(P.ring){ P.obj.scale.setScalar(P.r0+(P.r1-P.r0)*(1-Math.pow(1-u,2))); P.obj.material.opacity=P.op*(1-u); continue; }
    const a=P.obj.geometry.attributes.position, v=P.vel;
    for(let j=0;j<a.count;j++){ v[j*3+1]-=P.g*dt; let y=a.getY(j)+v[j*3+1]*dt; if(y<P.floor){ y=P.floor; v[j*3]*=0.3; v[j*3+2]*=0.3; v[j*3+1]=0; }
      a.setXYZ(j,a.getX(j)+v[j*3]*dt,y,a.getZ(j)+v[j*3+2]*dt); }
    a.needsUpdate=true; P.obj.material.opacity=P.op*(1-u*u); }
}

  for(let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i), z=p.getZ(i), k=x.toFixed(3)+','+y.toFixed(3)+','+z.toFixed(3);
    const s=seen[k]||(seen[k]=0.78+NZ.fbm(x/r*1.3+seed,z/r*1.3+y/r*0.7,3,0,0)*0.5); p.setXYZ(i,x*s,Math.max(y*s*0.72,-r*0.18),z*s); }
  g.computeVertexNormals(); return g;
}

  if(!isNight()) return;

// ── History: every finished round, tap one for its scorecard ──
function openHist(on){ document.getElementById('histPanel').classList.toggle('open',on); document.body.classList.toggle('hist-open',on); document.getElementById('coursePick').style.display=on?'none':'';
  const sb=document.getElementById('startbtn'), p=document.querySelector('#ov p'), h2=document.querySelector('#ov h2');
  if(on){ sb.dataset.hwas=sb.style.display; sb.style.display='none'; p.dataset.hwas=p.style.display; p.style.display='none'; h2.dataset.hwas=h2.style.display; h2.style.display='none'; openCal(); }
  else { if(sb.dataset.hwas!=null){ sb.style.display=sb.dataset.hwas; delete sb.dataset.hwas; } if(p.dataset.hwas!=null){ p.style.display=p.dataset.hwas; delete p.dataset.hwas; } if(h2.dataset.hwas!=null){ h2.style.display=h2.dataset.hwas; delete h2.dataset.hwas; } } }
// History is a month calendar: a day you played shows the ball you finished with (a count if there's more than one round);
// tap it for that day's rounds, and a round for its scorecard
const cal={y:0,m:0,day:null}, thumbCache={};
const ballIcon=id=>thumbCache[id]||(thumbCache[id]=ballThumb(BALL_TYPES.some(b=>b.id===id)?id:'white',48));
const dayKey=t=>{ const d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
function openCal(){ const a=roundHistory(), d=new Date(a.length?a[0].at:Date.now()); cal.y=d.getFullYear(); cal.m=d.getMonth(); cal.day=a.length?dayKey(a[0].at):null; drawHist(); }
function drawHist(){ const all=roundHistory(), first=new Date(cal.y,cal.m,1), days=new Date(cal.y,cal.m+1,0).getDate(), today=dayKey(Date.now());
  const inMonth=all.filter(r=>{ const d=new Date(r.at); return d.getFullYear()===cal.y&&d.getMonth()===cal.m; }), byDay={};
  for(const r of inMonth){ (byDay[dayKey(r.at)]=byDay[dayKey(r.at)]||[]).push(r); }
  document.getElementById('calTitle').textContent=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const oldest=all.length?new Date(all[all.length-1].at):new Date(), newest=new Date(Math.max(Date.now(),all.length?all[0].at:0));
  document.getElementById('calPrev').disabled=cal.y*12+cal.m<=oldest.getFullYear()*12+oldest.getMonth();
  document.getElementById('calNext').disabled=cal.y*12+cal.m>=newest.getFullYear()*12+newest.getMonth();
  const g=document.getElementById('calGrid'); g.innerHTML='';
  for(let i=0;i<7;i++){ const h=document.createElement('div'); h.className='cal-dow'; h.textContent=new Date(2026,10,1+i).toLocaleDateString(undefined,{weekday:'narrow'}); g.appendChild(h); }   // (Nov 1 2026 is a Sunday)
  for(let i=0;i<first.getDay();i++){ const b=document.createElement('div'); b.className='cal-day blank'; g.appendChild(b); }
  for(let n=1;n<=days;n++){ const k=cal.y+'-'+cal.m+'-'+n, rs=byDay[k], c=document.createElement('div'); c.className='cal-day'+(rs?' has':'')+(k===today?' today':'')+(k===cal.day&&rs?' sel':'');
    c.innerHTML=`<span>${n}</span>`+(rs?`<img alt="" src="${ballIcon(rs[0].ball)}">`+(rs.length>1?`<span class="cnt">${rs.length}</span>`:''):'');
    if(rs){ c.setAttribute('role','button'); c.setAttribute('aria-label',`${n}: ${rs.length} round${rs.length>1?'s':''}`); c.tabIndex=0; c.addEventListener('click',()=>{ cal.day=k; drawHist(); }); }
    g.appendChild(c); }
  // the month in a line: rounds, best and average against par
  const sum=document.getElementById('calSum');
  if(inMonth.length){ const rel=inMonth.map(r=>r.scores.reduce((x,y)=>x+y,0)-r.pars.reduce((x,y)=>x+y,0)), bi=rel.indexOf(Math.min(...rel)), avg=rel.reduce((x,y)=>x+y,0)/rel.length;
    sum.textContent=`${inMonth.length} round${inMonth.length>1?'s':''} · best ${relStr(rel[bi])} (${inMonth[bi].name}) · average ${avg>0?'+':''}${avg.toFixed(1)}`; }
  else { sum.textContent=all.length?'No rounds this month.':'No finished rounds yet.';
    if(all.length){ const b=document.createElement('button'); b.className='mini'; b.textContent='Latest round'; b.addEventListener('click',openCal); sum.appendChild(b); } }
  // the chosen day's rounds
  const box=document.getElementById('histList'), list=cal.day&&byDay[cal.day]||[]; box.innerHTML='';
  for(const r of list){ const s=r.scores.reduce((x,y)=>x+y,0), rel=s-r.pars.reduce((x,y)=>x+y,0), d=new Date(r.at);
    const when=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    const row=document.createElement('div'); row.className='hrow'+(list.length===1?' open':'');
    row.innerHTML=`<button class="hhead"><span><span class="hwhen">${when}</span><br><span class="hname">${escH(r.name)}</span>${r.opts?`<br><span class="hopt">${escH(r.opts)}</span>`:''}</span><span class="hscore">${s} <small>(${relStr(rel)})</small></span></button>`
      +`<div class="hcard">${cardHTML(r.nos,r.pars,r.scores)}<div class="hdel"><button class="mini" data-act="del">Delete round</button></div></div>`;
    row.querySelector('.hhead').addEventListener('click',()=>row.classList.toggle('open'));
    row.querySelector('[data-act=del]').addEventListener('click',e=>{ const w=e.target.parentNode; w.innerHTML='Delete this round? <button class="mini" data-act="yes">Delete</button><button class="mini" data-act="no">Keep</button>';
      w.querySelector('[data-act=no]').addEventListener('click',drawHist);
      w.querySelector('[data-act=yes]').addEventListener('click',()=>{ try{ localStorage.setItem(HIST_KEY,JSON.stringify(roundHistory().filter(x=>x.at!==r.at))); }catch(err){} drawHist(); }); });
    box.appendChild(row); } }
document.getElementById('calPrev').addEventListener('click',()=>{ if(--cal.m<0){ cal.m=11; cal.y--; } cal.day=null; drawHist(); });
document.getElementById('calNext').addEventListener('click',()=>{ if(++cal.m>11){ cal.m=0; cal.y++; } cal.day=null; drawHist(); });
document.getElementById('histBack').addEventListener('click',()=>openHist(false));
window.addEventListener('keydown',e=>{ if(tour.open) tourKey(e); });
function boot(){
  setupSettings();
  document.querySelector('#ov p').innerHTML='';   // (how to play is covered by the first-hole tips)
    +HOLES.length+' holes, par '+HOLES.reduce((a,h)=>a+h.par,0)+' — or just the front or back nine · a hole stops at 4 over par (change it in Settings). Water costs a stroke. The map button shows the whole hole.';
  initScene(); bindInput();
  H=HOLES[0]; buildHole(); prewarmTOD(); ball.x=H.tee[0]; ball.z=H.tee[1]; phase='menu'; camMode='overview';
  resumeSave=loadGame(); OV_TITLE=document.querySelector('#ov h2').textContent; showStart(resumeSave?'resume':'start',false);
  try{ if(sessionStorage.getItem('lowgfxReload')){ sessionStorage.removeItem('lowgfxReload'); document.getElementById('ov').classList.remove('show'); if(resumeSave){ const g=resumeSave; resumeSave=null; resumeGame(g); } else newGame(); document.getElementById('settings').classList.add('open'); } }catch(e){}
  if(gfxSwitched()){ document.getElementById('ov').classList.remove('show'); if(resumeSave){ const g=resumeSave; resumeSave=null; resumeGame(g); } }
  buildHUD();
  requestAnimationFrame(t=>{ lastT=t; loop(t); });
}
// show the title + spinner first, then build the scene; the start card appears once the first frames have drawn
// (that first render is where the shaders compile, so it's part of the wait)
function bootDone(){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ const L=document.getElementById('loader'); L.classList.add('done'); setTimeout(()=>L.remove(),500);
  if(phase==='menu') document.getElementById('ov').classList.add('show'); })); }
requestAnimationFrame(()=>setTimeout(()=>{ try{ boot(); bootDone(); }catch(err){ document.getElementById('loader').remove(); showFatal(err); } },0));
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
